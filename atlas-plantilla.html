<title>Atlas de Casos de Uso SPLG</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<style>
:root{
  --ground:#EFF3F6; --surface:#FFFFFF; --sunken:#F6F8FA;
  --ink:#16202B; --ink-soft:#3D4C5A; --muted:#6A7B8B;
  --rule:#DCE4EA; --rule-strong:#C2CEd8;
  --cua:#2E6F9E; --cue:#1F7A4C; --dss:#8A5A2B; --dsd:#6B4C9A;
  --cua-bg:#E6EFF6; --cue-bg:#E3F1E9; --dss-bg:#F5ECE0; --dsd-bg:#EEE8F5;
  --crit:#A6352B; --imp:#8A6100; --sec:#6A7B8B;
  --shadow:0 1px 2px rgba(22,32,43,.06),0 10px 28px -20px rgba(22,32,43,.3);
  --mermaid:default;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0F141A; --surface:#181F27; --sunken:#131A21;
  --ink:#E6ECF2; --ink-soft:#B6C3CE; --muted:#8394A3;
  --rule:#28323C; --rule-strong:#39454F;
  --cua:#6FAFDC; --cue:#57C08C; --dss:#D0A268; --dsd:#AE93DC;
  --cua-bg:#16262F; --cue-bg:#152B21; --dss-bg:#2B2318; --dsd-bg:#231D30;
  --crit:#E6857A; --imp:#D9AE58; --sec:#8394A3;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px -20px rgba(0,0,0,.8);
}}
:root[data-theme="dark"]{
  --ground:#0F141A; --surface:#181F27; --sunken:#131A21;
  --ink:#E6ECF2; --ink-soft:#B6C3CE; --muted:#8394A3;
  --rule:#28323C; --rule-strong:#39454F;
  --cua:#6FAFDC; --cue:#57C08C; --dss:#D0A268; --dsd:#AE93DC;
  --cua-bg:#16262F; --cue-bg:#152B21; --dss-bg:#2B2318; --dsd-bg:#231D30;
  --crit:#E6857A; --imp:#D9AE58; --sec:#8394A3;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px -20px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:314px 1fr;height:100vh}
@media(max-width:860px){.app{grid-template-columns:1fr;height:auto}}

/* ---------- panel izquierdo ---------- */
aside{background:var(--surface);border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0}
@media(max-width:860px){aside{border-right:none;border-bottom:1px solid var(--rule);max-height:56vh}}
.brand{padding:18px 20px 14px;border-bottom:1px solid var(--rule)}
.brand h1{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:1.24rem;margin:0 0 2px;letter-spacing:-.01em}
.brand p{margin:0;font-size:11.5px;color:var(--muted);font-family:"IBM Plex Mono",monospace;letter-spacing:.05em}
.tools{padding:12px 16px;border-bottom:1px solid var(--rule);display:grid;gap:9px}
input[type=search]{width:100%;padding:9px 11px;border:1px solid var(--rule-strong);border-radius:4px;
  background:var(--sunken);color:var(--ink);font:inherit;font-size:14px}
input[type=search]:focus{outline:2px solid var(--cua);outline-offset:1px}
.filters{display:flex;gap:5px;flex-wrap:wrap}
.filters button{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.05em;
  padding:3px 9px;border-radius:99px;border:1px solid var(--rule-strong);background:transparent;
  color:var(--muted);cursor:pointer}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.filters button:focus-visible{outline:2px solid var(--cua);outline-offset:1px}
.list{overflow-y:auto;flex:1;padding:6px 0 24px;min-height:0}
.grp{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);padding:14px 20px 5px;position:sticky;top:0;background:var(--surface)}
.item{display:flex;gap:9px;align-items:baseline;padding:6px 20px;cursor:pointer;border:none;
  background:transparent;width:100%;text-align:left;color:var(--ink);font:inherit;font-size:13.5px}
.item:hover{background:var(--sunken)}
.item[aria-current=true]{background:var(--cua-bg);box-shadow:inset 3px 0 0 var(--cua)}
.item:focus-visible{outline:2px solid var(--cua);outline-offset:-2px}
.item .cod{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);flex:none;
  font-variant-numeric:tabular-nums}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .dot{width:6px;height:6px;border-radius:99px;flex:none}
.dot.Crítico{background:var(--crit)}.dot.Importante{background:var(--imp)}.dot.Secundario{background:var(--sec)}

/* ---------- panel derecho ---------- */
main{overflow-y:auto;min-height:0;padding:0 0 90px}
.pad{max-width:900px;margin:0 auto;padding:30px 30px 0}
@media(max-width:860px){.pad{padding:22px 18px 0}}
.head{border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:20px}
.head .over{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);
  letter-spacing:.09em;display:flex;gap:14px;flex-wrap:wrap;margin-bottom:9px;align-items:center}
.head h2{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:clamp(1.6rem,4vw,2.25rem);
  margin:0;line-height:1.12;letter-spacing:-.015em;text-wrap:balance}
.chip{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;padding:2px 8px;
  border-radius:99px;border:1px solid currentColor}
.chip.Crítico{color:var(--crit)}.chip.Importante{color:var(--imp)}.chip.Secundario{color:var(--sec)}
.meta{display:flex;gap:8px 26px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:11px}
.meta b{color:var(--ink-soft);font-weight:500}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:4px;
  margin-bottom:20px;box-shadow:var(--shadow);overflow:hidden}
.card > header{display:flex;align-items:center;gap:11px;padding:12px 20px;border-bottom:1px solid var(--rule)}
.card > header .tag{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:500;
  letter-spacing:.07em;padding:2px 8px;border-radius:3px}
.card > header h3{margin:0;font-size:14.5px;font-weight:600;flex:1}
.card > header .src{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);text-align:right}
.card .body{padding:18px 20px}
.k-cua .tag{background:var(--cua-bg);color:var(--cua)} .k-cua{border-top:2px solid var(--cua)}
.k-cue .tag{background:var(--cue-bg);color:var(--cue)} .k-cue{border-top:2px solid var(--cue)}
.k-dss .tag{background:var(--dss-bg);color:var(--dss)} .k-dss{border-top:2px solid var(--dss)}
.k-dsd .tag{background:var(--dsd-bg);color:var(--dsd)} .k-dsd{border-top:2px solid var(--dsd)}
.k-doc{border-top:2px solid var(--rule-strong)} .k-doc .tag{background:var(--sunken);color:var(--muted)}

dl.fields{display:grid;grid-template-columns:auto 1fr;gap:9px 20px;margin:0}
dl.fields dt{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);padding-top:3px;white-space:nowrap}
dl.fields dd{margin:0;color:var(--ink-soft);font-size:14.5px}
@media(max-width:600px){dl.fields{grid-template-columns:1fr;gap:3px 0}dl.fields dd{margin-bottom:10px}}

h4.sub{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin:22px 0 9px;font-weight:500}
.scroller{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 13px;text-align:left;border-bottom:1px solid var(--rule);vertical-align:top}
thead th{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);font-weight:500;border-bottom:1px solid var(--rule-strong)}
tbody tr:last-child td{border-bottom:none}
td.p{font-family:"IBM Plex Mono",monospace;width:1%;white-space:nowrap;color:var(--muted);
  font-variant-numeric:tabular-nums}
code{font-family:"IBM Plex Mono",monospace;font-size:.88em;background:var(--sunken);
  padding:1px 5px;border-radius:2px}
.note{background:var(--sunken);border-left:3px solid var(--rule-strong);padding:12px 16px;
  border-radius:0 3px 3px 0;font-size:14px;color:var(--ink-soft);margin-top:14px}
.note b{color:var(--ink)}

.diagram{background:var(--sunken);border-radius:3px;padding:16px;overflow-x:auto;text-align:center}
.diagram svg{max-width:100%;height:auto}
.dtitle{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);margin-bottom:9px;
  letter-spacing:.04em}
.shared{font-size:12px;color:var(--muted);margin-top:9px;font-family:"IBM Plex Mono",monospace}
.umlimg{width:100%;border-radius:3px;background:#fff;padding:10px}

table.prov td:first-child{font-family:"IBM Plex Mono",monospace;font-size:12.5px;white-space:nowrap;color:var(--ink-soft)}
table.prov td:nth-child(2){font-size:13.5px;color:var(--muted);white-space:nowrap}
table.prov td:last-child{font-size:13.5px}

.empty{padding:80px 30px;text-align:center;color:var(--muted);max-width:460px;margin:0 auto}
.empty h2{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:1.5rem;color:var(--ink);margin:0 0 10px}
.kb{font-family:"IBM Plex Mono",monospace;font-size:11px;border:1px solid var(--rule-strong);
  border-radius:3px;padding:1px 6px;color:var(--ink-soft)}
button.ghost{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.05em;padding:4px 11px;
  border-radius:99px;border:1px solid var(--rule-strong);background:transparent;color:var(--ink-soft);cursor:pointer}
button.ghost:hover{background:var(--sunken)}
button.ghost:focus-visible{outline:2px solid var(--cua);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <aside>
    <div class="brand">
      <h1>Atlas de Casos de Uso</h1>
      <p>SPLG · 108 casos · 4 artefactos</p>
    </div>
    <div class="tools">
      <input type="search" id="q" placeholder="Buscar: login, pedido, CU-005…" autocomplete="off" aria-label="Buscar caso de uso">
      <div class="filters" id="filtros">
        <button data-f="todos" aria-pressed="true">TODOS</button>
        <button data-f="Crítico" aria-pressed="false">CRÍTICOS</button>
        <button data-f="modulo" aria-pressed="false">MÓDULOS</button>
        <button data-f="uml" aria-pressed="false">DIAGRAMAS UML</button>
      </div>
    </div>
    <div class="list" id="lista"></div>
  </aside>
  <main id="main"><div class="pad" id="detalle"></div></main>
</div>

<script id="datos" type="application/json">__DATOS__</script>
<script>
(function(){
  "use strict";
  var D = JSON.parse(document.getElementById("datos").textContent);
  var CU = D.cu, SS = D.subsistemas;
  var codigos = Object.keys(CU).sort();
  var filtro = "todos", sel = null, contador = 0;

  function esOscuro(){
    var t = document.documentElement.getAttribute("data-theme");
    if (t) return t === "dark";
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function initMermaid(){
    if (!window.mermaid) return;
    mermaid.initialize({startOnLoad:false, securityLevel:"loose",
      theme: esOscuro() ? "dark" : "default",
      themeVariables:{fontFamily:'"IBM Plex Sans", sans-serif', fontSize:"13px"}});
  }
  initMermaid();

  function esc(s){ return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function md(s){ return esc(s)
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>"); }

  /* ---------- panel izquierdo ---------- */
  function visible(c){
    var v = CU[c], q = document.getElementById("q").value.trim().toLowerCase();
    if (filtro === "Crítico" && (v.cua.calificacion||"") !== "Crítico") return false;
    if (filtro === "modulo" && !v.modulo) return false;
    if (!q) return true;
    var heno = (c + " " + (v.cua.nombre||"") + " " + (v.cua.subsistema||"") + " " +
                (v.cua.descripcion||"") + " " + (v.cua.actores||"")).toLowerCase();
    return q.split(/\s+/).every(function(t){ return heno.indexOf(t) >= 0; });
  }
  function pintarLista(){
    var cont = document.getElementById("lista");
    if (filtro === "uml"){
      cont.innerHTML = '<div class="grp">Diagramas en notación UML</div>' +
        '<button class="item" data-uml="contexto"><span class="cod">SIS</span>' +
        '<span class="nm">Diagrama del sistema</span></button>' +
        Object.keys(SS).sort().filter(function(k){return SS[k].uml;}).map(function(k){
          return '<button class="item" data-uml="'+k+'"><span class="cod">'+k+'</span>' +
                 '<span class="nm">'+esc(SS[k].nombre)+'</span></button>'; }).join("");
      enlazar(cont); return;
    }
    var grupos = {}, orden = [];
    codigos.filter(visible).forEach(function(c){
      var g = CU[c].cua.subsistema || "Sin subsistema";
      if (!grupos[g]) { grupos[g] = []; orden.push(g); }
      grupos[g].push(c);
    });
    if (!orden.length){ cont.innerHTML = '<div class="grp">Sin resultados</div>'; return; }
    cont.innerHTML = orden.map(function(g){
      return '<div class="grp">'+esc(g)+'</div>' + grupos[g].map(function(c){
        var v = CU[c], cal = v.cua.calificacion || "Secundario";
        return '<button class="item" data-cu="'+c+'" aria-current="'+(c===sel)+'">' +
          '<span class="dot '+esc(cal)+'"></span><span class="cod">'+c.replace("CU-","")+'</span>' +
          '<span class="nm">'+esc(v.cua.nombre||"")+'</span></button>';
      }).join("");
    }).join("");
    enlazar(cont);
  }
  function enlazar(cont){
    cont.querySelectorAll("[data-cu]").forEach(function(b){
      b.onclick = function(){ abrir(b.dataset.cu); };
    });
    cont.querySelectorAll("[data-uml]").forEach(function(b){
      b.onclick = function(){ abrirUml(b.dataset.uml); };
    });
  }

  /* ---------- diagramas ---------- */
  function dibujar(destino, src){
    if (!window.mermaid){ destino.innerHTML = '<pre>'+esc(src)+'</pre>'; return; }
    var id = "m" + (++contador);
    try {
      mermaid.render(id, src).then(function(r){ destino.innerHTML = r.svg; })
        .catch(function(){ destino.innerHTML = '<pre>'+esc(src)+'</pre>'; });
    } catch(e){ destino.innerHTML = '<pre>'+esc(src)+'</pre>'; }
  }
  function bloqueDiagramas(lista, clase, tag, titulo, fuente){
    if (!lista || !lista.length) return "";
    return '<section class="card '+clase+'"><header><span class="tag">'+tag+'</span>' +
      '<h3>'+titulo+'</h3><span class="src">'+fuente+'</span></header><div class="body">' +
      lista.map(function(d,i){
        return (lista.length>1 ? '<div class="dtitle">'+esc(d.titulo)+'</div>' : '') +
          '<div class="diagram" data-src="'+clase+'-'+i+'"></div>' +
          (d.comparte && d.comparte.length ?
            '<p class="shared">Diagrama compartido con '+d.comparte.join(" · ")+
            ': modelan una misma interacción.</p>' : '');
      }).join("") + '</div></section>';
  }

  /* ---------- detalle ---------- */
  function abrir(c){
    sel = c; location.hash = c;
    var v = CU[c], e = v.cue || {}, a = v.cua || {};
    var cal = a.calificacion || "";
    var h = '<div class="head"><div class="over"><span>'+c+'</span>' +
      (cal ? '<span class="chip '+esc(cal)+'">'+esc(cal).toUpperCase()+'</span>' : '') +
      (v.modulo ? '<span class="chip">MÓDULO '+v.modulo.codigo+'</span>' : '') +
      '</div><h2>'+esc(a.nombre||e.nombre||c)+'</h2>' +
      '<div class="meta"><span><b>Actores</b> '+esc(a.actores||"—")+'</span>' +
      '<span><b>Subsistema</b> '+esc(a.subsistema||"—")+'</span>' +
      (e.estado ? '<span><b>Estado</b> '+esc(e.estado)+'</span>' : '') + '</div></div>';

    /* CUA */
    h += '<section class="card k-cua"><header><span class="tag">CUA</span>' +
      '<h3>Caso de uso de alto nivel</h3><span class="src">Doc 0 · §7</span></header>' +
      '<div class="body"><p style="margin:0;color:var(--ink-soft)">'+md(a.descripcion||"")+'</p></div></section>';

    /* CUE */
    h += '<section class="card k-cue"><header><span class="tag">CUE</span>' +
      '<h3>Caso de uso expandido</h3><span class="src">Doc 1 · §7</span></header><div class="body">';
    h += '<dl class="fields">';
    [["Objetivos",e.objetivos],["Requisitos",e.requisitos],["Descripción",e.descripcion],
     ["Precondición",e.precondicion]].forEach(function(p){
      if (p[1]) h += '<dt>'+p[0]+'</dt><dd>'+md(p[1])+'</dd>';
    });
    h += '</dl>';
    if (e.especificacion) h += '<div class="note">'+md(e.especificacion)+'</div>';
    if (e.secuencia && e.secuencia.length){
      h += '<h4 class="sub">Secuencia normal</h4><div class="scroller"><table><thead><tr>' +
        '<th>Paso</th><th>Acción</th></tr></thead><tbody>' +
        e.secuencia.map(function(p){ return '<tr><td class="p">'+esc(p.paso)+'</td><td>'+md(p.accion)+'</td></tr>'; }).join("") +
        '</tbody></table></div>';
    }
    if (e.postcondicion) h += '<div class="note"><b>Postcondición.</b> '+md(e.postcondicion)+'</div>';
    if (e.excepciones && e.excepciones.length){
      h += '<h4 class="sub">Excepciones</h4><div class="scroller"><table><thead><tr>' +
        '<th>Paso</th><th>Acción</th></tr></thead><tbody>' +
        e.excepciones.map(function(p){ return '<tr><td class="p">'+esc(p.paso)+'</td><td>'+md(p.accion)+'</td></tr>'; }).join("") +
        '</tbody></table></div>';
    }
    h += '<h4 class="sub">Cierre</h4><dl class="fields">';
    [["Rendimiento",e.rendimiento],["Frecuencia",e.frecuencia],["Estabilidad",e.estabilidad],
     ["Comentarios",e.comentarios]].forEach(function(p){
      if (p[1]) h += '<dt>'+p[0]+'</dt><dd>'+md(p[1])+'</dd>';
    });
    h += '</dl></div></section>';

    h += bloqueDiagramas(v.dss,"k-dss","DSS","Diagrama de secuencia del sistema","Doc 2 · §2.1");
    h += bloqueDiagramas(v.dsd,"k-dsd","DSD","Diagrama de interacción de diseño","Doc 3 · §4");

    /* respaldo documental */
    if (v.respaldo && v.respaldo.length){
      h += '<section class="card k-doc"><header><span class="tag">DOC</span>' +
        '<h3>Dónde está respaldado</h3><span class="src">'+v.respaldo.length+' referencias</span></header>' +
        '<div class="body"><div class="scroller"><table class="prov"><thead><tr>' +
        '<th>Documento</th><th>Sección</th><th>Qué contiene</th></tr></thead><tbody>' +
        v.respaldo.map(function(r){
          return '<tr><td>'+esc(r.doc)+'</td><td>'+esc(r.sec)+'</td><td>'+esc(r.que)+'</td></tr>';
        }).join("") + '</tbody></table></div></div></section>';
    }

    document.getElementById("detalle").innerHTML = h;
    document.getElementById("main").scrollTop = 0;
    ["dss","dsd"].forEach(function(k){
      (v[k]||[]).forEach(function(d,i){
        var n = document.querySelector('[data-src="k-'+k+'-'+i+'"]');
        if (n) dibujar(n, d.src);
      });
    });
    pintarLista();
  }

  function abrirUml(k){
    sel = null;
    var img = k === "contexto" ? D.contexto : (SS[k] && SS[k].uml);
    var nom = k === "contexto" ? "Diagrama de Casos de Uso del Sistema"
                               : (SS[k] ? SS[k].nombre : k);
    var sub = k === "contexto" ? "Define el límite del sistema y sus actores"
                               : (SS[k] ? SS[k].descripcion : "");
    document.getElementById("detalle").innerHTML =
      '<div class="head"><div class="over"><span>'+esc(k==="contexto"?"SISTEMA":k)+'</span>' +
      '<span class="chip">NOTACIÓN UML</span></div><h2>'+esc(nom)+'</h2>' +
      (sub ? '<div class="meta"><span>'+esc(sub)+'</span></div>' : '') + '</div>' +
      '<section class="card k-doc"><header><span class="tag">UML</span>' +
      '<h3>Diagrama de casos de uso</h3><span class="src">Doc 1 · §3 y §4.3</span></header>' +
      '<div class="body">' + (img ? '<img class="umlimg" alt="'+esc(nom)+'" src="'+img+'">'
                                  : '<p class="note">Diagrama no disponible.</p>') + '</div></section>';
    document.getElementById("main").scrollTop = 0;
    pintarLista();
  }

  function inicio(){
    document.getElementById("detalle").innerHTML =
      '<div class="empty"><h2>Elegí un caso de uso</h2>' +
      '<p>Cada uno muestra sus cuatro artefactos —alto nivel, expandido, diagrama de secuencia del ' +
      'sistema y diagrama de interacción— y en qué documento y sección está respaldado.</p>' +
      '<p style="margin-top:18px"><span class="kb">/</span> para buscar · ' +
      '<span class="kb">↑</span> <span class="kb">↓</span> para recorrer</p>' +
      '<p style="margin-top:22px"><button class="ghost" id="ir1">Abrir CU-001 · Iniciar sesión</button></p></div>';
    var b = document.getElementById("ir1");
    if (b) b.onclick = function(){ abrir("CU-001"); };
  }

  /* ---------- eventos ---------- */
  document.getElementById("q").addEventListener("input", pintarLista);
  document.getElementById("filtros").addEventListener("click", function(ev){
    var b = ev.target.closest("button"); if (!b) return;
    filtro = b.dataset.f;
    this.querySelectorAll("button").forEach(function(x){
      x.setAttribute("aria-pressed", String(x === b)); });
    pintarLista();
  });
  document.addEventListener("keydown", function(ev){
    var q = document.getElementById("q");
    if (ev.key === "/" && document.activeElement !== q){ ev.preventDefault(); q.focus(); q.select(); return; }
    if (ev.key === "Escape" && document.activeElement === q){ q.value=""; pintarLista(); q.blur(); return; }
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp"){
      var vis = codigos.filter(visible); if (!vis.length) return;
      var i = vis.indexOf(sel);
      i = ev.key === "ArrowDown" ? (i+1) % vis.length : (i<=0 ? vis.length-1 : i-1);
      ev.preventDefault(); abrir(vis[i]);
      var el = document.querySelector('[data-cu="'+vis[i]+'"]');
      if (el) el.scrollIntoView({block:"nearest"});
    }
  });
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  if (mq.addEventListener) mq.addEventListener("change", function(){
    initMermaid(); if (sel) abrir(sel);
  });

  pintarLista();
  var h = (location.hash||"").replace("#","");
  if (CU[h]) abrir(h); else inicio();
})();
</script>
