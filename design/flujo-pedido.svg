<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="520" viewBox="0 0 1800 520">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
    <!-- Glow filters per color -->
    <filter id="glow-blue">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-amber">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-green">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-purple">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1800" height="520" fill="url(#bg)" rx="16"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1800" height="4" rx="2" fill="#f59e0b"/>

  <!-- Title -->
  <text x="900" y="52" text-anchor="middle" fill="white" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="bold" letter-spacing="1">Flujo Completo del Pedido</text>
  <text x="900" y="78" text-anchor="middle" fill="#6b7280" font-family="'Segoe UI', Arial, sans-serif" font-size="16">Del pedido a la entrega — 7 pasos</text>

  <!-- ─── ARROWS BETWEEN CIRCLES ─── -->
  <!-- 1→2 -->
  <line x1="172" y1="230" x2="342" y2="230" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <!-- 2→3 -->
  <line x1="430" y1="230" x2="600" y2="230" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <!-- 3→4 -->
  <line x1="688" y1="230" x2="858" y2="230" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <!-- 4→5 -->
  <line x1="946" y1="230" x2="1116" y2="230" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <!-- 5→6 -->
  <line x1="1204" y1="230" x2="1374" y2="230" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>
  <!-- 6→7 -->
  <line x1="1462" y1="230" x2="1632" y2="230" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- ══════════════════════════════════════════ -->
  <!-- STEP 1 — CLIENTE — cx=130 -->
  <!-- ══════════════════════════════════════════ -->
  <!-- Actor badge -->
  <rect x="72" y="108" width="116" height="24" rx="12" fill="#1e3a5f"/>
  <text x="130" y="124" text-anchor="middle" fill="#3b82f6" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold">● CLIENTE</text>
  <!-- Action label -->
  <text x="130" y="160" text-anchor="middle" fill="white" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold">Hace el pedido</text>
  <text x="130" y="178" text-anchor="middle" fill="#9ca3af" font-family="'Segoe UI', Arial, sans-serif" font-size="12">en la app</text>
  <!-- Circle -->
  <circle cx="130" cy="230" r="40" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2.5" filter="url(#glow-blue)"/>
  <text x="130" y="238" text-anchor="middle" fill="#3b82f6" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="bold">1</text>
  <!-- Description -->
  <text x="130" y="292" text-anchor="middle" fill="#6b7280" font-family="'Segoe UI', Arial, sans-serif" font-size="12">Elige producto,</text>
  <text x="130" y="310" text-anchor="middle" fill="#6b7280" font-family="'Segoe UI', Arial, sans-serif" font-size="12">dirección y</text>
  <text x="130" y="328" text-anchor="middle" fill="#6b7280" font-family="'Segoe UI', Arial, sans-serif" font-size="12">franja horaria</text>

  <!-- ══════════════════════════════════════════ -->
  <!-- STEP 2 — SISTEMA — cx=386 -->
  <!-- ══════════════════════════════════════════ -->
  <rect x="318" y="108" width="136" height="24" rx="12" fill="#3d2a00"/>
  <text x="386" y="124" text-anchor="middle" fill="#f59e0b" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold">⚙ SISTEMA AUTO</text>
  <text x="386" y="160" text-anchor="middle" fill="white" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold">Asigna chofer</text>
  <text x="386" y="178" text-anchor="middle" fill="#9ca3af" font-family="'Segoe UI', Arial, sans-serif" font-size="12">automáticamente</text>
  <circle cx="386" cy="230" r="40" fill="#3d2a00" stroke="#f59e0b" stroke-width="2.5" filter="url(#glow-amber)"/>
  <text x="386" y="238" text-anchor="middle" fill="#f59e0b" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="bold">2</text>
  <text x="386" y="292" text-anchor="middle" fill="#6b7280" font-family="'Segoe UI', Arial, sans-serif" font-size="12">Redis GEORADIUS</text>
  <text x="386" y="310" text-anchor="middle" fill="#6b7280" font-family="'Segoe UI', Arial, sans-serif" font-size="12">busca al más</text>
  <text x="386" y="328" text-anchor="middle" fill="#6b7280" font-family="'Segoe UI', Arial, sans-serif" font-size="12">cercano en 5 km</text>

  <!-- ══════════════════════════════════════════ -->
  <!-- STEP 3 — CHOFER — cx=642 -->
  <!-- ══════════════════════════════════════════ -->
  <rect x="580" y="108" width="124" height="24" rx="12" fill="#052e16"/>
  <text x="642" y="124" text-anchor="middle" fill="#10b981" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold">▲ CHOFER</text>
  <text x="642" y="160" text-anchor="middle" fill="white" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold">Recibe la orden</text>
  <text x="642" y="178" text-anchor="middle" fill="#9ca3af" font-family="'Segoe UI', Arial, sans-serif" font-size="12">en &lt; 1 segundo</text>
  <circle cx="642" cy="230" r="40" fill="#052e16" stroke="#10b981" stroke-width="2.5" filter="url(#glow-green)"/>
  <text x="642" y="238" text-anchor="middle" fill="#10b981" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="bold">3</text>
  <text x="642" y="292" text-anchor="middle" fill="#6b7280" font-family="'Segoe UI', Arial, sans-serif" font-size="12">Notificación</text>
  <text x="642" y="310" text-anchor="middle" fill="#6b7280" font-family="'Segoe UI', Arial, sans-serif" font-size="12">WebSocket con</text>
  <text x="642" y="328" text-anchor="middle" fill="#6b7280" font-family="'Segoe UI', Arial, sans-serif" font-size="12">datos del pedido</text>

  <!-- ══════════════════════════════════════════ -->
  <!-- STEP 4 — CHOFER — cx=898 -->
  <!-- ══════════════════════════════════════════ -->
  <rect x="836" y="108" width="124" height="24" rx="12" fill="#052e16"/>
  <text x="898" y="124" text-anchor="middle" fill="#10b981" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold">▲ CHOFER</text>
  <text x="898" y="160" text-anchor="middle" fill="white" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold">Acepta y sale</text>
  <text x="898" y="178" text-anchor="middle" fill="#9ca3af" font-family="'Segoe UI', Arial, sans-serif" font-size="12">en camino</text>
  <circle cx="898" cy="230" r="40" fill="#052e16" stroke="#10b981" stroke-width="2.5" filter="url(#glow-green)"/>
  <text x="898" y="238" text-anchor="middle" fill="#10b981" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="bold">4</text>
  <text x="898" y="292" text-anchor="middle" fill="#6b7280" font-family="'Segoe UI', Arial, sans-serif" font-size="12">GPS activo,</text>
  <text x="898" y="310" text-anchor="middle" fill="#6b7280" font-family="'Segoe UI', Arial, sans-serif" font-size="12">estado ON THE</text>
  <text x="898" y="328" text-anchor="middle" fill="#6b7280" font-family="'Segoe UI', Arial, sans-serif" font-size="12">WAY activado</text>

  <!-- ══════════════════════════════════════════ -->
  <!-- STEP 5 — CLIENTE — cx=1154 -->
  <!-- ══════════════════════════════════════════ -->
  <rect x="1092" y="108" width="124" height="24" rx="12" fill="#1e3a5f"/>
  <text x="1154" y="124" text-anchor="middle" fill="#3b82f6" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold">● CLIENTE</text>
  <text x="1154" y="160" text-anchor="middle" fill="white" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold">Ve al chofer</text>
  <text x="1154" y="178" text-anchor="middle" fill="#9ca3af" font-family="'Segoe UI', Arial, sans-serif" font-size="12">en tiempo real</text>
  <circle cx="1154" cy="230" r="40" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2.5" filter="url(#glow-blue)"/>
  <text x="1154" y="238" text-anchor="middle" fill="#3b82f6" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="bold">5</text>
  <text x="1154" y="292" text-anchor="middle" fill="#6b7280" font-family="'Segoe UI', Arial, sans-serif" font-size="12">GPS en el mapa,</text>
  <text x="1154" y="310" text-anchor="middle" fill="#6b7280" font-family="'Segoe UI', Arial, sans-serif" font-size="12">ETA estimado,</text>
  <text x="1154" y="328" text-anchor="middle" fill="#6b7280" font-family="'Segoe UI', Arial, sans-serif" font-size="12">notificación push</text>

  <!-- ══════════════════════════════════════════ -->
  <!-- STEP 6 — CHOFER — cx=1410 -->
  <!-- ══════════════════════════════════════════ -->
  <rect x="1348" y="108" width="124" height="24" rx="12" fill="#052e16"/>
  <text x="1410" y="124" text-anchor="middle" fill="#10b981" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold">▲ CHOFER</text>
  <text x="1410" y="160" text-anchor="middle" fill="white" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold">Confirma entrega</text>
  <text x="1410" y="178" text-anchor="middle" fill="#9ca3af" font-family="'Segoe UI', Arial, sans-serif" font-size="12">con GPS y foto</text>
  <circle cx="1410" cy="230" r="40" fill="#052e16" stroke="#10b981" stroke-width="2.5" filter="url(#glow-green)"/>
  <text x="1410" y="238" text-anchor="middle" fill="#10b981" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="bold">6</text>
  <text x="1410" y="292" text-anchor="middle" fill="#6b7280" font-family="'Segoe UI', Arial, sans-serif" font-size="12">Estado DELIVERED,</text>
  <text x="1410" y="310" text-anchor="middle" fill="#6b7280" font-family="'Segoe UI', Arial, sans-serif" font-size="12">timestamp y</text>
  <text x="1410" y="328" text-anchor="middle" fill="#6b7280" font-family="'Segoe UI', Arial, sans-serif" font-size="12">foto evidencia</text>

  <!-- ══════════════════════════════════════════ -->
  <!-- STEP 7 — ADMIN — cx=1666 -->
  <!-- ══════════════════════════════════════════ -->
  <rect x="1602" y="108" width="128" height="24" rx="12" fill="#2e1065"/>
  <text x="1666" y="124" text-anchor="middle" fill="#a78bfa" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="bold">■ ADMIN</text>
  <text x="1666" y="160" text-anchor="middle" fill="white" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="bold">Ve el reporte</text>
  <text x="1666" y="178" text-anchor="middle" fill="#9ca3af" font-family="'Segoe UI', Arial, sans-serif" font-size="12">en el panel web</text>
  <circle cx="1666" cy="230" r="40" fill="#2e1065" stroke="#a78bfa" stroke-width="2.5" filter="url(#glow-purple)"/>
  <text x="1666" y="238" text-anchor="middle" fill="#a78bfa" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="bold">7</text>
  <text x="1666" y="292" text-anchor="middle" fill="#6b7280" font-family="'Segoe UI', Arial, sans-serif" font-size="12">Ventas del día,</text>
  <text x="1666" y="310" text-anchor="middle" fill="#6b7280" font-family="'Segoe UI', Arial, sans-serif" font-size="12">chofer asignado,</text>
  <text x="1666" y="328" text-anchor="middle" fill="#6b7280" font-family="'Segoe UI', Arial, sans-serif" font-size="12">método de pago</text>

  <!-- ─── LEGEND ─── -->
  <rect x="540" y="390" width="720" height="44" rx="8" fill="#ffffff08"/>
  <text x="560" y="416" fill="#3b82f6" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold">● Cliente</text>
  <text x="650" y="416" fill="#f59e0b" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold">⚙ Sistema automático</text>
  <text x="840" y="416" fill="#10b981" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold">▲ Chofer</text>
  <text x="930" y="416" fill="#a78bfa" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="bold">■ Administrador</text>
  <text x="1080" y="416" fill="#f59e0b" font-family="'Segoe UI', Arial, sans-serif" font-size="13">- - ▶ Flujo en tiempo real</text>

  <!-- Bottom accent -->
  <rect x="0" y="516" width="1800" height="4" rx="2" fill="#f59e0b"/>
</svg>
