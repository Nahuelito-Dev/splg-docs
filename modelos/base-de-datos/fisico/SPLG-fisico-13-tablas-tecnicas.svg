xtLength="172.924" font-family="Arial">last_number : integer *</text><line x1="327.875" y1="233.569" x2="579.442" y2="233.569" style="stroke:#3C5F8F;stroke-width:1.25;"/></g><!--class e_stock_reconciliation_alert--><g class="entity" data-qualified-name="e_stock_reconciliation_alert" id="ent0003" data-source-line="36"><rect x="23.844" y="399.107" width="234.618" height="119.681" fill="url(#gf4wiben8x1gm0)" style="stroke:#3C5F8F;stroke-width:1.25;"/><rect x="23.844" y="399.107" width="234.618" height="35.389" fill="#C6DAF0" style="stroke:#3C5F8F;stroke-width:1.25;"/><text x="35.12" y="423.042" fill="#000" font-size="17.188" textLength="212.066" font-weight="700" font-family="Arial">stock_reconciliation_alert</text><line x1="25.406" y1="434.496" x2="256.899" y2="434.496" style="stroke:#3C5F8F;stroke-width:1.25;"/><text x="33.219" y="456.868" fill="#000" font-size="17.188" textLength="110.762" font-weight="700" font-family="Arial">distributor_id</text><text x="148.756" y="456.868" fill="#000" font-size="17.188" textLength="100.33" font-family="Arial">: uuid * «PK»</text><text x="33.219" y="476.632" fill="#000" font-size="17.188" textLength="184.371" font-family="Arial">signature : varchar(64) *</text><text x="33.219" y="496.396" fill="#000" font-size="17.188" textLength="194.878" font-family="Arial">alerted_at : timestamptz *</text><line x1="25.406" y1="506.288" x2="256.899" y2="506.288" style="stroke:#3C5F8F;stroke-width:1.25;"/></g><g class="entity" data-qualified-name="N" id="ent0004" data-source-line="48"><path d="M313.609,424.186 L313.609,493.712 L1112.459,493.712 L1112.459,439.811 L1096.834,424.186 L313.609,424.186" style="stroke:#3C5F8F;stroke-width:0.781;" fill="#FFF"/><path d="M1096.834,424.186 L1096.834,439.811 L1112.459,439.811 L1096.834,424.186" style="stroke:#3C5F8F;stroke-width:1.563;" fill="#FFF"/><text x="322.984" y="446.654" fill="#000" font-size="15.625" textLength="748.634" font-family="Arial">Los nombres reflejan la base real: conviven camelCase (paymentMethod, createdAt, isActive) y snake_case</text><text x="322.984" y="464.621" fill="#000" font-size="15.625" textLength="766.037" font-family="Arial">(scheduled_date, delivery_mode) porque las columnas más antiguas se crearon así y las posteriores siguieron</text><text x="322.984" y="482.589" fill="#000" font-size="15.625" textLength="469.002" font-family="Arial">otra convención; la tabla claims está en plural y el resto en singular.</text></g><g class="legend" data-source-line="43"><rect x="60.429" y="551.601" width="1004.102" height="72.183" fill="none" style="stroke:#3C5F8F;stroke-width:1.563;"/><rect x="68.241" y="562.538" width="240.646" height="25.154" fill="#F1F1F1" style="stroke:none;"/><text x="68.241" y="583.057" fill="#000" font-size="21.875" font-family="Arial"> </text><text x="74.319" y="583.057" fill="#000" font-size="21.875" textLength="228.491" font-weight="700" font-family="Arial">tabla de otro contexto</text><text x="302.81" y="583.057" fill="#000" font-size="21.875" font-family="Arial"> </text><text x="314.965" y="583.057" fill="#000" font-size="21.875" textLength="684.566" font-family="Arial">solo se muestra su nombre; sus columnas están en su propio contexto</text><rect x="68.241" y="587.692" width="240.646" height="25.154" fill="#FFF" style="stroke:none;"/><text x="68.241" y="608.211" fill="#000" font-size="21.875" font-family="Arial"> </text><text x="74.319" y="608.211" fill="#000" font-size="21.875" textLength="140.97" font-weight="700" font-family="Arial">distributor_id</text><text x="215.289" y="608.211" fill="#000" font-size="21.875" font-family="Arial"> </text><text x="314.965" y="608.211" fill="#000" font-size="21.875" textLength="735.675" font-family="Arial">la tabla pertenece a una distribuidora (FK a distributor); la línea no se dibuja</text><line x1="68.241" y1="562.538" x2="1056.718" y2="562.538" style="stroke:#000;stroke-width:1.563;"/><line x1="68.241" y1="587.692" x2="1056.718" y2="587.692" style="stroke:#000;stroke-width:1.5