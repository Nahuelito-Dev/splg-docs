  'contrastado contra el código fuente del sistema.</p>'+
  '<div class="stats">'+
  '<div class="stat"><div class="n">'+t+'</div><div class="l">Casos de uso</div><div class="s">18 subsistemas</div></div>'+
  '<div class="stat"><div class="n">'+t+'</div><div class="l">De alto nivel</div><div class="s">cobertura total</div></div>'+
  '<div class="stat"><div class="n">'+t+'</div><div class="l">Expandidos</div><div class="s">cobertura total</div></div>'+
  '<div class="stat"><div class="n">'+dss+'</div><div class="l">Secuencia del sistema</div><div class="s">cobertura total</div></div>'+
  '<div class="stat"><div class="n">'+dsd+'</div><div class="l">Interacción de diseño</div><div class="s">cobertura total</div></div>'+
  '<div class="stat"><div class="n">'+im+'</div><div class="l">Construidos</div><div class="s">'+(t-im)+' especificados</div></div>'+
  '</div>'+
  '<div class="legend">'+
  '<span><i class="dot d-implementado"></i> Implementado</span>'+
  '<span><i class="dot d-parcial"></i> Implementado parcialmente</span>'+
  '<span><i class="dot d-no"></i> No implementado</span>'+
  '<span><i class="dot d-especificado"></i> Especificado, pendiente de construcción</span>'+
  '</div>'+
  '<p class="note">Elegí un caso de uso en el índice de la izquierda para ver su especificación y sus diagramas.</p></div>';
}

/* --- ficha --- */
function abrir(n){
  actual=n; const c=CU.find(x=>x.n===n); if(!c) return;
  const e=EST[c.estado];
  let h='<div class="top"><div class="crumb">SS-'+String(c.ss).padStart(2,"0")+" · "+c.ssn+"</div>"+
        '<h2><span class="code">CU-'+String(c.n).padStart(3,"0")+"</span> · "+c.nombre+"</h2>"+
        '<div class="chips"><span class="chip '+e.c+'">'+e.t+"</span>"+
        '<span class="chip '+(CAL[c.cal.split(" ")[0]]||"c-plain")+'">'+c.cal+"</span>"+
        '<span class="chip c-plain">'+c.actores+"</span></div></div><div class=\"wrap\">";
  h+='<section class="art"><h3>Caso de uso de alto nivel<span class="tag">Documento 0 — Plan del Proyecto</span></h3><div class="md"><p>'+inl(c.desc)+"</p></div></section>";
  h+='<section class="art"><h3>Caso de uso expandido<span class="tag">Documento 1 — Requisitos</span></h3><div class="md">'+md(sinCodigo(c.cue))+"</div></section>";
  h+=diagrama("Diagrama de secuencia del sistema","Documento 2 — Análisis",c.dss,"dss"+n,
      "El sistema se modela como caja negra: intervienen el actor y el sistema, sin detalle interno.");
  h+=diagrama("Diagrama de interacción de diseño","Documento 3 — Diseño",c.dsd,"dsd"+n,
      c.dsdTit?("Corresponde a: "+c.dsdTit):"Colaboración entre las clases del sistema.");
  h+="</div>";
  document.getElementById("main").innerHTML=h;
  document.getElementById("main").scrollTop=0; window.scrollTo(0,0);
  pintarNav(); render();
  document.querySelectorAll(".copy").forEach(b=>b.onclick=async()=>{
    try{ await navigator.clipboard.writeText(b.dataset.src); const o=b.textContent;
      b.textContent="Copiado"; setTimeout(()=>b.textContent=o,1400); }catch(_){ b.textContent="No se pudo copiar"; }
  });
}
function diagrama(titulo,doc,src,id,pie){
  const code=codigo(src), prosa=md(sinCodigo(src));
  let h='<section class="art"><h3>'+titulo+'<span class="tag">'+doc+"</span></h3>";
  if(prosa) h+='<div class="md">'+prosa+"</div>";
  if(code){
    h+='<div class="dgmbar"><span class="ttl">'+pie+'</span>'+
       '<button class="copy" data-src="'+code.replace(/"/g,"&quot;")+'">Copiar código Mermaid</button></div>'+
       '<div class="dgm"><pre class="mmd" id="'+id+'">'+code.replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</pre></div>";
  } else h+='<div class="empty">Sin diagrama disponible para este caso de uso.</div>';
  return h+"</section>";
}
async function render(){
  const nodos=document.querySelectorAll("pre.mmd"); if(!nodos.length) return;
  const oscuro = document.documentElement.dataset.theme==="dark" ||
    (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme:dark)").matches);
  mermaid.initialize({startOnLoad:false,theme:oscuro?"dark":"neutral",securityLevel:"loose",
    fontFamily:'"IBM Plex Sans",sans-serif',sequence:{useMaxWidth:true,wrap:true,width:170}});
  for(const el of nodos){
    const src=el.textContent;
    try{ const {svg}=await mermaid.render("m"+el.id+Date.now(),src); el.outerHTML='<div>'+svg+"</div>"; }
    catch(err){ el.parentElement.innerHTML='<div class="empty">El diagrama no pudo dibujarse. El código está disponible con el botón Copiar.</div>'; }
  }
}
document.getElementById("q").addEventListener("input",e=>{texto=e.target.value.trim();pintarNav();});
document.querySelectorAll(".fbtn").forEach(b=>b.onclick=()=>{
  filtro=b.dataset.f;
  document.querySelectorAll(".fbtn").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));
  pintarNav();
});
matchMedia("(prefers-color-scheme:dark)").addEventListener("change",()=>{ if(actual) abrir(actual); });
pintarNav(); portada();
</script>
