<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPLG — Documentación del sistema</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<link rel="stylesheet" href="visor.css">
<script src="visor.js" defer></script>
<style>
/* ---- Paleta de lectura ----
   Documento impreso: tinta oscura sobre papel. La paleta anterior (Orix Dusk,
   violeta oscuro con acentos durazno) no se leía —ni en pantalla ni
   proyectada—, así que acá no hay tema oscuro ni conmutador: una sola paleta,
   la que se lee. Los colores de los artefactos son versiones saturadas y
   oscuras, con contraste suficiente sobre blanco. */
:root{
  --bg:#FAF4E6; --surface:#FFFDF7; --variant:#F2EAD6; --outline:#DED4BC;
  --content:#1C1A17; --muted:#5C574E;
  --primary:#1F5E8C; --pressed:#164667; --secondary:#A8452C; --on-accent:#FFFFFF;
  --success:#136B45; --danger:#A32B2B; --warn:#8A5A00; --syncing:#1F5E8C; --inactive:#7B756B;
  --cua:#1F5E8C; --cue:#136B45; --dss:#8A5A00; --dsd:#A8452C; --cur:#7A3E9D; --mod:#3D5A99;
  --dep:#5A6B4A;
  --titulo:#E3DECF; --actor:#E4EDF4;
  --shadow:0 1px 2px rgba(28,26,23,.06),0 10px 28px -22px rgba(28,26,23,.45);
  --tint:rgba(28,26,23,.045);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--content);
  font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.6;
  -webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:320px 1fr;height:100vh}
@media(max-width:880px){.app{grid-template-columns:1fr;height:auto}}

/* ---------- panel ---------- */
aside{background:var(--surface);border-right:1px solid var(--outline);display:flex;flex-direction:column;min-height:0}
@media(max-width:880px){aside{border-right:none;border-bottom:1px solid var(--outline);max-height:58vh}}
.brand{padding:16px 20px 14px;border-bottom:1px solid var(--outline);display:flex;gap:13px;
  align-items:center;width:100%;background:transparent;border-left:none;border-right:none;
  border-top:none;color:var(--content);font:inherit;text-align:left;cursor:pointer}
.brand:hover .marca{transform:scale(1.06)}
.brand .marca{transition:transform .15s ease}
.brand:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
.brand .marca{width:38px;height:38px;flex:none;display:block}
.brand .rotulo{min-width:0}
.brand h1{font-family:"IBM Plex Sans",sans-serif;font-weight:600;font-size:1.28rem;margin:0;
  line-height:1.05;letter-spacing:.14em;color:var(--content)}
.brand p{margin:3px 0 0;font-size:9.5px;color:var(--muted);font-family:"IBM Plex Mono",monospace;letter-spacing:.13em}
.tools{padding:12px 16px;border-bottom:1px solid var(--outline);display:grid;gap:9px}
input[type=search]{width:100%;padding:9px 11px;border:1px solid var(--outline);border-radius:5px;
  background:var(--variant);color:var(--content);font:inherit;font-size:14px}
input[type=search]::placeholder{color:var(--muted)}
input[type=search]:focus{outline:2px solid var(--primary);outline-offset:1px}
/* ---------- menú de secciones ----------
   La barra es el índice del sitio: cuatro secciones. La primera despliega la
   documentación —buscador, filtros y los casos por subsistema—; las otras tres
   son las páginas hermanas. Antes la barra era directamente la lista de los 108
   casos, que no dejaba ver que el sitio tuviera otras partes. */
.secciones{display:flex;flex-direction:column;min-height:0;flex:1;overflow-y:auto}
.seccion{display:flex;align-items:center;gap:10px;width:100%;
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.1em;
  color:var(--content);background:transparent;border:none;
  border-bottom:1px solid var(--outline);padding:15px 18px;cursor:pointer;
  text-align:left;text-decoration:none;flex:none}
.seccion:hover{background:var(--tint);color:var(--primary)}
.seccion:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
.seccion .nombre{flex:1;min-width:0}
.seccion .cuenta{font-size:10px;color:var(--muted);background:var(--variant);
  border-radius:99px;padding:2px 8px}
.seccion .ir{color:var(--muted)}
.seccion .flecha{transition:transform .12s ease;font-size:14px;line-height:1;color:var(--muted)}
.seccion[aria-expanded=true]{color:var(--primary);background:var(--tint)}
.seccion[aria-expanded=true] .flecha{transform:rotate(90deg);color:var(--primary)}
.cuerpo-seccion{display:none;flex-direction:column;min-height:0;
  border-bottom:1px solid var(--outline);background:var(--bg)}
.cuerpo-seccion.abierta{display:flex;flex:1}

.list{overflow-y:auto;flex:1;padding:6px 0 24px;min-height:0}
button.grp{display:flex;align-items:center;gap:8px;width:100%;
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);padding:11px 16px 9px;background:transparent;border:none;cursor:pointer;
  text-align:left;border-top:1px solid var(--outline)}
button.grp:hover{background:var(--tint);color:var(--content)}
button.grp:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
button.grp .nombre{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.grp .cuenta{font-size:10px;color:var(--muted);background:var(--variant);
  border-radius:99px;padding:1px 7px;flex:none}
button.grp .flecha{flex:none;transition:transform .12s ease;font-size:13px;line-height:1}
.grupo.abierto>button.grp .flecha{transform:rotate(90deg)}
.grupo.abierto>button.grp{color:var(--content)}
.grupo .casos{display:none}
.grupo.abierto .casos{display:block;padding-bottom:6px}
/* El grupo suelto que usan las vistas de sistema y de módulos, sin plegado. */
.grp:not(button){font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);padding:14px 20px 7px}
.item{display:flex;gap:9px;align-items:baseline;padding:6px 20px;cursor:pointer;border:none;
  background:transparent;width:100%;text-align:left;color:var(--content);font:inherit;font-size:13.5px}
.item:hover{background:var(--tint)}
.item[aria-current=true]{background:var(--variant);box-shadow:inset 3px 0 0 var(--primary)}
.item:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
.item .cod{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);flex:none;
  font-variant-numeric:tabular-nums}
.item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .dot{width:6px;height:6px;border-radius:99px;flex:none}
.dot.Crítico{background:var(--danger)}.dot.Importante{background:var(--warn)}.dot.Secundario{background:var(--inactive)}

/* ---------- detalle ---------- */
main{overflow-y:auto;min-height:0;padding:0 0 90px}
.pad{max-width:920px;margin:0 auto;padding:28px 30px 0}
@media(max-width:880px){.pad{padding:20px 16px 0}}
.head{border-bottom:2px solid var(--primary);padding-bottom:15px;margin-bottom:20px}
.head .over{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);
  letter-spacing:.08em;display:flex;gap:11px;flex-wrap:wrap;margin-bottom:9px;align-items:center}
.head h2{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:clamp(1.55rem,4vw,2.2rem);
  margin:0;line-height:1.12;letter-spacing:-.015em;text-wrap:balance}
.chip{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.06em;padding:2px 8px;
  border-radius:99px;border:1px solid currentColor}
.chip.Crítico{color:var(--danger)}.chip.Importante{color:var(--warn)}.chip.Secundario{color:var(--inactive)}
.chip.m{color:var(--mod)}
.meta{display:flex;gap:7px 24px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:11px}
.meta b{color:var(--content);font-weight:500}
/* Quién ejecuta el caso es lo primero que se busca al leerlo, así que va
   marcado y no como un dato más de la línea. */
.quien{margin:0 0 14px;padding-bottom:12px;border-bottom:1px dashed var(--outline);
  font-size:13px;color:var(--muted)}
.quien b{color:var(--content);font-weight:500;margin-right:6px}
a[data-cu]{color:var(--primary);text-decoration:none;border-bottom:1px solid var(--outline);
  font-family:"IBM Plex Mono",monospace;font-size:.94em}
a[data-cu]:hover{border-bottom-color:var(--primary);background:var(--tint)}
/* `marca-actor` y no `actor`: mermaid ya usa esa clase para los rectángulos de
   sus diagramas de secuencia y las dos reglas se cruzaban. */
.marca-actor{background:var(--actor);color:var(--content);border:1px solid #C7D8E5;
  border-radius:4px;padding:1px 7px;font-weight:500}

/* Marcas de código. Cada subsistema lleva el mismo color que su caja en los
   diagramas —las reglas por código las escribe el generador desde `paleta.py`—,
   y el caso de uso y el actor llevan la suya. Sin esto, encontrar un código en
   una tabla de dieciocho filas era leer renglón por renglón. */
.marca-ss,.marca-cu,.marca-act{display:inline-block;border-radius:4px;padding:0 6px;
  border:1px solid transparent;font-family:"IBM Plex Mono",monospace;font-size:.9em;
  font-weight:600;line-height:1.5;white-space:nowrap}
.marca-cu{background:var(--tint);border-color:var(--outline);color:var(--primary)}
.refs p{margin:0 0 10px}
.refs .tenue{color:var(--muted);font-size:.92em}
.marca-act{background:var(--actor);border-color:#C7D8E5;color:#2C4257}
.marca-act[data-act="ACT-01"]{background:#E7F0F6;border-color:#1F6F8B;color:#1F6F8B}
.marca-act[data-act="ACT-02"]{background:#E9F4EA;border-color:#2E7D46;color:#2E7D46}
.marca-act[data-act="ACT-03"]{background:#F5ECF7;border-color:#8C4A9E;color:#8C4A9E}
.marca-act[data-act="ACT-04"]{background:#FBF2DE;border-color:#8A6D1F;color:#8A6D1F}
.marca-act[data-act="ACT-05"]{background:#FAE8E3;border-color:#B4432B;color:#B4432B}
__COLORES_SS__
/* El punto del grupo en el menú toma el color del subsistema. */
.grupo .grp .punto{width:9px;height:9px;border-radius:50%;flex:none;
  border:1px solid rgba(0,0,0,.18)}

.card{background:var(--surface);border:1px solid var(--outline);border-radius:6px;
  margin-bottom:18px;box-shadow:var(--shadow);overflow:hidden}
/* El encabezado de la ficha va sobre un gris claro: separa de un vistazo qué
   artefacto se está leyendo —CUA, CUE, DSS, DSD— del contenido del artefacto. */
.card>header{display:flex;align-items:center;gap:11px;padding:11px 18px;
  background:var(--titulo);border-bottom:1px solid var(--outline);
  border-radius:5px 5px 0 0}
.card>header .tag{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:500;
  letter-spacing:.07em;padding:2px 8px;border-radius:4px;color:var(--on-accent)}
.card>header h3{margin:0;font-size:14px;font-weight:600;flex:1}
.card>header .src{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);text-align:right}
.card .body{padding:16px 18px}
.k-cua{border-top:2px solid var(--cua)} .k-cua .tag{background:var(--cua)}
.k-cue{border-top:2px solid var(--cue)} .k-cue .tag{background:var(--cue)}
.k-dss{border-top:2px solid var(--dss)} .k-dss .tag{background:var(--dss)}
.k-dsd{border-top:2px solid var(--dsd)} .k-dsd .tag{background:var(--dsd)}
.k-cur{border-top:2px solid var(--cur)} .k-cur .tag{background:var(--cur)}
.k-mod{border-top:2px solid var(--mod)} .k-mod .tag{background:var(--mod)}
.k-dep{border-top:2px solid var(--dep)} .k-dep .tag{background:var(--dep)}
.k-doc{border-top:2px solid var(--outline)} .k-doc .tag{background:var(--variant);color:var(--muted)}

.scroller{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 13px;text-align:left;border-bottom:1px solid var(--outline);vertical-align:top}
thead th{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);font-weight:500;background:var(--variant)}
tbody tr:last-child td{border-bottom:none}
td.campo{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.03em;color:var(--muted);
  white-space:nowrap;width:1%;text-transform:uppercase}
td.p{font-family:"IBM Plex Mono",monospace;width:1%;white-space:nowrap;color:var(--muted);
  font-variant-numeric:tabular-nums}
code{font-family:"IBM Plex Mono",monospace;font-size:.88em;background:var(--variant);
  padding:1px 5px;border-radius:3px}
h4.sub{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin:20px 0 8px;font-weight:500}
.card .body>h4.sub:first-child{margin-top:0}
.note{background:var(--variant);border-left:3px solid var(--primary);padding:11px 15px;
  border-radius:0 4px 4px 0;font-size:14px;color:var(--content);margin:13px 0}
pre{background:var(--variant);padding:12px;border-radius:4px;overflow-x:auto;font-size:12px;
  font-family:"IBM Plex Mono",monospace;line-height:1.5}
ul,ol{padding-left:20px;margin:10px 0} li{margin-bottom:5px}
/* Un diagrama es una figura: se lee mejor como tinta sobre papel, y así se
   proyecta sin que se pierdan las líneas finas. Por eso no sigue el tema de la
   página: el fondo es claro en los dos temas. */
.diagram,.umlimg{background:#FFFDF7;border:1px solid rgba(42,37,71,.14);
  border-radius:8px;padding:16px;margin:12px 0;overflow-x:auto;text-align:center;
  cursor:zoom-in}
.diagram svg,.umlimg{max-width:100%;height:auto}
.diagram:hover,.umlimg:hover{border-color:var(--primary)}
/* Los diagramas entran achicados para cumplir con el ancho de la columna; el
   aviso dice que se pueden abrir en grande, que es donde se leen. */
.figura{position:relative}
.figura .ampliar{position:absolute;right:10px;bottom:10px;pointer-events:none;
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.08em;
  color:var(--muted);background:var(--bg);border:1px solid var(--outline);
  border-radius:5px;padding:3px 7px;opacity:.85}
.figura:hover .ampliar{color:var(--primary);border-color:var(--primary)}

.dtitle{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);margin-bottom:8px;letter-spacing:.04em}
.shared{font-size:12px;color:var(--muted);margin-top:8px;font-family:"IBM Plex Mono",monospace}
.kb{font-family:"IBM Plex Mono",monospace;font-size:11px;border:1px solid var(--outline);
  border-radius:4px;padding:1px 6px;color:var(--content)}
/* ---------- pie ---------- */
footer.pie{border-top:1px solid var(--outline);margin-top:56px;padding:22px 0 8px;
  font-size:12.5px;color:var(--muted);line-height:1.75}
footer.pie h5{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;margin:0 0 10px;font-weight:500;color:var(--muted)}
footer.pie dl{display:grid;grid-template-columns:auto 1fr;gap:5px 18px;margin:0}
footer.pie dt{color:var(--content);font-weight:500;white-space:nowrap}
footer.pie dd{margin:0}
footer.pie .cierre{margin-top:16px;padding-top:14px;border-top:1px solid var(--outline);
  display:flex;flex-wrap:wrap;gap:5px 20px;font-family:"IBM Plex Mono",monospace;font-size:11px}

/* ---------- barra del documento ----------
   El panel de casos ocupa 320px fijos. Para leer un caso largo o proyectarlo
   conviene poder guardarlo y quedarse con el ancho completo. */
.barra-doc{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
  padding:9px 22px;background:var(--bg);border-bottom:1px solid var(--outline)}
#alternarPanel{display:flex;align-items:center;gap:9px;background:transparent;
  border:1px solid var(--outline);border-radius:6px;padding:6px 11px;cursor:pointer;
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.09em;
  color:var(--muted)}
#alternarPanel:hover{border-color:var(--primary);color:var(--primary)}
#alternarPanel:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.rayas{position:relative;width:14px;height:10px;flex:none}
.rayas::before,.rayas::after{content:"";position:absolute;left:0;right:0;height:1.5px;
  background:currentColor}
.rayas::before{top:0;box-shadow:0 4.25px 0 currentColor}
.rayas::after{bottom:0}
.app.sin-panel{grid-template-columns:1fr}
.app.sin-panel aside{display:none}

/* En pantalla angosta el panel no puede comerse media pantalla: se convierte en
   un cajón que entra por la izquierda sobre el contenido, se abre con el botón
   de la barra y se cierra al elegir un caso, con Escape o tocando afuera. */
@media(max-width:880px){
  .app,.app.sin-panel{grid-template-columns:1fr;height:auto}
  aside{position:fixed;top:0;left:0;bottom:0;z-index:60;width:min(86vw,330px);
    max-height:none;border-right:1px solid var(--outline);border-bottom:none;
    transform:translateX(-100%);transition:transform .18s ease;
    box-shadow:0 0 40px rgba(28,26,23,.25)}
  .app:not(.sin-panel) aside{display:flex;transform:translateX(0)}
  .app.sin-panel aside{display:flex}
  .fondo-cajon{position:fixed;inset:0;z-index:55;background:rgba(28,26,23,.45);
    opacity:0;pointer-events:none;transition:opacity .18s ease}
  .app:not(.sin-panel) .fondo-cajon{opacity:1;pointer-events:auto}
  .barra-doc{padding:9px 16px}
}
@media(min-width:881px){.fondo-cajon{display:none}}

/* ---------- portada ----------
   El viaje de un pedido: sale de la distribuidora, la camioneta recorre el
   camino y la garrafa queda en la puerta. Es lo que hace el sistema, dicho en
   un dibujo, en vez de repetir el índice que ya está en el menú. */
.portada{padding-top:8px}
.portada .over{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);
  display:flex;gap:9px;align-items:center;flex-wrap:wrap;letter-spacing:.08em}
.portada h2{font-family:Newsreader,Georgia,serif;font-weight:500;
  font-size:clamp(1.7rem,4.2vw,2.6rem);line-height:1.12;margin:.5rem 0 .7rem;text-wrap:balance}
.portada .bajada{margin:0;max-width:62ch;color:var(--muted);font-size:1.02rem;line-height:1.7}

.viaje{margin:26px 0 8px}
.viaje svg{width:100%;height:auto;display:block}
.viaje .ruta{stroke:var(--outline);stroke-width:3;stroke-linecap:round}
.viaje .ruta-avance{stroke:var(--primary);stroke-width:3;stroke-linecap:round;
  stroke-dasharray:14 12;animation:avanzar 1.1s linear infinite}
.viaje .edificio{fill:var(--surface);stroke:var(--content);stroke-width:2}
.viaje .ventana{fill:var(--actor);stroke:var(--content);stroke-width:1.4}
.viaje .puerta{fill:var(--variant);stroke:var(--content);stroke-width:1.4}
.viaje .rotulo-viaje{font-family:"IBM Plex Mono",monospace;font-size:11px;
  letter-spacing:.09em;fill:var(--muted)}
.viaje .caja-camion{fill:var(--surface);stroke:var(--content);stroke-width:2}
.viaje .cabina{fill:var(--primary);stroke:var(--content);stroke-width:2}
.viaje .vidrio{fill:var(--actor);stroke:var(--content);stroke-width:1.4}
.viaje .rueda{fill:var(--content)}
.viaje .garrafa{fill:var(--secondary);stroke:var(--content);stroke-width:2}
.viaje .valvula{fill:var(--content)}
.viaje .globo{fill:var(--cue);stroke:none}
.viaje .texto-globo{font-family:"IBM Plex Mono",monospace;font-size:11px;
  letter-spacing:.09em;fill:#FFFDF7}

.viaje .camioneta{animation:viajar 9s cubic-bezier(.4,0,.5,1) infinite}
.viaje .rueda{animation:rodar 9s linear infinite;transform-origin:center;transform-box:fill-box}
.viaje .pedido{animation:pedir 9s ease-in-out infinite}
.viaje .entrega{animation:entregar 9s ease-in-out infinite;opacity:0}
.viaje .garrafa-carga{animation:cargar 9s ease-in-out infinite}

@keyframes avanzar{to{stroke-dashoffset:-26}}
@keyframes viajar{
  0%,18%{transform:translate(130px,168px)}
  62%,74%{transform:translate(772px,168px)}
  75%{transform:translate(772px,168px);opacity:1}
  82%{opacity:0}
  83%{transform:translate(130px,168px);opacity:0}
  92%,100%{transform:translate(130px,168px);opacity:1}
}
@keyframes rodar{
  0%,18%{transform:rotate(0)}
  62%{transform:rotate(1080deg)}
  100%{transform:rotate(1080deg)}
}
@keyframes pedir{
  0%{transform:translate(830px,96px);opacity:0}
  6%{opacity:1}
  16%{transform:translate(120px,96px);opacity:1}
  22%{transform:translate(120px,96px);opacity:0}
  100%{opacity:0}
}
@keyframes cargar{
  0%,20%{opacity:0;transform:translate(-16px,-40px)}

.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:12px;
  margin:26px 0 18px}
.cifra{background:var(--surface);border:1px solid var(--outline);border-radius:8px;
  padding:14px 16px;box-shadow:var(--shadow)}
button.cifra{cursor:pointer;text-align:left;font:inherit}
button.cifra:hover{border-color:var(--primary)}
button.cifra:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.cifra b{display:block;font-family:Newsreader,Georgia,serif;font-size:1.9rem;
  font-weight:500;line-height:1;color:var(--content)}
.cifra span{display:block;margin-top:5px;font-family:"IBM Plex Mono",monospace;
  font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.portada .pista{color:var(--muted);font-size:.95rem;margin:0}

/* ---------- páginas embebidas ----------
   Ramas, versionado y agentes se muestran en esta misma vista. Sus estilos son
   los de `paginas.css`, acotados a `.pagina` para que no toquen el resto: la
   tabla de un caso de uso y la de esas páginas no se pisan. */
.pagina{display:flex;flex-direction:column;gap:3rem;padding-bottom:1rem}
.pagina .intro h2{font-family:"Newsreader",Georgia,serif;font-weight:600; font-size:clamp(1.9rem,4.5vw,2.6rem);line-height:1.12;margin:0 0 .6rem;text-wrap:balance}
.pagina .intro p{margin:0;max-width:60ch;color:var(--muted);font-size:1.05rem}
.pagina section{display:flex;flex-direction:column;gap:1.05rem}
.pagina h3{font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:1.5rem; margin:0;text-wrap:balance}
.pagina h4{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em; text-transform:uppercase;color:var(--muted);margin:.4rem 0 0;font-weight:500}
.pagina p{margin:0;max-width:68ch}
.pagina code{font-family:"IBM Plex Mono",monospace;font-size:.87em; background:var(--tint);padding:.12em .38em;border-radius:4px}
.pagina a{color:var(--primary)}
.pagina figure{margin:0;display:flex;flex-direction:column;gap:.85rem}
.pagina .lienzo{background:var(--surface);border:1px solid var(--outline);border-radius:12px; padding:1.4rem 1rem;box-shadow:var(--shadow);overflow-x:auto;cursor:zoom-in}
.pagina .lienzo:hover{border-color:var(--primary)}
.pagina .lienzo svg{display:block;width:100%;min-width:640px;height:auto}
.pagina figcaption{color:var(--muted);font-size:.95rem;max-width:68ch}
.carril{stroke:var(--outline);stroke-width:1.5}
.nodo{fill:var(--surface);stroke-width:2}
.n-trabajo{stroke:var(--syncing)}
.n-develop{stroke:var(--success)}
.n-main{stroke:var(--primary)}
.a-trabajo{fill:none;stroke:var(--syncing);stroke-width:2}
.a-develop{fill:none;stroke:var(--success);stroke-width:2}
.a-main{fill:none;stroke:var(--primary);stroke-width:2}
.a-vuelta{fill:none;stroke:var(--primary);stroke-width:1.5;stroke-dasharray:5 4;opacity:.7}
.caja{fill:var(--variant);stroke:var(--primary);stroke-width:1.5}
.panel-svg{fill:var(--variant);stroke:var(--outline);stroke-width:1}
.t-carril{font-family:"IBM Plex Mono",monospace;font-size:12px;fill:var(--muted)}
.t-arco{font-family:"IBM Plex Sans",sans-serif;font-size:11.5px;fill:var(--muted)}
.t-caja{font-family:"Newsreader",Georgia,serif;font-size:14px;font-weight:600;fill:var(--primary)}
.t-sub{font-family:"IBM Plex Mono",monospace;font-size:11.5px;fill:var(--content)}
.t-tag{font-family:"IBM Plex Mono",monospace;font-size:11.5px;fill:var(--primary)}
.t-commit{font-family:"IBM Plex Mono",monospace;font-size:12.5px;fill:var(--content)}
.t-commit.apagado{fill:var(--muted);opacity:.6}
.t-ver{font-family:"IBM Plex Mono",monospace;font-size:26px;fill:var(--muted)}
.t-ver-nueva{font-family:"IBM Plex Mono",monospace;font-size:26px;fill:var(--content)}
.t-ver-nueva tspan{fill:var(--primary);font-weight:500}
.t-salida{font-family:"IBM Plex Mono",monospace;font-size:12.5px;fill:var(--content)}
.pagina .marco{overflow-x:auto;border:1px solid var(--outline);border-radius:12px; background:var(--surface);box-shadow:var(--shadow)}
.pagina table{border-collapse:collapse;width:100%;font-size:.93rem}
.pagina th{font-family:"IBM Plex Mono",monospace;font-weight:500;font-size:10.5px; letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left; padding:.85rem 1rem;border-bottom:1px solid var(--outline);white-space:nowrap}
.pagina td{padding:.75rem 1rem;border-bottom:1px solid var(--outline);vertical-align:top}
.pagina tbody tr:last-child td{border-bottom:none}
.pagina .mono{font-family:"IBM Plex Mono",monospace;font-size:.85rem;white-space:nowrap}
.pagina .muted{color:var(--muted)}
.pagina .pares{display:grid;grid-template-columns:repeat(auto-fit,minmax(17rem,1fr));gap:1rem}
.pagina .par{background:var(--surface);border:1px solid var(--outline);border-radius:12px; padding:1.1rem 1.25rem;display:flex;flex-direction:column;gap:.55rem;box-shadow:var(--shadow)}
.pagina .par.si{border-left:3px solid var(--success)}
.pagina .par.no{border-left:3px solid var(--danger)}
.pagina .par h4{margin:0}
.pagina .par.si h4{color:var(--success)}
.pagina .par.no h4{color:var(--danger)}
.pagina .par ul{margin:0;padding-left:1.05rem;display:flex;flex-direction:column;gap:.4rem}
.pagina .par li{font-family:"IBM Plex Mono",monospace;font-size:.82rem;line-height:1.5}
.pagina .par .por{font-family:"IBM Plex Sans",sans-serif;font-size:.88rem;color:var(--muted)}
.pagina .reglas{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.pagina .reglas li{position:relative;padding:.8rem 0 .8rem 1.9rem; border-bottom:1px solid var(--outline);max-width:68ch}
.pagina .reglas li:last-child{border-bottom:none}
.pagina .reglas li::before{content:"—";position:absolute;left:0;top:.8rem; color:var(--primary);font-family:"IBM Plex Mono",monospace}
.pagina ol.pasos{margin:0;padding:0;list-style:none;counter-reset:paso; display:flex;flex-direction:column}
.pagina ol.pasos li{counter-increment:paso;position:relative; padding:.8rem 0 .8rem 2.6rem;border-bottom:1px solid var(--outline);max-width:68ch}
.pagina ol.pasos li:last-child{border-bottom:none}
.pagina ol.pasos li::before{content:counter(paso,decimal-leading-zero);position:absolute; left:0;top:.85rem;font-family:"IBM Plex Mono",monospace;font-size:11px; color:var(--primary)}
.pagina .aviso{background:var(--variant);border-left:3px solid var(--secondary); border-radius:0 10px 10px 0;padding:1.1rem 1.3rem;font-size:.97rem;max-width:68ch}
.pagina .aviso strong{color:var(--secondary)}
/* El diagrama de tubería del versionado. Estas reglas habían quedado adentro de
   una consulta de ancho máximo al acotar los estilos de las páginas: en una
   pantalla normal no se aplicaban y cada caja del proceso salía en negro, que
   es el relleno que trae un SVG sin estilo. */
.paso-caja{fill:var(--surface);stroke:var(--outline);stroke-width:1.5}
.paso-caja.disparador{fill:var(--variant);stroke:var(--primary);stroke-width:2}
.paso-caja.decision{fill:var(--variant);stroke:var(--secondary);stroke-width:2}
.paso-caja.salida{fill:none;stroke:var(--outline);stroke-width:1.5;stroke-dasharray:5 4}
.t-paso{font-family:"IBM Plex Sans",sans-serif;font-size:13px;fill:var(--content)}
.t-paso-num{font-family:"IBM Plex Mono",monospace;font-size:10.5px;fill:var(--primary)}
.t-nota{font-family:"IBM Plex Sans",sans-serif;font-size:11.5px;fill:var(--muted)}
.t-nota-mono{font-family:"IBM Plex Mono",monospace;font-size:11.5px;fill:var(--content)}
.conector{stroke:var(--outline);stroke-width:1;stroke-dasharray:3 3}
.paso-icono{fill:none;stroke:var(--primary);stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.paso-icono-lleno{fill:var(--content);stroke:none;opacity:.8}

.pagina body,.pagina{font-size:inherit}
@media (max-width:34rem){.pagina{font-size:14.5px}}

.pagina .con-placa,.pagina .con-icono{display:flex;align-items:center;gap:9px;white-space:nowrap}
.pagina .placa{display:inline-flex;align-items:center;justify-content:center;
  width:24px;height:24px;border-radius:7px;flex:none;background:var(--placa);color:#FFFDF7;
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500;line-height:1}
.pagina .placa-marca{background:var(--surface);border:1px solid var(--outline)}
.pagina .placa-marca svg{width:15px;height:15px;display:block}
.pagina .icono{width:22px;height:22px;flex:none;fill:none;stroke:var(--primary);
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- recorrer y citar ---------- */
.paso{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
  margin:30px 0 8px;padding-top:18px;border-top:1px solid var(--outline)}
.paso button{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;
  background:transparent;color:var(--primary);border:1px solid var(--outline);
  border-radius:6px;padding:8px 12px;cursor:pointer;text-align:left}
.paso button:last-child{text-align:right}
.paso .copiar{color:var(--muted);white-space:nowrap}
.paso button:hover{border-color:var(--primary);background:var(--tint)}
@media(max-width:880px){.paso{grid-template-columns:1fr}.paso button:last-child{text-align:left}}

/* ---------- impresión ----------
   Un caso de uso se imprime o se exporta a PDF para adjuntarlo o discutirlo en
   papel. Sale sólo el contenido: sin panel lateral, sin filtros, sin los
   controles del visor, y con las fichas sin partirse entre páginas. */
@media print{
  @page{margin:14mm}
  .app{display:block;height:auto}
  aside,.visor,.paso,.figura .ampliar,.barra-doc{display:none!important}
  main{overflow:visible}
  .pad{padding:0}
  body{background:#fff;color:#000;font-size:11pt}
  .card,.diagram,.umlimg,table{break-inside:avoid;page-break-inside:avoid}
  .card{box-shadow:none;border:1px solid #999}
  .head h2{font-size:20pt}
  .diagram,.umlimg{border:1px solid #999;background:#fff}
  footer.pie{border-top:1px solid #999}
  a{color:#000;text-decoration:none}
}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script id="datos" type="application/json">__DATOS__</script>
<script>
(function(){
  "use strict";
  var D = JSON.parse(document.getElementById("datos").textContent);
  var CU = D.cu, SS = D.subsistemas, MODS = D.modulos || {}, SIS = D.sistema || {};
  var UMLSIS = D.umlsis || {};
  /* El tinte de cada subsistema sale de la misma hoja de estilos que pinta las
     marcas, así el punto del menú y la caja del diagrama nunca se separan. */
  function tinteDe(nombre){
    var m = /SS-\d\d/.exec(nombre || "");
    if (!m) return "transparent";
    var s = document.createElement("span");
    s.className = "marca-ss"; s.setAttribute("data-ss", m[0]);
    s.style.display = "none"; document.body.appendChild(s);
    var c = getComputedStyle(s).backgroundColor;
    s.remove();
    return c;
  }
  var codigos = Object.keys(CU).sort(), filtro = "todos", sel = null, seq = 0;
  var abiertos = {};

  function initM(){
    if (!window.mermaid) return;
    // Tema claro siempre, aunque la página esté en oscuro: el diagrama se
    // dibuja sobre papel. Con el tema oscuro las líneas de vida y las flechas
    // quedaban casi del color del fondo y no se leían proyectadas.
    mermaid.initialize({startOnLoad:false, securityLevel:"loose", theme:"base",
      themeVariables:{
        fontFamily:'"IBM Plex Sans", sans-serif', fontSize:"14px",
        background:"#FFFDF7",
        primaryColor:"#FFFFFF", primaryTextColor:"#2A2547", primaryBorderColor:"#2A2547",
        lineColor:"#4A4468", textColor:"#2A2547",
        secondaryColor:"#EDE7F2", tertiaryColor:"#F3EFE9",
        noteBkgColor:"#FFF3D6", noteTextColor:"#2A2547", noteBorderColor:"#B57A2E",
        actorBkg:"#FFFFFF", actorBorder:"#2A2547", actorTextColor:"#2A2547",
        actorLineColor:"#8A84A6", signalColor:"#2A2547", signalTextColor:"#2A2547",
        labelBoxBkgColor:"#EDE7F2", labelBoxBorderColor:"#2A2547",
        labelTextColor:"#2A2547", loopTextColor:"#2A2547",
        altSectionBkgColor:"#F7F4FB", sequenceNumberColor:"#FFFFFF"
      }});
  }
  initM();
  function esc(s){ return String(s==null?"":s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  /* Las menciones a otro caso —"…abre la oferta al chofer (CU-013)"— son
     enlaces: hay 544 repartidas en 63 casos y hasta ahora había que buscarlas a
     mano en el panel. Sólo se enlaza lo que existe. */
  function enlazarCasos(html){
    return html.replace(/\bCU-(\d{3})\b/g, function(todo){
      // Ni el caso que se está leyendo —se enlazaría a sí mismo, empezando por
      // su propia fila "Código"— ni un código que no existe.
      if (todo === sel || !CU[todo]) return todo;
      return '<a href="#'+todo+'" data-cu="'+todo+'">'+todo+"</a>";
    });
  }
  function md(s){ return enlazarCasos(esc(s).replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")); }
  function dibujar(nodo, src){
    if (!window.mermaid){ nodo.innerHTML = "<pre>"+esc(src)+"</pre>"; return; }
    try { mermaid.render("m"+(++seq), src).then(function(r){ nodo.innerHTML = r.svg; })
      .catch(function(){ nodo.innerHTML = "<pre>"+esc(src)+"</pre>"; }); }
    catch(e){ nodo.innerHTML = "<pre>"+esc(src)+"</pre>"; }
  }
  function tabla(filas){
    var f = filas.filter(function(x){ return x[1]; });
    if (!f.length) return "";
    return '<div class="scroller"><table><thead><tr><th>Campo</th><th>Detalle</th></tr></thead><tbody>' +
      f.map(function(x){
        // Un valor puede venir ya armado en HTML —los actores van marcados—;
        // el resto se escapa como siempre.
        var celda = (x[1] && x[1].html) ? x[1].html : md(x[1]);
        return '<tr><td class="campo">'+esc(x[0])+'</td><td>'+celda+'</td></tr>';
      }).join("") +
      "</tbody></table></div>";
  }
  function pasos(lista, titulo){
    if (!lista || !lista.length) return "";
    return '<h4 class="sub">'+titulo+'</h4><div class="scroller"><table><thead><tr><th>Paso</th><th>Acción</th></tr></thead><tbody>' +
      lista.map(function(p){ return '<tr><td class="p">'+esc(p.paso)+'</td><td>'+md(p.accion)+'</td></tr>'; }).join("") +
      "</tbody></table></div>";
  }
  /* "Cliente (ACT-01), Chofer (ACT-02)" → una marca por actor. */
  function actores(txt){
    var lista = String(txt||"").split(",").map(function(x){ return x.trim(); })
      .filter(function(x){ return x.length; });
    if (!lista.length) return "—";
    return lista.map(function(a){
      var m = /ACT-(0\d)/.exec(a);
      return '<span class="marca-actor marca-act"' + (m ? ' data-act="ACT-'+m[1]+'"' : "") +
             ">"+esc(a)+"</span>"; }).join(" ");
  }

  function card(clase, tag, titulo, fuente, cuerpo){
    return '<section class="card '+clase+'"><header><span class="tag">'+tag+'</span><h3>'+titulo+
      '</h3><span class="src">'+fuente+'</span></header><div class="body">'+cuerpo+"</div></section>";
  }
  function diagramas(lista, clase, tag, titulo, fuente, actoresDelCaso){
    if (!lista || !lista.length) return "";
    var quien = actoresDelCaso
      ? '<p class="quien"><b>Actores</b> '+actores(actoresDelCaso)+"</p>" : "";
    return card(clase, tag, titulo, fuente, quien + lista.map(function(d,i){
      return (lista.length>1 ? '<div class="dtitle">'+esc(d.titulo)+"</div>" : "") +
        '<div class="figura"><div class="diagram" data-src="'+clase+'-'+i+'"></div>' +
        '<span class="ampliar">CLIC PARA AMPLIAR</span></div>' +
        (d.comparte && d.comparte.length ? '<p class="shared">Diagrama compartido con '+
          d.comparte.join(" · ")+": modelan una misma interacción.</p>" : "");
    }).join(""));
  }

  /* Texto donde busca el buscador: TODO el caso, no sólo su cabecera.
     Antes miraba nombre, subsistema, descripción y actores, así que buscar
     "mercadopago" traía 4 de los 8 casos que lo mencionan: los otros lo tienen
     en los pasos, en las excepciones o en el diagrama, y no aparecían.
     Se arma una vez porque recorrer los 108 casos en cada tecla es caro. */
  /* Quién menciona a quién. El caso ya declara de dónde sale —la ficha
     "Dónde está respaldado"—, pero no de quién depende: si CU-013 cambia, hay
     nueve casos que lo nombran y no había forma de saberlo sin leerlos todos. */
  var MENCIONAN = {};
  codigos.forEach(function(c){ MENCIONAN[c] = []; });
  codigos.forEach(function(c){
    var vistos = {};
    (JSON.stringify(CU[c]).match(/CU-\d{3}/g) || []).forEach(function(r){
      if (r === c || vistos[r] || !MENCIONAN[r]) return;
      vistos[r] = 1;
      MENCIONAN[r].push(c);
    });
  });

  var BUSCA = {};
  codigos.forEach(function(c){
    BUSCA[c] = JSON.stringify(CU[c])
      .replace(/\\[nrt]/g, " ")
      .replace(/[{}\[\]",:]/g, " ")
      .toLowerCase();
  });

  function visible(c){
    var v = CU[c], q = document.getElementById("q").value.trim().toLowerCase();
    if (filtro === "Crítico" && (v.cua.calificacion||"") !== "Crítico") return false;
    if (filtro === "cur" && !v.cur) return false;
    if (!q) return true;
    var h = c.toLowerCase() + " " + BUSCA[c];
    return q.split(/\s+/).every(function(t){ return h.indexOf(t)>=0; });
  }
  function pintar(){
    var cont = document.getElementById("lista");
    // Con un término escrito, la búsqueda manda sobre el filtro: parado en
    // SISTEMA o en MÓDULOS el buscador no hacía nada, porque estas dos vistas
    // devuelven su lista fija y no llegaban a filtrar.
    var buscando = document.getElementById("q").value.trim().length > 0;
    if (filtro === "sis" && !buscando){
      var gen = [["actores","ACT","Actores del sistema"],
                 ["contexto","DIA","Diagrama de casos de uso del sistema"],
                 ["subsistemas","SUB","Subsistemas del proyecto"],
                 ["catalogo","CAT","Catálogo de los __N_CASOS__ casos"]];
      cont.innerHTML = '<div class="grp">Vista general</div>' +
        gen.filter(function(g){ return SIS[g[0]]; }).map(function(g){
          return '<button class="item" data-sis="'+g[0]+'"><span class="cod">'+g[1]+'</span><span class="nm">'+g[2]+"</span></button>";
        }).join("") +
        '<div class="grp">Diagramas del sistema · notación UML</div>' +
        '<button class="item" data-uml="actores"><span class="cod">ACT</span><span class="nm">Actores del sistema</span></button>' +
        '<button class="item" data-uml="contexto"><span class="cod">SIS</span><span class="nm">Diagrama de contexto</span></button>' +
        '<button class="item" data-uml="completo"><span class="cod">ALL</span><span class="nm">Diagrama completo de los __N_CASOS__ casos</span></button>' +
        '<button class="item" data-uml="subsistemas"><span class="cod">MAP</span><span class="nm">Mapa de subsistemas</span></button>' +
        '<button class="item" data-uml="despliegue"><span class="cod">DEP</span><span class="nm">Despliegue y entornos</span></button>' +
        '<div class="grp">Casos de uso por subsistema · notación UML</div>' +
        Object.keys(SS).sort().filter(function(k){return SS[k].uml;}).map(function(k){
          return '<button class="item" data-uml="'+k+'"><span class="cod marca-ss" data-ss="'+k+'">'+k+'</span><span class="nm">'+esc(SS[k].nombre)+"</span></button>";
        }).join("");
      enlazar(cont); return;
    }
    if (filtro === "mod" && !buscando){
      cont.innerHTML = '<div class="grp">Módulos inteligentes</div>' +
        Object.keys(MODS).sort().map(function(k){
          return '<button class="item" data-mod="'+k+'"><span class="dot" style="background:var(--mod)"></span>' +
            '<span class="cod">'+k+'</span><span class="nm">'+esc(MODS[k].nombre)+"</span></button>";
        }).join("");
      enlazar(cont); return;
    }
    var g = {}, orden = [];
    codigos.filter(visible).forEach(function(c){
      var k = CU[c].cua.subsistema || "Sin subsistema";
      if (!g[k]){ g[k]=[]; orden.push(k); }
      g[k].push(c);
    });
    // Por código de subsistema. Se agrupaban en el orden en que aparecía el
    // primer caso de cada uno, así que SS-14 caía entre SS-09 y SS-10.
    orden.sort(function(a,b){ return a.localeCompare(b, "es"); });
    if (!orden.length){ cont.innerHTML = '<div class="grp">Sin resultados</div>'; return; }
    // Los 18 subsistemas se pliegan. Con los 108 casos abiertos de una, encontrar
    // uno era scrollear a ojo; ahora queda abierto el del caso que se está
    // leyendo, y con una búsqueda en curso se abren todos los que tienen
    // resultados, que es cuando sí conviene ver todo junto.
    var hayBusqueda = document.getElementById("q").value.trim().length > 0;
    cont.innerHTML = orden.map(function(k){
      var abierto = hayBusqueda || (sel && g[k].indexOf(sel) >= 0) || abiertos[k];
      return '<div class="grupo'+(abierto ? " abierto" : "")+'">' +
        '<button class="grp" data-grupo="'+esc(k)+'" aria-expanded="'+!!abierto+'">' +
          '<span class="flecha" aria-hidden="true">›</span>' +
          '<span class="punto" style="background:'+tinteDe(k)+'"></span>' +
          '<span class="nombre">'+esc(k)+"</span>" +
          '<span class="cuenta">'+g[k].length+"</span>" +
        "</button>" +
        '<div class="casos">' + g[k].map(function(c){
          var v = CU[c], cal = v.cua.calificacion || "Secundario";
          return '<button class="item" data-cu="'+c+'" aria-current="'+(c===sel)+'">' +
            '<span class="dot '+esc(cal)+'"></span><span class="cod">'+c.replace("CU-","")+"</span>" +
            '<span class="nm">'+esc(v.cua.nombre||"")+"</span></button>";
        }).join("") + "</div></div>";
    }).join("");
    cont.querySelectorAll("[data-grupo]").forEach(function(b){
      b.onclick = function(){
        var k = b.dataset.grupo;
        abiertos[k] = !b.parentElement.classList.contains("abierto");
        b.parentElement.classList.toggle("abierto");
        b.setAttribute("aria-expanded", String(abiertos[k]));
      };
    });
    enlazar(cont);
  }
  function cerrarSiEsCajon(){
    if (window.matchMedia("(max-width:880px)").matches) panel(false);
  }
  function enlazar(c){
    c.querySelectorAll("[data-cu]").forEach(function(b){ b.onclick=function(){ abrir(b.dataset.cu); cerrarSiEsCajon(); }; });
    c.querySelectorAll("[data-uml]").forEach(function(b){ b.onclick=function(){ verUml(b.dataset.uml); cerrarSiEsCajon(); }; });
    c.querySelectorAll("[data-mod]").forEach(function(b){ b.onclick=function(){ verMod(b.dataset.mod); cerrarSiEsCajon(); }; });
    c.querySelectorAll("[data-sis]").forEach(function(b){ b.onclick=function(){ verSis(b.dataset.sis); cerrarSiEsCajon(); }; });
  }

  function abrir(c){
    sel = c; location.hash = c;
    var v = CU[c], e = v.cue||{}, a = v.cua||{}, cal = a.calificacion||"";
    var h = '<div class="head"><div class="over"><span>'+c+"</span>" +
      (cal ? '<span class="chip '+esc(cal)+'">'+esc(cal).toUpperCase()+"</span>" : "") +
      (v.modulo ? '<span class="chip m">MÓDULO '+v.modulo.codigo+"</span>" : "") +
      (v.cur ? '<span class="chip" style="color:var(--cur)">CU REAL</span>' : "") +
      '</div><h2>'+esc(a.nombre||c)+"</h2>" +
      '<div class="meta"><span><b>Actores</b> '+actores(a.actores)+"</span>" +
      '<span><b>Subsistema</b> '+esc(a.subsistema||"—")+"</span>" +
      (e.estado ? '<span><b>Estado</b> '+esc(e.estado)+"</span>" : "") + "</div></div>";

    h += card("k-cua","CUA","Caso de uso de alto nivel","Doc 0 · §7",
      tabla([["Código",c],["Caso de uso",a.nombre],["Actor/es",{html:actores(a.actores)}],
             ["Subsistema",a.subsistema],["Calificación",a.calificacion],["Descripción",a.descripcion]]));

    var cue = tabla([["Actor/es",{html:actores(a.actores)}],
                     ["Objetivos asociados",e.objetivos],["Requisitos asociados",e.requisitos],
                     ["Descripción",e.descripcion],["Precondición",e.precondicion],["Estado",e.estado]]);
    if (e.especificacion) cue += '<div class="note">'+md(e.especificacion)+"</div>";
    cue += pasos(e.secuencia,"Secuencia normal");
    if (e.postcondicion) cue += '<div class="note"><strong>Postcondición.</strong> '+md(e.postcondicion)+"</div>";
    cue += pasos(e.excepciones,"Excepciones");
    cue += (e.rendimiento||e.frecuencia||e.estabilidad||e.comentarios) ? '<h4 class="sub">Cierre</h4>' : "";
    cue += tabla([["Rendimiento",e.rendimiento],["Frecuencia",e.frecuencia],
                  ["Estabilidad",e.estabilidad],["Comentarios",e.comentarios]]);
    h += card("k-cue","CUE","Caso de uso expandido","Doc 1 · §7", cue);

    if (v.cur) h += card("k-cur","CUR","Caso de uso real, con pantalla","Doc 3 · "+v.cur.sec,
      '<p class="quien"><b>Actores</b> '+actores(a.actores)+"</p>" + v.cur.html);
    h += diagramas(v.dss,"k-dss","DSS","Diagrama de secuencia del sistema","Doc 2 · §2.1", a.actores);
    h += diagramas(v.dsd,"k-dsd","DSD","Diagrama de interacción de diseño","Doc 3 · §4", a.actores);
    if (v.modulo && MODS[v.modulo.codigo]){
      var m = MODS[v.modulo.codigo];
      h += card("k-mod","MOD","Módulo "+v.modulo.codigo+" — "+esc(m.nombre),"Doc 3 · "+m.sec, m.html);
    }
    var citan = MENCIONAN[c] || [];
    if (citan.length) {
      h += card("k-dep","DEP","Lo mencionan estos casos de uso",
        citan.length + (citan.length === 1 ? " caso" : " casos"),
        '<p class="quien">Cambiar este caso afecta a los que lo nombran.</p>' +
        '<div class="scroller"><table><thead><tr><th>Código</th><th>Caso de uso</th>' +
        "<th>Subsistema</th></tr></thead><tbody>" +
        citan.map(function(o){
          return '<tr><td class="p"><a href="#'+o+'" data-cu="'+o+'">'+o+"</a></td><td>" +
            esc(CU[o].cua.nombre||"") + "</td><td>" + esc(CU[o].cua.subsistema||"") + "</td></tr>";
        }).join("") + "</tbody></table></div>");
    }

    if (v.respaldo && v.respaldo.length){
      h += card("k-doc","DOC","Dónde está respaldado", v.respaldo.length+" referencias",
        '<div class="scroller"><table class="prov"><thead><tr><th>Documento</th><th>Sección</th><th>Qué contiene</th></tr></thead><tbody>' +
        v.respaldo.map(function(r){ return "<tr><td>"+esc(r.doc)+"</td><td>"+esc(r.sec)+"</td><td>"+esc(r.que)+"</td></tr>"; }).join("") +
        "</tbody></table></div>");
    }
    // Recorrer los casos en orden y llevarse el enlace directo. Antes había que
    // volver al panel para pasar al siguiente, y para citar un caso en el
    // documento había que copiar el hash de la barra de direcciones a mano.
    var i = codigos.indexOf(c);
    var previo = i > 0 ? codigos[i-1] : null;
    var siguiente = i < codigos.length-1 ? codigos[i+1] : null;
    h += '<nav class="paso">' +
      (previo ? '<button type="button" class="ir" data-paso="'+previo+'">← '+previo+
        " · "+esc(CU[previo].cua.nombre||"")+"</button>" : "<span></span>") +
      '<button type="button" class="copiar" data-copiar="'+c+'">COPIAR ENLACE</button>' +
      (siguiente ? '<button type="button" class="ir" data-paso="'+siguiente+'">'+siguiente+
        " · "+esc(CU[siguiente].cua.nombre||"")+" →</button>" : "<span></span>") +
      "</nav>";

    document.getElementById("detalle").innerHTML = h;
    document.getElementById("main").scrollTop = 0;
    document.querySelectorAll("[data-paso]").forEach(function(b){
      b.onclick = function(){ abrir(b.dataset.paso); };
    });
    var copiar = document.querySelector("[data-copiar]");
    if (copiar) copiar.onclick = function(){
      var url = location.href.split("#")[0] + "#" + copiar.dataset.copiar;
      navigator.clipboard.writeText(url).then(function(){
        copiar.textContent = "ENLACE COPIADO";
        setTimeout(function(){ copiar.textContent = "COPIAR ENLACE"; }, 1600);
      }).catch(function(){ copiar.textContent = url; });
    };
    ["dss","dsd"].forEach(function(k){
      (v[k]||[]).forEach(function(d,i){
        var n = document.querySelector('[data-src="k-'+k+'-'+i+'"]');
        if (n) dibujar(n, d.src);
      });
    });
    if (v.cur) (v.cur.mermaid||[]).forEach(function(src,i){
      var n = document.querySelectorAll('.k-cur [data-mer="'+i+'"]')[0]; if (n) dibujar(n, src); });
    if (v.modulo && MODS[v.modulo.codigo]) (MODS[v.modulo.codigo].mermaid||[]).forEach(function(src,i){
      var n = document.querySelectorAll('.k-mod [data-mer="'+i+'"]')[0]; if (n) dibujar(n, src); });
    pintar();
  }

  function verMod(k){
    sel = null; location.hash = "mod-"+k;
    var m = MODS[k]; if (!m) return;
    var cs = codigos.filter(function(c){ return CU[c].modulo && CU[c].modulo.codigo === k; });
    // La cátedra mira la trazabilidad entre el módulo y los casos que lo alimentan,
    // no sólo el caso que le da nombre.
    function enlaces(lista){
      return (lista||[]).map(function(c){
        return '<a href="#'+c+'" data-ir="'+c+'">'+c+"</a>" +
               (CU[c] ? ' <span class="tenue">'+esc(CU[c].cua.nombre||"")+"</span>" : "");
      }).join(" · ");
    }
    document.getElementById("detalle").innerHTML =
      '<div class="head"><div class="over"><span>MÓDULO '+k+'</span><span class="chip m">PROCESO AUTOMATIZADO</span></div>' +
      "<h2>"+esc(m.nombre)+"</h2>" +
      '<div class="meta"><span><b>Casos de uso propios</b> '+cs.join(" · ")+"</span></div></div>" +
      card("k-mod","MOD","Especificación del módulo","Doc 3 · "+m.sec, m.html) +
      ((m.usa && m.usa.length) ? card("k-cua","REF","Casos de uso que intervienen",
          m.usa.length+" casos", '<div class="refs">' +
          m.usa.map(function(g){ return "<p><b>"+esc(g[0])+"</b> "+enlaces(g[1])+"</p>"; }).join("") +
          "</div>") : "");
    document.getElementById("main").scrollTop = 0;
    (m.mermaid||[]).forEach(function(src,i){
      var n = document.querySelectorAll('.k-mod [data-mer="'+i+'"]')[0]; if (n) dibujar(n, src); });
    document.querySelectorAll(".refs [data-ir]").forEach(function(a){
      a.onclick = function(ev){ ev.preventDefault(); filtro="todos";
        document.querySelectorAll("#filtros button").forEach(function(x){
          x.setAttribute("aria-pressed", String(x.dataset.f==="todos")); });
        abrir(a.dataset.ir); };
    });
    pintar();
  }
  function verSis(k){
    sel = null; location.hash = "sis-"+k;
    var s = SIS[k]; if (!s) return;
    document.getElementById("detalle").innerHTML =
      '<div class="head"><div class="over"><span>VISTA GENERAL</span></div><h2>'+esc(s.titulo)+"</h2></div>" +
      card("k-doc","SIS",esc(s.titulo),s.sec,s.html);
    document.getElementById("main").scrollTop = 0;
    (s.mermaid||[]).forEach(function(src,i){
      var n = document.querySelectorAll('.k-doc [data-mer="'+i+'"]')[0]; if (n) dibujar(n, src); });
    pintar();
  }
  function verUml(k){
    sel = null; location.hash = "uml-"+k;
    // contexto, completo y actores son diagramas de nivel sistema; el resto,
    // el de cada subsistema
    var g = UMLSIS[k];
    var img = g ? g.img : (SS[k] && SS[k].uml);
    var nom = g ? g.nombre : (SS[k] ? SS[k].nombre : k);
    var sub = g ? g.descripcion : (SS[k] ? SS[k].descripcion : "");
    document.getElementById("detalle").innerHTML =
      '<div class="head"><div class="over"><span>'+esc(g ? "SISTEMA" : k)+'</span>' +
      '<span class="chip">NOTACIÓN UML</span></div><h2>'+esc(nom)+"</h2>" +
      (sub ? '<div class="meta"><span>'+esc(sub)+"</span></div>" : "") + "</div>" +
      card("k-doc","UML","Diagrama de casos de uso","Doc 1 · §3 y §4.3",
        img ? '<div class="figura"><img class="umlimg" alt="'+esc(nom)+'" src="'+img+'">' +
          '<span class="ampliar">CLIC PARA AMPLIAR</span></div>'
            : '<p class="note">Diagrama no disponible.</p>') +
      (g ? "" : (function(){
        var cs = codigos.filter(function(c){ return (CU[c].cua.subsistema||"").indexOf(k) === 0; });
        if (!cs.length) return "";
        return card("k-cua","CU","Casos de uso de este subsistema", cs.length+" casos",
          '<div class="scroller"><table><thead><tr><th>Código</th><th>Caso de uso</th><th>Calificación</th></tr></thead><tbody>' +
          cs.map(function(c){ return '<tr><td class="p"><a href="#'+c+'" data-ir="'+c+'">'+c+"</a></td><td>" +
            esc(CU[c].cua.nombre||"")+"</td><td>"+esc(CU[c].cua.calificacion||"")+"</td></tr>"; }).join("") +
          "</tbody></table></div>");
      })());
    document.getElementById("main").scrollTop = 0;
    document.querySelectorAll("[data-ir]").forEach(function(a){
      a.onclick = function(ev){ ev.preventDefault(); filtro="todos";
        document.querySelectorAll("#filtros button").forEach(function(x){
          x.setAttribute("aria-pressed", String(x.dataset.f==="todos")); });
        abrir(a.dataset.ir); };
    });
    pintar();
  }
  function inicio(){
    sel = null;
    /* La portada era un segundo índice: repetía en fichas lo que la barra ya
       lista. Ahora muestra de qué se trata el sistema —el viaje de un pedido,
       de la app del cliente hasta la garrafa en la puerta— y el tamaño de la
       documentación. Para entrar a un caso está el menú. */
    var totalDiagramas = __N_MERMAID__ + __N_UML__;
    document.getElementById("detalle").innerHTML =
      '<div class="portada">' +
        '<div class="over"><span>SPLG</span><span class="chip">DOCUMENTACIÓN DEL SISTEMA</span></div>' +
        "<h2>Sistema de Pedidos y Logística de Garrafas de Gas</h2>" +
        "<p class=\"bajada\">Un pedido nace en el teléfono del cliente, la distribuidora lo " +
          "toma, se le ofrece al chofer más cercano y termina en la puerta. Todo lo que hace " +
          "el sistema para que ese viaje ocurra está documentado acá, caso por caso.</p>" +
        viaje() +
        '<div class="cifras">' +
          cifra(codigos.length, "casos de uso", "todos") +
          cifra(codigos.filter(function(c){ return CU[c].cur; }).length, "casos reales, con pantalla", "cur") +
          cifra(Object.keys(MODS).length, "módulos inteligentes", "mod") +
          cifra(Object.keys(SS).length, "subsistemas", "sis") +

        "</div>" +
        '<p class="pista">Elegí <strong>Documentación</strong> en el menú para recorrerlos, ' +

      "</div>";
    document.getElementById("main").scrollTop = 0;
    document.querySelectorAll("[data-abre]").forEach(function(b){
      b.onclick = function(){
        seccionDoc(true);
        if (window.matchMedia("(max-width:880px)").matches) panel(true);
        ponerFiltro(b.dataset.abre);

  /* Ramas, versionado y agentes se muestran acá mismo. El archivo suelto sigue
     existiendo para enlazarlo directo, pero desde el menú no se sale de la
     vista: es el mismo sitio. */
  var PAGS = D.paginas || {};
  function verPagina(k){
    var pag = PAGS[k];
    if (!pag) return false;
    sel = null;
    location.hash = k;
    // Los enlaces entre estas páginas también se quedan en la vista: si no, un
    // "ver Versionado" en el medio del texto sacaba al lector del sitio.
    var html = pag.html
      .replace(/href="branching\.html"/g, 'href="#ramas" data-pag-en-vista="ramas"')
      .replace(/href="versionado\.html"/g, 'href="#versionado" data-pag-en-vista="versionado"')
      .replace(/href="asistentes\.html"/g, 'href="#agentes" data-pag-en-vista="agentes"');
    document.getElementById("detalle").innerHTML = '<div class="pagina">' + html + "</div>";
    if (window.marcarFigurasAmpliables) window.marcarFigurasAmpliables();
    document.querySelectorAll("[data-pag-en-vista]").forEach(function(a){
      a.onclick = function(ev){ ev.preventDefault(); verPagina(a.dataset.pagEnVista); };
    });
    document.getElementById("main").scrollTop = 0;
    document.querySelectorAll(".seccion[data-pag]").forEach(function(b){
      b.setAttribute("aria-current", String(b.dataset.pag === k)); });
    pintar();
    return true;
  }
  document.querySelectorAll(".seccion[data-pag]").forEach(function(b){
    b.onclick = function(){ verPagina(b.dataset.pag); cerrarSiEsCajon(); };
  });

  /* Las cifras son la puerta de entrada, no un adorno: la portada dejó de
     listar en fichas todo lo que hay —eso lo hace el menú— pero tenía que
     seguir diciendo que existen módulos, casos reales y vistas del sistema.
     Cada una abre su parte. */
  function cifra(n, que, filtroDestino){
    if (!filtroDestino) return '<div class="cifra"><b>'+n+"</b><span>"+que+"</span></div>";
    return '<button type="button" class="cifra" data-abre="'+filtroDestino+'">' +
      "<b>"+n+"</b><span>"+que+"</span></button>";
  }

  /* El viaje de un pedido, dibujado. El camión recorre el camino, la garrafa
     baja en el domicilio y el ciclo vuelve a empezar. Se detiene solo si el
     sistema operativo pide menos movimiento. */
  function viaje(){
    return '<div class="viaje" role="img" aria-label="El recorrido de un pedido: del ' +
      'teléfono del cliente a la distribuidora, y de ahí al domicilio en la camioneta">' +
      '<svg viewBox="0 0 900 220">' +
        '<line class="ruta" x1="70" y1="168" x2="830" y2="168"/>' +
        '<line class="ruta-avance" x1="70" y1="168" x2="830" y2="168"/>' +

        '<g class="parada" transform="translate(70,168)">' +
          '<rect x="-26" y="-58" width="52" height="58" rx="7" class="edificio"/>' +
          '<rect x="-13" y="-40" width="12" height="14" rx="2" class="ventana"/>' +
          '<rect x="3" y="-40" width="12" height="14" rx="2" class="ventana"/>' +
          '<rect x="-8" y="-20" width="16" height="20" rx="2" class="puerta"/>' +
          '<text x="0" y="26" text-anchor="middle" class="rotulo-viaje">DISTRIBUIDORA</text>' +
        "</g>" +

        '<g class="parada" transform="translate(830,168)">' +
          '<path d="M-30 0 L-30 -34 L0 -58 L30 -34 L30 0 Z" class="edificio"/>' +
          '<rect x="-9" y="-24" width="18" height="24" rx="2" class="puerta"/>' +
          '<text x="0" y="26" text-anchor="middle" class="rotulo-viaje">DOMICILIO</text>' +
        "</g>" +

        '<g class="pedido">' +
          '<rect x="-30" y="-16" width="60" height="30" rx="15" class="globo"/>' +
          '<text x="0" y="4" text-anchor="middle" class="texto-globo">PEDIDO</text>' +
        "</g>" +

        '<g class="camioneta">' +
          '<rect x="-42" y="-34" width="52" height="28" rx="4" class="caja-camion"/>' +
          '<path d="M10 -34 L30 -34 L40 -16 L40 -6 L10 -6 Z" class="cabina"/>' +
          '<rect x="16" y="-30" width="16" height="11" rx="2" class="vidrio"/>' +
          '<g class="garrafa-carga" transform="translate(-16,-20)">' +
            '<rect x="-7" y="-8" width="14" height="18" rx="3" class="garrafa"/>' +
            '<rect x="-3" y="-12" width="6" height="5" rx="1.5" class="valvula"/>' +
          "</g>" +
          '<circle class="rueda" cx="-26" cy="-4" r="8"/>' +
          '<circle class="rueda" cx="26" cy="-4" r="8"/>' +
        "</g>" +

        '<g class="entrega" transform="translate(786,168)">' +
          '<rect x="-9" y="-26" width="18" height="24" rx="4" class="garrafa"/>' +
          '<rect x="-4" y="-31" width="8" height="6" rx="2" class="valvula"/>' +
        "</g>" +
      "</svg>" +
    "</div>";
  }

  document.getElementById("alInicio").onclick = function(){
    location.hash = ""; ponerFiltro("todos"); pintar(); inicio(); };
  document.getElementById("q").addEventListener("input", pintar);
  function ponerFiltro(f){
    filtro = f;
    document.querySelectorAll("#filtros button").forEach(function(x){
      x.setAttribute("aria-pressed", String(x.dataset.f === f)); });
  }
  document.getElementById("filtros").addEventListener("click", function(ev){
    var b = ev.target.closest("button"); if (!b) return;
    ponerFiltro(b.dataset.f); pintar();
  });
  document.addEventListener("keydown", function(ev){
    var q = document.getElementById("q");
    if (ev.key === "Escape" && window.matchMedia("(max-width:880px)").matches &&
        !app.classList.contains("sin-panel")){ panel(false); return; }
    if (ev.key === "/" && document.activeElement !== q){
      ev.preventDefault(); seccionDoc(true); q.focus(); q.select(); return; }
    if (ev.key === "Escape" && document.activeElement === q){ q.value=""; pintar(); q.blur(); return; }
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp"){
      var vis = codigos.filter(visible); if (!vis.length) return;
      var i = vis.indexOf(sel);
      i = ev.key === "ArrowDown" ? (i+1)%vis.length : (i<=0 ? vis.length-1 : i-1);
      ev.preventDefault(); abrir(vis[i]);
      var el = document.querySelector('[data-cu="'+vis[i]+'"]'); if (el) el.scrollIntoView({block:"nearest"});
    }
  });
  function irA(h){
    if (!h) return false;
    if (CU[h]){ if (h !== sel) abrir(h); return true; }
    if (h.indexOf("sis-") === 0 && SIS[h.slice(4)]){ ponerFiltro("sis"); verSis(h.slice(4)); return true; }
    if (h.indexOf("mod-") === 0 && MODS[h.slice(4)]){ ponerFiltro("mod"); verMod(h.slice(4)); return true; }
    if (h.indexOf("uml-") === 0){ ponerFiltro("sis"); verUml(h.slice(4)); return true; }
    if (PAGS[h]) return verPagina(h);
    return false;
  }
  // Un solo manejador para todas las menciones, vengan de donde vengan.
  document.addEventListener("click", function(ev){
    var a = ev.target.closest && ev.target.closest("a[data-cu]");
    if (!a) return;
    ev.preventDefault();
    filtro = "todos";
    document.querySelectorAll("#filtros button").forEach(function(x){
      x.setAttribute("aria-pressed", String(x.dataset.f === "todos")); });
    abrir(a.dataset.cu);
  });
  window.addEventListener("hashchange", function(){ irA((location.hash||"").replace("#","")); });

  /* La sección de documentación arranca plegada: la barra se lee primero como
     el índice del sitio —documentación, ramas, versionado, agentes— y recién
     al abrirla aparecen el buscador y los casos. */
  var abrirDoc = document.getElementById("abrirDoc");
  var cuerpoDoc = document.getElementById("doc");
  function seccionDoc(mostrar){
    cuerpoDoc.classList.toggle("abierta", mostrar);
    abrirDoc.setAttribute("aria-expanded", String(mostrar));
    try { localStorage.setItem("splg-doc", mostrar ? "1" : "0"); } catch (e) {}
  }
  abrirDoc.onclick = function(){ seccionDoc(!cuerpoDoc.classList.contains("abierta")); };
  try { if (localStorage.getItem("splg-doc") === "1") seccionDoc(true); } catch (e) {}

  var app = document.querySelector(".app");
  var alternar = document.getElementById("alternarPanel");
  var fondo = document.getElementById("fondoCajon");
  var angosta = window.matchMedia("(max-width:880px)");

  function panel(mostrar){
    app.classList.toggle("sin-panel", !mostrar);
    alternar.setAttribute("aria-expanded", String(mostrar));
    alternar.querySelector(".rotulo-btn").textContent =
      angosta.matches ? "MENÚ" : (mostrar ? "CASOS DE USO" : "VER CASOS");
    fondo.hidden = !(angosta.matches && mostrar);
    // Con el cajón abierto no se scrollea el fondo.
    document.documentElement.style.overflow = (angosta.matches && mostrar) ? "hidden" : "";
    if (!angosta.matches) { try { localStorage.setItem("splg-panel", mostrar ? "1" : "0"); } catch (e) {} }
  }
  alternar.onclick = function(){ panel(app.classList.contains("sin-panel")); };
  fondo.onclick = function(){ panel(false); };

  // En pantalla angosta el cajón arranca cerrado siempre; en ancha se respeta
  // lo que el lector eligió la vez anterior.
  if (angosta.matches) panel(false);
  else { try { if (localStorage.getItem("splg-panel") === "0") panel(false); else panel(true); } catch (e) { panel(true); } }
  angosta.addEventListener("change", function(){ panel(!angosta.matches); });

  pintar();
  if (!irA((location.hash||"").replace("#",""))) inicio();
})();
</script>
</body>
</html>
