<!doctype html><html><head><meta charset="utf-8"><title>SPLG — previsualizar en pantalla ancha</title>
<!-- Sirve para mirar el sitio en tres columnas cuando la ventana del navegador
     no llega a 1180px: mete la página en un marco de 1440 y lo achica para que
     entre. No se publica: `publicar.sh` copia sólo la lista de archivos del
     sitio. -->
<style>html,body{margin:0;background:#222;overflow:hidden}
iframe{width:1440px;height:900px;border:0;transform:scale(.42);transform-origin:0 0;display:block}</style>
</head><body><iframe id="f" src="splg-documentacion.html"></iframe></body></html>
