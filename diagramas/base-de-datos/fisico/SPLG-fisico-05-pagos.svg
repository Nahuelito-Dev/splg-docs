;stroke-width:1.563;"/><line x1="191.781" y1="238.453" x2="182.406" y2="250.953" style="stroke:#2C4257;stroke-width:1.563;"/><line x1="191.781" y1="238.453" x2="191.781" y2="250.953" style="stroke:#2C4257;stroke-width:1.563;"/><ellipse cx="191.781" cy="229.078" rx="6.25" ry="6.25" fill="none" style="stroke:#2C4257;stroke-width:1.563;"/><text x="193.344" y="198.813" fill="#000" font-size="18.75" textLength="68.793" font-family="Helvetica">order_id</text></g><g class="legend" data-source-line="51"><rect x="117.009" y="643.75" width="1004.102" height="65.625" fill="none" style="stroke:#2C4257;stroke-width:1.563;" rx="11.719" ry="11.719"/><rect x="124.821" y="654.688" width="240.646" height="21.875" fill="#F1F1F1" style="stroke:none;"/><text x="124.821" y="671.532" fill="#000" font-size="21.875" font-family="Helvetica"> </text><text x="130.899" y="671.532" fill="#000" font-size="21.875" textLength="228.491" font-weight="700" font-family="Helvetica">tabla de otro contexto</text><text x="359.39" y="671.532" fill="#000" font-size="21.875" font-family="Helvetica"> </text><text x="371.545" y="671.532" fill="#000" font-size="21.875" textLength="684.566" font-family="Helvetica">sólo se muestra su nombre; sus columnas están en su propio contexto</text><rect x="124.821" y="676.563" width="240.646" height="21.875" fill="#FFF" style="stroke:none;"/><text x="124.821" y="693.407" fill="#000" font-size="21.875" font-family="Helvetica"> </text><text x="130.899" y="693.407" fill="#000" font-size="21.875" textLength="140.97" font-weight="700" font-family="Helvetica">distributor_id</text><text x="271.869" y="693.407" fill="#000" font-size="21.875" font-family="Helvetica"> </text><text x="371.545" y="693.407" fill="#000" font-size="21.875" textLength="735.675" font-family="Helvetica">la tabla pertenece a una distribuidora (FK a distributor); la línea no se dibuja</text><line x1="124.821" y1="654.688" x2="1113.298" y2="654.688" style="stroke:#000;stroke-width:1.563;"/><line x1="124.821" y1