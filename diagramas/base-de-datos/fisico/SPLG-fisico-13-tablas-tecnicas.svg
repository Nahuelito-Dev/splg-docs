z *</text><text x="387.413" y="233.188" fill="#000" font-size="18.75" textLength="158.395" font-family="Helvetica">kind : varchar(10) *</text><text x="387.413" y="251.938" fill="#000" font-size="18.75" textLength="174.023" font-family="Helvetica">status : varchar(10) *</text><text x="387.413" y="270.688" fill="#000" font-size="18.75" textLength="263.663" font-family="Helvetica">next_attempt_at : timestamptz *</text><line x1="379.6" y1="281.25" x2="658.888" y2="281.25" style="stroke:#2C4257;stroke-width:0.781;"/></g><!--class e_document_sequence--><g class="entity" data-qualified-name="e_document_sequence" id="ent0002" data-source-line="43"><rect x="715.538" y="121.875" width="276.141" height="115.625" fill="#FFF" style="stroke:#2C4257;stroke-width:0.781;" rx="3.906" ry="3.906"/><text x="766.565" y="144.125" fill="#000" font-size="18.75" textLength="174.088" font-family="Helvetica">document_sequence</text><line x1="717.1" y1="156.25" x2="990.117" y2="156.25" style="stroke:#2C4257;stroke-width:0.781;"/><text x="724.913" y="176.938" fill="#000" font-size="18.75" textLength="120.831" font-weight="700" font-family="Helvetica">distributor_id</text><text x="850.954" y="176.938" fill="#000" font-size="18.75" textLength="109.451" font-family="Helvetica">: uuid * «PK»</text><text x="724.913" y="195.688" fill="#000" font-size="18.75" textLength="82.315" font-weight="700" font-family="Helvetica">doc_type</text><text x="812.437" y="195.688" fill="#000" font-size="18.75" textLength="169.867" font-family="Helvetica">: varchar(40) * «PK»</text><text x="724.913" y="214.438" fill="#000" font-size="18.75" textLength="188.644" font-family="Helvetica">last_number : integer *</text><line x1="717.1" y1="225" x2="990.117" y2="225" style="stroke:#2C4257;stroke-width:0.781;"/></g><g class="entity" data-qualified-name="N" id="ent0003" data-source-line="55"><path d="M43.21,387.5 L43.21,459.375 L995.267,459.375 L995.267,403.125 L979.642,387.5 L43.21,387.5" style="stroke:#181818;stroke-width:0.781;" fill="#FEFFDD"/><path d="M979.642,387.5 L979.642,403.125 L995.267,403.125 L979.642,387.5" style="stroke:#181818;stroke-width:1.563;" fill="#FEFFDD"/><text x="52.585" y="409.75" fill="#000" font-size="18.75" textLength="898.361" font-family="Helvetica">Los nombres reflejan la base real: conviven camelCase (paymentMethod, createdAt, isActive) y snake_case</text><text x="52.585" y="428.5" fill="#000" font-size="18.75" textLength="919.244" font-family="Helvetica">(scheduled_date, delivery_mode) porque las columnas más antiguas se crearon así y las posteriores siguieron</text><text x="52.585" y="447.25" fill="#000" font-size="18.75" textLength="562.802" font-family="Helvetica">otra convención; la tabla claims está en plural y el resto en singular.</text></g><g class="legend" data-source-line="50"><rect x="18.75" y="492.188" width="1004.102" height="65.625" fill="none" style="stroke:#2C4257;stroke-width:1.563;" rx="11.719" ry="11.719"/><rect x="26.563" y="503.125" width="240.646" height="21.875" fill="#F1F1F1" style="stroke:none;"/><text x="26.563" y="519.969" fill="#000" font-size="21.875" font-family="Helvetica"> </text><text x="32.64" y="519.969" fill="#000" font-size="21.875" textLength="228.491" font-weight="700" font-family="Helvetica">tabla de otro contexto</text><text x="261.131" y="519.969" fill="#000" font-size="21.875" font-family="Helvetica"> </text><text x="273.286" y="519.969" fill="#000" font-size="21.875" textLength="684.566" font-family="Helvetica">sólo se muestra su nombre; sus columnas están en su propio contexto</text><rect x="26.563" y="525" width="240.646" height="21.875" fill="#FFF" style="stroke:none;"/><text x="26.563" y="541.844" fill="#000" font-size="21.875" font-family="Helvetica"> </text><text x="32.64" y="541.844" fill="#000" font-size="21.875" textLength="140.97" font-weight="700" font-family="Helvetica">distributor_id</text><text x="173.61" y="541.844" fill="#000" font-size="21.875" font-family="Helvetica"> </text><text x="273.286" y="541.844" fill="#000" font-size="21.875" textLength="735.675" font-family="Helvetica">la tabla pertenece a una distribuidora (FK a distributor); la línea no se dibuja</text><line x1="26.563" y1="503.125" x2="1015.039" y2="503.125" style="stroke:#000;stroke-width:1.563;"/><line x1="26.563" y1="525" x2="1015.039" y2="525" style="stroke:#000;stroke-width:1.563;"/><line x1="26.563" y1="546.875" x2="1015.039" y2="546.875" style="stroke:#000;stroke-width:1.563;"/><line x1="26.563" y1="503.125" x2="26.563" y2="546.875" style="stroke:#000;stroke-width:1.563;"/><line x1="267.209" y1="503.125" x2="267.209" y2="546.875" style="stroke:#000;stroke-width:1.563;"/><line x1="1015.039" y1="503.125" x2="1015.039" y2="546.875" style="stroke:#000;stroke-width:1.563;"/></g><?plantuml-src hLLBRXD14DtFAKgmIQm8uH0J89ObOs8X1I8as8_QqsMxavxkeJy91aVY45mWInPPvGY-2IVXjJqXuyIG3UEDf_jrlLUlgdg22fhflPMiBOqNLruLbdvz_q6Vn4WBJs7nip2g43xpfyfKmecIHg8udJWRZHnORHqz7YwV1i9FXRJdoaneBBJdnexaiOWw3Aq9nw9aUilwZ0C8DcC-ggzCxTtcPgMetNdQM2cWqzEtZEYrTP9TBMftiBVRsK-hVv5Br7VEdj-5Dsal6ZHiWWgpRbUSi16ztehmNkXs-jsLygB_Sh__h8vThtKwpzlF1siCoqIwtShPAh8FzeQa6Qezx1o-66oYFjmxV3FSsoZv_qNKF64ZNp_O03LkGpsogP9CXNA5RlQ5LeR3h6Agh9wbbonRgQT7qEt4X7FhggamZmXToVdwuZAhRsF5MbvGgxLQp9LijUWLnQWajQZR_N3KwpLmDo5EUGRKcN35LBYjJdjtcreDc0Y1oofuO9G9oCkjRQDc8MSqaWCWy9VGs2iSYy0o5o7jgH8b40ZrTIr0hEJ38FWa6oBRJzSruaY8_Xy00s5vdSacfei_RajRn18lkUVFaKt1jU7trkzuBfKFJeqYJ7t8U81jaQTgBs4tclUIvllefS4cbYDsQoMuoB9irMOqiY7OCfjtw_dhWIAa-mjN2TdWB1KOF5XWGJWdlxZ6PUUPoZGKJf2FP6mvSdo0lnvW7KkJilPXSMamHWcHXaZTHgBvac_vz3RbFuToMgces0Ks3Cy4HGDLDLP9T21j3O_eTWtdjm_IKRsuCYmWB2cLs3aHu4IwgwGpOmEdqXp3gtVMrnbuSZpMV8APG8oHm5aqeNwLT9-fCwHIuDhLWxInLObPAkbx3bChTsxQjHzsIFb-4G3VfXbv8quvnoU0mRJbYodBgD6mgMrtuB06pito4j-GROolGtkaejtQM2ukFGdqroJY3SI9o5a3zOih42HmPNrWfspAm0Ee603msLIVf1qjfnRNvk3MLLoNggoBb6fKwUY4HZpMo1dJlImSFa9H2_SaEKV9izy0?></g></svg>