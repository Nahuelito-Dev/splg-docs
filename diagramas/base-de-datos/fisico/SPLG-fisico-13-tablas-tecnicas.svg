="535.938" width="1004.102" height="65.625" fill="none" style="stroke:#2C4257;stroke-width:1.563;" rx="11.719" ry="11.719"/><rect x="155.001" y="546.875" width="240.646" height="21.875" fill="#F1F1F1" style="stroke:none;"/><text x="155.001" y="563.719" fill="#000" font-size="21.875" font-family="Helvetica"> </text><text x="161.079" y="563.719" fill="#000" font-size="21.875" textLength="228.491" font-weight="700" font-family="Helvetica">tabla de otro contexto</text><text x="389.57" y="563.719" fill="#000" font-size="21.875" font-family="Helvetica"> </text><text x="401.725" y="563.719" fill="#000" font-size="21.875" textLength="684.566" font-family="Helvetica">sólo se muestra su nombre; sus columnas están en su propio contexto</text><rect x="155.001" y="568.75" width="240.646" height="21.875" fill="#FFF" style="stroke:none;"/><text x="155.001" y="585.594" fill="#000" font-size="21.875" font-family="Helvetica"> </text><text x="161.079" y="585.594" fill="#000" font-size="21.875" textLength="140.97" font-weight="700" font-family="Helvetica">distributor_id</text><text x="302.049" y="585.594" fill="#000" font-size="21.875" font-family="Helvetica"> </text><text x="401.725" y="585.594" fill="#000" font-size="21.875" textLength="735.675" font-family="Helvetica">la tabla pertenece a una distribuidora (FK a distributor); la línea no se dibuja</text><line x1="155.001" y1="546.875" x2="1143.478" y2="546.875" style="stroke:#000;stroke-width:1.563;"/><line x1="155.001" y1="568.75" x2="1143.478" y2="568.75" style="stroke:#000;stroke-width:1.563;"/><line x1="155.001" y1="590.625" x2="1143.478" y2="590.625" style="stroke:#000;stroke-width:1.563;"/><line x1="155.001" y1="546.875" x2="155.001" y2="590.625" style="stroke:#000;stroke-width:1.563;"/><line x1="395.647" y1="546.875" x2="395.647" y2="590.625" style="stroke:#000;stroke-width:1.563;"/><line x1="1143.478" y1="546.875" x2="1143.478" y2="590.625" style="stroke:#000;stroke-width:1.563;"/></g><?plantuml-src hLNBRXit5DtFLroa6rimYiYLd