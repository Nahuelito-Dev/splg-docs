 H85.0 M70.0 525.8 L57.0 545.8 M70.0 525.8 L83.0 545.8" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="559.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Administrador</text><text x="70.0" y="573.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-03)</text></g><g class="actor" data-act="05" data-x="70" data-y="708"><circle cx="70.0" cy="707.8" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 716.8 V740.8 M55.0 724.8 H85.0 M70.0 740.8 L57.0 760.8 M70.0 740.8 L83.0 760.8" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="774.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Administrador</text><text x="70.0" y="788.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">General</text><text x="70.0" y="801.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-05)</text></g><g class="actor" data-act="04" data-x="70" data-y="842"><circle cx="70.0" cy="841.8" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 850.8 V874.8 M55.0 858.8 H85.0 M70.0 874.8 L57.0 894.8 M70.0 874.8 L83.0 894.8" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="908.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Sistema Automático</text><text x="70.0" y="922.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-04)</text></g><g class="actor" data-act="08" data-x="70" data-y="976"><circle cx="70.0" cy="975.8" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 984.8 V1008.8 M55.0 992.8 H85.0 M70.0 1008.8 L57.0 1028.8 M70.0 1008.8 L83.0 1028.8" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="1042.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">«sistema externo»</text><text x="70.0" y="1056.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Servicio de correo</text><text x="70.0" y="1069.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-08)</text></g><path class="gen" data-esp="05" data-gen="03" d="M70 697.8 V599.8" fill="none" stroke="#1F3A5F" stroke-width="1" marker-end="url(#hueco)"/><text x="150.0" y="1143.8" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Tres columnas: el actor, los casos de uso que inicia y, a la derecha, los casos relacionados con ellos por «include» o «extend».</text><text x="150.0" y="1159.8" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: del caso que extiende al caso base (línea discontinua, con su punto de extensión PE-n,</text><text x="150.0" y="1173.8" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">que figura también en el compartimiento «puntos de extensión» del caso base).</text><text x="150.0" y="1189.8" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Cada «include» y cada «extend» tiene su propio trazo, con el rótulo junto a su arranque. Con relleno rosado, los casos de uso planificados; con borde discontinuo, los casos de uso que no</text><text x="150.0" y="1203.8" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">inicia el actor de este diagrama o que son de otro subsistema, solo como referencia.</text></svg>