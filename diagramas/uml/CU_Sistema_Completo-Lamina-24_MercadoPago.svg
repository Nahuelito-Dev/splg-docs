2 V204.2 M55.0 188.2 H85.0 M70.0 204.2 L57.0 224.2 M70.0 204.2 L83.0 224.2" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="238.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">«sistema externo»</text><text x="70.0" y="251.3" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">MercadoPago</text><text x="70.0" y="264.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-06)</text></g><text x="150.0" y="475.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Tres columnas: el actor, los casos de uso que inicia y, a la derecha, los casos relacionados con ellos por «include» o «extend».</text><text x="150.0" y="491.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: del caso que extiende al caso base (línea discontinua, con su punto de extensión PE-n, que</text><text x="150.0" y="505.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">figura también en el compartimiento «puntos de extensión» del caso base).</text><text x="150.0" y="521.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Cada «include» y cada «extend» tiene su propio trazo, con el rótulo junto a su arranque. Con relleno rosado, los casos de uso planificados; con borde discontinuo, los casos de uso que no inicia el actor</text><text x="150.0" y="535.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">de este diagrama o que son de otro subsistema, solo como referencia.</text><text x="150.0" y="551.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-02 CU-044 extiende a CU-005: cuando el cliente quiere agendar la entrega en una franja horaria</text><text x="150.0" y="567.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-03 CU-148 extiende a CU-005: cuando el cliente puede elegir la modalidad express</text></svg>