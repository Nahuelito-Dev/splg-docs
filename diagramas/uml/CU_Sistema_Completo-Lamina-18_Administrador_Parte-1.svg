chor="start" dominant-baseline="central" fill="#1F3A5F">Con borde discontinuo, los casos de uso de otro diagrama, solo como referencia.</text><text x="235.0" y="800.6" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-1 CU-177 extiende a CU-003: cuando el chofer que se registra todavía no tiene legajo</text></g></svg>