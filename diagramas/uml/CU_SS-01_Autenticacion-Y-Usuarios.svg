h d="M70.0 545.5 V569.5 M55.0 553.5 H85.0 M70.0 569.5 L57.0 589.5 M70.0 569.5 L83.0 589.5" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="603.5" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Cliente</text><text x="70.0" y="616.7" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-01)</text></g><g class="actor" data-act="08" data-x="70" data-y="671"><circle cx="70.0" cy="670.5" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 679.5 V703.5 M55.0 687.5 H85.0 M70.0 703.5 L57.0 723.5 M70.0 703.5 L83.0 723.5" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="737.5" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">«sistema externo»</text><text x="70.0" y="750.7" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Servicio de correo</text><text x="70.0" y="763.9" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-08)</text></g><g class="actor" data-act="07" data-x="70" data-y="805"><circle cx="70.0" cy="804.5" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 813.5 V837.5 M55.0 821.5 H85.0 M70.0 837.5 L57.0 857.5 M70.0 837.5 L83.0 857.5" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="871.5" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">«sistema externo»</text><text x="70.0" y="884.7" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Firebase</text><text x="70.0" y="897.9" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-07)</text></g><text x="150.0" y="972.5" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Tres columnas: el actor, los casos de uso que inicia y, a la derecha, los casos relacionados con ellos por «include» o «extend».</text><text x="150.0" y="988.5" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: del caso que extiende al caso base (línea discontinua, con su punto de extensión PE-n, que</text><text x="150.0" y="1002.5" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">figura también en el compartimiento «puntos de extensión» del caso base).</text><text x="150.0" y="1018.5" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Cada «include» y cada «extend» tiene su propio trazo, con el rótulo junto a su arranque. Con relleno rosado, los casos de uso planificados; con borde discontinuo, los casos de uso que no inicia el</text><text x="150.0" y="1032.5" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">actor de este diagrama o que son de otro subsistema, solo como referencia.</text></svg>