text x="235.0" y="500.6" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»:</text><text x="235.0" y="514.6" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">de la extensión al caso base (línea discontinua).</text><text x="235.0" y="530.6" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">ACT-05 especializa a ACT-03 (triángulo hueco); además, cada caso de uso lleva la asociación de todos los</text><text x="235.0" y="544.6" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">actores que el catálogo le asigna, también la de ACT-05.</text></g></svg>