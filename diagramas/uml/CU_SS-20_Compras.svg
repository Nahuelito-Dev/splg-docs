u="CU-285" data-x="365" data-y="655"><ellipse cx="365.0" cy="655.2" rx="175" ry="25.6" fill="url(#vp)" stroke="#3C5F8F" stroke-width="1.0"/><text x="365.0" y="642.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-285</text><text x="365.0" y="655.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Consultar el Costo Promedio de las</text><text x="365.0" y="668.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Garrafas</text></g><g class="cu" data-cu="CU-286" data-x="365" data-y="712"><ellipse cx="365.0" cy="712.4" rx="175" ry="25.6" fill="url(#vp)" stroke="#3C5F8F" stroke-width="1.0"/><text x="365.0" y="699.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-286</text><text x="365.0" y="712.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Consultar el Historial de Compras de un</text><text x="365.0" y="725.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Proveedor</text></g><g class="cu" data-cu="CU-287" data-x="365" data-y="763"><ellipse cx="365.0" cy="763.4" rx="175" ry="19.4" fill="url(#vp)" stroke="#3C5F8F" stroke-width="1.0"/><text x="365.0" y="756.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-287</text><text x="365.0" y="770.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Modificar una Orden de Compra</text></g><g class="cu" data-cu="CU-288" data-x="365" data-y="808"><ellipse cx="365.0" cy="808.2" rx="175" ry="19.4" fill="url(#vp)" stroke="#3C5F8F" stroke-width="1.0"/><text x="365.0" y="801.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-288</text><text x="365.0" y="814.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Enviar una Orden de Compra</text></g><g class="cu" data-cu="CU-250" data-x="903" data-y="335"><ellipse cx="903.0" cy="335.4" rx="165" ry="19.4" fill="#FFFFFF" stroke="#6B7683" stroke-width="1.0" stroke-dasharray="5 3"/><text x="903.0" y="328.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683" font-weight="bold">CU-250</text><text x="903.0" y="342.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">Aplicar un Movimiento de Stock (SS-08)</text></g><g class="actor" data-act="03" data-x="70" data-y="412"><circle cx="70.0" cy="412.1" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 421.1 V445.1 M55.0 429.1 H85.0 M70.0 445.1 L57.0 465.1 M70.0 445.1 L83.0 465.1" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="479.1" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Administrador</text><text x="70.0" y="492.3" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-03)</text></g><text x="150.0" y="867.6" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Tres columnas: el actor, los casos de uso que inicia y, a la derecha, los casos relacionados con ellos por «include» o «extend».</text><text x="150.0" y="883.6" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: del caso que extiende al caso base (línea discontinua, con su punto de extensión PE-n,</text><text x="150.0" y="897.6" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">que figura también en el compartimiento «puntos de extensión» del caso base).</text><text x="150.0" y="913.6" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Cada «include» y cada «extend» tiene su propio trazo, con el rótulo junto a su arranque. Con relleno rosado, los casos de uso planificados; con borde discontinuo, los casos de uso que no</text><text x="150.0" y="927.6" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">inicia el actor de este diagrama o que son de otro subsistema, solo como referencia.</text></svg>