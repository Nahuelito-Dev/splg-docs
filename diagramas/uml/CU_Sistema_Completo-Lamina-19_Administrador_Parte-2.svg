middle" dominant-baseline="central" fill="#000000">(ACT-03)</text></g><g class="leyenda"><text x="235.0" y="712.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: de la extensión al caso base (línea</text><text x="235.0" y="726.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">discontinua).</text><text x="235.0" y="742.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">ACT-05 especializa a ACT-03 (triángulo hueco); además, cada caso de uso lleva la asociación de todos los actores que el catálogo le asigna,</text><text x="235.0" y="756.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">también la de ACT-05.</text><text x="235.0" y="772.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Con relleno rosado, los casos de uso planificados.</text><text x="235.0" y="788.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Con borde discontinuo, los casos de uso de otro diagrama, solo como referencia.</text><text x="235.0" y="804.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-1 CU-168 extiende a CU-010: cuando el pedido cancelado tiene un pago aprobado por una pasarela</text></g></svg>