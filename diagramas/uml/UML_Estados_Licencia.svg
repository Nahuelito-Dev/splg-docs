encia()</text></g><!--link REQUESTED to REJECTED--><g class="link" data-entity-1="ent0001" data-entity-2="ent0003" id="lnk9" data-source-line="27" data-link-type="dependency"><path d="M442.859,292.766 C500.531,329.063 589.967,385.369 647.701,421.713" style="stroke:#2C4257;stroke-width:1.563;" fill="none" id="REQUESTED-to-REJECTED"/><polygon points="654.313,425.875,645.741,413.094,647.701,421.713,639.082,423.673,654.313,425.875" fill="#2C4257" style="stroke:#2C4257;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="577.813" y="355.063" fill="#000" font-size="18.75" textLength="209.454" font-family="Helvetica">rechazarLicencia(motivo)</text><text x="631.998" y="373.813" fill="#000" font-size="18.75" textLength="101.083" font-family="Helvetica">[hay motivo]</text></g><!--link REQUESTED to CANCELLED--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk10" data-source-line="28" data-link-type="dependency"><path d="M391.547,292.484 C383.469,367.906 363.177,557.045 355.083,632.513" style="stroke:#2C4257;stroke-width:1.563;" fill="none" id="REQUESTED-to-CANCELLED"/><polygon points="354.25,640.281,361.964,626.965,355.083,632.513,349.535,625.632,354.25,640.281" fill="#2C4257" style="stroke:#2C4257;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="378.094" y="462.875" fill="#000" font-size="18.75" textLength="152.151" font-family="Helvetica">cancelarLicencia()</text></g><!--link APPROVED to CANCELLED--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk11" data-source-line="29" data-link-type="dependency"><path d="M194.641,489.797 C188.703,514.703 184.688,550.063 199.453,576.563 C210.422,596.219 250.937,620.237 289.874,640.393" style="stroke:#2C4257;stroke-width:1.563;" fill="none" id="APPROVED-to-CANCELLED"/><polygon points="296.812,643.984,287.197,631.969,289.874,640.393,281.451,643.07,296.812,643.984" fill="#2C4257" style="stroke:#2C4257;stroke-width:1.563;stroke-linejoin:miter;stroke-mit