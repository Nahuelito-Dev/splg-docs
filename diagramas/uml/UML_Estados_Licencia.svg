<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1076px;height:871px;background:#FFFFFF;" width="1076.563px" height="871.875px" viewBox="0 0 1076 871" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="230.416" y="32.469" fill="#000" font-size="21.875" textLength="605.386" font-weight="700" font-family="Helvetica">Diagrama de estados — Licencia laboral (planificado, I-11)</text></g><rect x="339.016" y="229.688" width="111.508" height="62.5" fill="#F4F7FA" style="stroke:#2C4257;stroke-width:0.781;" rx="19.531" ry="19.531"/><text x="346.828" y="256.625" fill="#000" font-size="18.75" textLength="81.299" font-family="Helvetica">Solicitada</text><text x="346.828" y="275.375" fill="#000" font-size="18.75" textLength="95.883" font-family="Helvetica">(requested)</text><rect x="151" y="426.563" width="106.299" height="62.5" fill="#F4F7FA" style="stroke:#2C4257;stroke-width:0.781;" rx="19.531" ry="19.531"/><text x="158.813" y="453.5" fill="#000" font-size="18.75" textLength="81.317" font-family="Helvetica">Aprobada</text><text x="158.813" y="472.25" fill="#000" font-size="18.75" textLength="90.674" font-family="Helvetica">(approved)</text><rect x="647.344" y="426.563" width="110.483" height="62.5" fill="#F4F7FA" style="stroke:#2C4257;stroke-width:0.781;" rx="19.531" ry="19.531"/><text x="655.156" y="453.5" fill="#000" font-size="18.75" textLength="94.858" font-family="Helvetica">Rechazada</text><text x="655.156" y="472.25" fill="#000" font-size="18.75" textLength="79.193" font-family="Helvetica">(rejected)</text><rect x="297.359" y="640.625" width="107.333" height="62.5" fill="#F4F7FA" style="stroke:#2C4257;stroke-width:0.781;" rx="19.531" ry="19.531"/><text x="305.172" y="667.563" fill="#000" font-size="18.75" textLength="89.648" font-family