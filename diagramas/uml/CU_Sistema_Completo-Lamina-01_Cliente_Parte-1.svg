ddle" dominant-baseline="central" fill="#000000">Cambiar el Correo del Usuario</text></g><g class="cu" data-cu="CU-082" data-x="903" data-y="175"><ellipse cx="903.0" cy="174.8" rx="165" ry="19.4" fill="#FFFFFF" stroke="#6B7683" stroke-width="1.0" stroke-dasharray="5 3"/><text x="903.0" y="168.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683" font-weight="bold">CU-082</text><text x="903.0" y="181.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">Crear un Usuario Base (SS-01)</text></g><g class="cu" data-cu="CU-143" data-x="903" data-y="226"><ellipse cx="903.0" cy="225.8" rx="165" ry="25.6" fill="#FFFFFF" stroke="#6B7683" stroke-width="1.0" stroke-dasharray="5 3"/><text x="903.0" y="212.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683" font-weight="bold">CU-143</text><text x="903.0" y="225.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">Declarar el Consumo Promedio al</text><text x="903.0" y="239.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">Registrarse (SS-02)</text></g><g class="actor" data-act="01" data-x="70" data-y="211"><circle cx="70.0" cy="211.3" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 220.3 V244.3 M55.0 228.3 H85.0 M70.0 244.3 L57.0 264.3 M70.0 244.3 L83.0 264.3" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="278.3" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Cliente</text><text x="70.0" y="291.5" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-01)</text></g><text x="150.0" y="432.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Tres columnas: el actor, los casos de uso que inicia y, a la derecha, los casos relacionados con ellos por «include» o «extend».</text><text x="150.0" y="448.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: del caso que extiende al caso base (línea discontinua, con su punto de extensión PE-n,</text><text x="150.0" y="462.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">que figura también en el compartimiento «puntos de extensión» del caso base).</text><text x="150.0" y="478.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Cada «include» y cada «extend» tiene su propio trazo, con el rótulo junto a su arranque. Con relleno rosado, los casos de uso planificados; con borde discontinuo, los casos de uso que no</text><text x="150.0" y="492.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">inicia el actor de este diagrama o que son de otro subsistema, solo como referencia.</text><text x="150.0" y="508.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-01 CU-143 extiende a CU-002: cuando el cliente declara cuánto gas consume por mes</text></svg>