source-line="27"><ellipse cx="142.297" cy="625.781" rx="17.188" ry="17.188" fill="none" style="stroke:#222;stroke-width:1.563;"/><ellipse cx="142.297" cy="625.781" rx="9.375" ry="9.375" fill="#222" style="stroke:#222;stroke-width:1.563;"/></g><g class="entity" data-qualified-name="GMN12" id="ent0013" data-source-line="31"><path d="M222.75,546.875 L222.75,704.688 A0,0 0 0 0 222.75,704.688 L755.599,704.688 A0,0 0 0 0 755.599,704.688 L755.599,562.5 L739.974,546.875 L495.422,546.875 L489.172,452.172 L482.922,546.875 L222.75,546.875 A0,0 0 0 0 222.75,546.875" style="stroke:#7A7340;stroke-width:0.781;" fill="#FBF7E6"/><path d="M739.974,546.875 L739.974,562.5 L755.599,562.5 L739.974,546.875" style="stroke:#7A7340;stroke-width:0.781;" fill="#FBF7E6"/><text x="232.125" y="570.329" fill="#000" font-size="20.313" textLength="500.037" font-family="Helvetica">FORECAST, IN_PROGRESS y OVERDUE son valores</text><text x="232.125" y="590.641" fill="#000" font-size="20.313" textLength="399.803" font-family="Helvetica">del tipo declarado en la entidad que ninguna</text><text x="232.125" y="610.954" fill="#000" font-size="20.313" textLength="448.214" font-family="Helvetica">operación asigna hoy. FORECAST es el valor por</text><text x="232.125" y="631.266" fill="#000" font-size="20.313" textLength="471.988" font-family="Helvetica">defecto de la columna. El vencimiento no se guarda:</text><text x="232.125" y="651.579" fill="#000" font-size="20.313" textLength="433.575" font-family="Helvetica">se calcula de la fecha límite y del plazo de aviso</text><text x="232.125" y="671.891" fill="#000" font-size="20.313" textLength="428.001" font-family="Helvetica">del plan, y una tarea abierta vencida de un plan</text><text x="232.125" y="692.204" fill="#000" font-size="20.313" textLength="395.241" font-family="Helvetica">bloqueante inhabilita al vehículo o al chofer.</text></g><!--link *start* to SCHEDULED--><g class="link" data-entity-1="ent0004" data-entity-2="ent0001" id="lnk5" data-source-line="