al" fill="#000000">Administrador</text><text x="70.0" y="640.9" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">General</text><text x="70.0" y="654.1" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-05)</text></g><text x="150.0" y="1141.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Tres columnas: el actor, los casos de uso que inicia y, a la derecha, los casos relacionados con ellos por «include» o «extend».</text><text x="150.0" y="1157.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: del caso que extiende al caso base (línea discontinua, con su punto de extensión</text><text x="150.0" y="1171.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-n, que figura también en el compartimiento «puntos de extensión» del caso base).</text><text x="150.0" y="1187.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Cada «include» y cada «extend» tiene su propio trazo, con el rótulo junto a su arranque. Con relleno rosado, los casos de uso planificados; con borde discontinuo, los casos de uso que no</text><text x="150.0" y="1201.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">inicia el actor de este diagrama o que son de otro subsistema, solo como referencia.</text></svg>