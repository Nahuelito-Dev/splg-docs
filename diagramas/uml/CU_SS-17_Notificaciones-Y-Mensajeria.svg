162.4" fill="none" stroke="#1F3A5F" stroke-width="0.7" opacity="0.9"/><path class="asoc" data-act="05" data-cu="CU-102" data-rol="principal" d="M85.0 381.9 L190.0 213.4" fill="none" stroke="#1F3A5F" stroke-width="0.7" opacity="0.9"/><g class="cu" data-cu="CU-100" data-x="365" data-y="111"><ellipse cx="365.0" cy="111.4" rx="175" ry="19.4" fill="url(#vp)" stroke="#3C5F8F" stroke-width="1.0"/><text x="365.0" y="104.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-100</text><text x="365.0" y="118.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Enviar una Notificación de Prueba</text></g><g class="cu" data-cu="CU-101" data-x="365" data-y="162"><ellipse cx="365.0" cy="162.4" rx="175" ry="25.6" fill="url(#vp)" stroke="#3C5F8F" stroke-width="1.0"/><text x="365.0" y="149.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-101</text><text x="365.0" y="162.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Reenviar la Notificación de Confirmación</text><text x="365.0" y="175.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">de Pedido</text></g><g class="cu" data-cu="CU-102" data-x="365" data-y="213"><ellipse cx="365.0" cy="213.4" rx="175" ry="19.4" fill="url(#vp)" stroke="#3C5F8F" stroke-width="1.0"/><text x="365.0" y="206.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-102</text><text x="365.0" y="220.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Probar el Servicio de Correo</text></g><g class="actor" data-act="07" data-x="70" data-y="97"><circle cx="70.0" cy="96.9" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 105.9 V129.9 M55.0 113.9 H85.0 M70.0 129.9 L57.0 149.9 M70.0 129.9 L83.0 149.9" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="163.9" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">«sistema externo»</text><text x="70.0" y="177.1" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Firebase</text><text x="70.0" y="190.3" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-07)</text></g><g class="actor" data-act="08" data-x="70" data-y="231"><circle cx="70.0" cy="230.9" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 239.9 V263.9 M55.0 247.9 H85.0 M70.0 263.9 L57.0 283.9 M70.0 263.9 L83.0 283.9" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="297.9" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">«sistema externo»</text><text x="70.0" y="311.1" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Servicio de correo</text><text x="70.0" y="324.3" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-08)</text></g><g class="actor" data-act="05" data-x="70" data-y="365"><circle cx="70.0" cy="364.9" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 373.9 V397.9 M55.0 381.9 H85.0 M70.0 397.9 L57.0 417.9 M70.0 397.9 L83.0 417.9" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="431.9" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Administrador</text><text x="70.0" y="445.1" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">General</text><text x="70.0" y="458.3" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-05)</text></g><text x="150.0" y="532.9" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Tres columnas: el actor, los casos de uso que inicia y, a la derecha, los casos relacionados con ellos por «include» o «extend».</text><text x="150.0" y="548.9" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: del caso que extiende al caso base (línea discontinua, con su punto de extensión</text><text x="150.0" y="562.9" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-n, que figura también en el compartimiento «puntos de extensión» del caso base).</text><text x="150.0" y="578.9" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Cada «include» y cada «extend» tiene su propio trazo, con el rótulo junto a su arranque. Con relleno rosado, los casos de uso planificados; con borde discontinuo, los casos de uso que no</text><text x="150.0" y="592.9" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">inicia el actor de este diagrama o que son de otro subsistema, solo como referencia.</text></svg>