<svg xmlns="http://www.w3.org/2000/svg" width="1174" height="344" viewBox="0 0 1174 344" font-family="Arial, Helvetica, sans-serif"><defs><marker id="abre" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#1F3A5F" stroke-width="1"/></marker><marker id="hueco" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1"/></marker><linearGradient id="vp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCE6F2"/><stop offset="1" stop-color="#C6DAF0"/></linearGradient></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="587.0" y="22.0" font-size="14" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">Diagrama de casos de uso — Operador Técnico (ACT-10) · 1 casos de uso</text><rect class="limite" data-x="150" data-y="44" data-w="988" data-h="182" x="150" y="44" width="988" height="182" fill="#FFFFFF" stroke="#3C5F8F" stroke-width="1.0"/><text x="644.0" y="62.0" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">Sistema de Pedidos y Logística de Garrafas de Gas (SPLG)</text><path class="asoc" data-act="10" data-cu="CU-087" data-rol="principal" d="M85.0 97.0 L190.0 111.4" fill="none" stroke="#1F3A5F" stroke-width="0.7" opacity="0.9"/><path class="rel" data-tipo="include" data-desde="CU-087" data-hasta="CU-082" d="M540.0 111.4 H640.0 V111.4 H724.0" fill="none" stroke="#1F3A5F" stroke-width="0.8" stroke-dasharray="6 3" marker-end="url(#abre)"/><g class="etiqueta" data-tipo="include" data-desde="CU-087" data-hasta="CU-082"><text x="546.0" y="105.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">«include»</text></g><g class="cu" data-cu="CU-087" data-x="365" data-y="111"><ellipse cx="365.0" cy="111.4" rx="175" ry="19.4" fill="url(#vp)" stroke="#3C5F8F" stroke-width="1.0"/><text x="365.0" y="104.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-087</text><text x="365.0" y="118.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Crear el Primer Administrador General</text></g><g class="cu" data-cu="CU-082" data-x="889" data-y="111"><ellipse cx="889.0" cy="111.4" rx="165" ry="19.4" fill="#FFFFFF" stroke="#6B7683" stroke-width="1.0" stroke-dasharray="5 3"/><text x="889.0" y="104.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683" font-weight="bold">CU-082</text><text x="889.0" y="118.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">Crear un Usuario Base (SS-01)</text></g><g class="actor" data-act="10" data-x="70" data-y="80"><circle cx="70.0" cy="80.0" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 89.0 V113.0 M55.0 97.0 H85.0 M70.0 113.0 L57.0 133.0 M70.0 113.0 L83.0 133.0" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="147.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Operador Técnico</text><text x="70.0" y="160.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-10)</text></g><text x="150.0" y="248.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Tres columnas: el actor, los casos de uso que inicia y, a la derecha, los casos relacionados con ellos por «include» o «extend».</text><text x="150.0" y="264.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: del caso que extiende al caso base (línea discontinua, con su punto de extensión</text><text x="150.0" y="278.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-n, que figura también en el compartimiento «puntos de extensión» del caso base).</text><text x="150.0" y="294.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Cada «include» y cada «extend» tiene su propio trazo, con el rótulo junto a su arranque. Con relleno rosado, los casos de uso planificados; con borde discontinuo, los casos de uso que no</text><text x="150.0" y="308.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">inicia el actor de este diagrama o que son de otro subsistema, solo como referencia.</text></svg>