0 626.5 H85.0 M70.0 642.5 L57.0 662.5 M70.0 642.5 L83.0 662.5" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="676.5" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Chofer</text><text x="70.0" y="689.7" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-02)</text></g><g class="actor" data-act="06" data-x="70" data-y="744"><circle cx="70.0" cy="743.5" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 752.5 V776.5 M55.0 760.5 H85.0 M70.0 776.5 L57.0 796.5 M70.0 776.5 L83.0 796.5" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="810.5" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">«sistema externo»</text><text x="70.0" y="823.7" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">MercadoPago</text><text x="70.0" y="836.9" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-06)</text></g><g class="actor" data-act="07" data-x="70" data-y="878"><circle cx="70.0" cy="877.5" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 886.5 V910.5 M55.0 894.5 H85.0 M70.0 910.5 L57.0 930.5 M70.0 910.5 L83.0 930.5" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="944.5" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">«sistema externo»</text><text x="70.0" y="957.7" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Firebase</text><text x="70.0" y="970.9" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-07)</text></g><g class="actor" data-act="04" data-x="70" data-y="1012"><circle cx="70.0" cy="1011.5" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 1020.5 V1044.5 M55.0 1028.5 H85.0 M70.0 1044.5 L57.0 1064.5 M70.0 1044.5 L83.0 1064.5" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="1078.5" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Sistema Automático</text><text x="70.0" y="1091.7" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-04)</text></g><path class="gen" data-esp="05" data-gen="03" d="M70 331.5 V233.5" fill="none" stroke="#1F3A5F" stroke-width="1" marker-end="url(#hueco)"/><text x="150.0" y="1179.5" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Tres columnas: el actor, los casos de uso que inicia y, a la derecha, los casos relacionados con ellos por «include» o «extend».</text><text x="150.0" y="1195.5" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: del caso que extiende al caso base (línea discontinua, con su punto de extensión PE-n,</text><text x="150.0" y="1209.5" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">que figura también en el compartimiento «puntos de extensión» del caso base).</text><text x="150.0" y="1225.5" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Cada «include» y cada «extend» tiene su propio trazo, con el rótulo junto a su arranque. Con relleno rosado, los casos de uso planificados; con borde discontinuo, los casos de uso que no</text><text x="150.0" y="1239.5" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">inicia el actor de este diagrama o que son de otro subsistema, solo como referencia.</text></svg>