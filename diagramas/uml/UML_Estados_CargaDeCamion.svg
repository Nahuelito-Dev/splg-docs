<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1465px;height:1217px;background:#FFFFFF;" width="1465.625px" height="1217.188px" viewBox="0 0 1465 1217" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="512.392" y="32.469" fill="#000" font-size="21.875" textLength="430.354" font-weight="700" font-family="Helvetica">Diagrama de estados — Carga de camión</text></g><g class="entity" data-qualified-name="loading" id="ent0001" data-source-line="19"><rect x="969.672" y="210.938" width="252.176" height="87.5" fill="#F4F7FA" style="stroke:#2C4257;stroke-width:0.781;" rx="19.531" ry="19.531"/><line x1="969.672" y1="264.063" x2="1221.848" y2="264.063" style="stroke:#2C4257;stroke-width:0.781;"/><text x="1054.584" y="233.188" fill="#000" font-size="18.75" textLength="82.352" font-family="Helvetica">Cargando</text><text x="1054.584" y="251.938" fill="#000" font-size="18.75" textLength="72.958" font-family="Helvetica">(loading)</text><text x="977.484" y="286.313" fill="#000" font-size="18.75" textLength="220.926" font-family="Helvetica">reponerCargaDelCamion()</text></g><g class="entity" data-qualified-name="route" id="ent0002" data-source-line="20"><rect x="707.594" y="414.063" width="445.059" height="106.25" fill="#F4F7FA" style="stroke:#2C4257;stroke-width:0.781;" rx="19.531" ry="19.531"/><line x1="707.594" y1="467.188" x2="1152.653" y2="467.188" style="stroke:#2C4257;stroke-width:0.781;"/><text x="886.869" y="436.313" fill="#000" font-size="18.75" textLength="60.452" font-family="Helvetica">En ruta</text><text x="886.869" y="455.063" fill="#000" font-size="18.75" textLength="86.508" font-family="Helvetica">(on_route)</text><text x="715.406" y="489.438" fill="#000" font-size="18.75" textLength="220.926" font-family="Helvetica">reponerCargaDelCamion()</text><text x="715.406" y="508.188" fill="#000" font-size="18.75" textLength="413.809" font-family="Helvetica">pedido entregado / descontarStockDeLaEntrega()</text></g><g class="entity" data-qualified-name="returned" id="ent0003" data-source-line="21"><rect x="584.172" y="676.563" width="498.16" height="106.25" fill="#F4F7FA" style="stroke:#2C4257;stroke-width:0.781;" rx="19.531" ry="19.531"/><line x1="584.172" y1="729.688" x2="1082.332" y2="729.688" style="stroke:#2C4257;stroke-width:0.781;"/><text x="792.09" y="698.813" fill="#000" font-size="18.75" textLength="70.871" font-family="Helvetica">Regresó</text><text x="792.09" y="717.563" fill="#000" font-size="18.75" textLength="82.324" font-family="Helvetica">(returned)</text><text x="591.984" y="751.938" fill="#000" font-size="18.75" textLength="145.963" font-family="Helvetica">pedido entregado</text><text x="591.984" y="770.688" fill="#000" font-size="18.75" textLength="466.91" font-family="Helvetica">/ descontarStockDeLaEntrega() y recalcular lo esperado</text></g><rect x="791.578" y="898.438" width="83.365" height="62.5" fill="#F4F7FA" style="stroke:#2C4257;stroke-width:0.781;" rx="19.531" ry="19.531"/><text x="799.391" y="925.375" fill="#000" font-size="18.75" textLength="67.74" font-family="Helvetica">Cerrada</text><text x="799.391" y="944.125" fill="#000" font-size="18.75" textLength="66.687" font-family="Helvetica">(closed)</text><rect x="275.391" y="898.438" width="218.854" height="62.5" fill="#F4F7FA" style="stroke:#2C4257;stroke-width:0.781;" rx="19.531" ry="19.531"/><text x="283.203" y="925.375" fill="#000" font-size="18.75" textLength="189.688" font-family="Helvetica">Cerrada con diferencia</text><text x="283.203" y="944.125" fill="#000" font-size="18.75" textLength="203.229" font-family="Helvetica">(closed_with_difference)</text><rect x="1231.156" y="567.188" width="107.333" height="62.5" fill="#F4F7FA" style="stroke:#2C4257;stroke-width:0.781;" rx="19.531" ry="19.531"/><text x="1238.969" y="594.125" fill="#000" font-size="18.75" textLength="89.648" font-family="Helvetica">Cancelada</text><text x="1238.969" y="612.875" fill="#000" font-size="18.75" textLength="91.708" font-family="Helvetica">(cancelled)</text><g class="start_entity" data-qualified-name=".start." id="ent0007" data-source-line="26"><ellipse cx="1095.75" cy="79.688" rx="15.625" ry="15.625" fill="#222" style="stroke:#222;stroke-width:1.563;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0014" data-source-line="36"><ellipse cx="833.25" cy="1125" rx="17.188" ry="17.188" fill="none" style="stroke:#222;stroke-width:1.563;"/><ellipse cx="833.25" cy="1125" rx="9.375" ry="9.375" fill="#222" style="stroke:#222;stroke-width:1.563;"/></g><g class="entity" data-qualified-name="GMN18" id="ent0019" data-source-line="41"><path d="M9.375,1056.25 L9.375,1193.75 A0,0 0 0 0 9.375,1193.75 L760.256,1193.75 A0,0 0 0 0 760.256,1193.75 L760.256,1071.875 L744.631,1056.25 L391.063,1056.25 L384.813,961.703 L378.563,1056.25 L9.375,1056.25 A0,0 0 0 0 9.375,1056.25" style="stroke:#7A7340;stroke-width:0.781;" fill="#FBF7E6"/><path d="M744.631,1056.25 L744.631,1071.875 L760.256,1071.875 L744.631,1056.25" style="stroke:#7A7340;stroke-width:0.781;" fill="#FBF7E6"/><text x="18.75" y="1079.704" fill="#000" font-size="20.313" textLength="515.995" font-family="Helvetica">Al cerrar, el saldo del camión queda en cero. Un vehículo</text><text x="18.75" y="1100.016" fill="#000" font-size="20.313" textLength="469.756" font-family="Helvetica">y un chofer tienen una sola carga abierta: cargando,</text><text x="18.75" y="1120.329" fill="#000" font-size="20.313" textLength="495.722" font-family="Helvetica">en ruta o regresó: una entrega confirmada después del</text><text x="18.75" y="1140.641" fill="#000" font-size="20.313" textLength="511.482" font-family="Helvetica">regreso se imputa a la carga hasta el cierre; después del</text><text x="18.75" y="1160.954" fill="#000" font-size="20.313" textLength="718.069" font-family="Helvetica">cierre la diferencia se corrige con un ajuste. El ajuste de stock y la transferencia</text><text x="18.75" y="1181.266" fill="#000" font-size="20.313" textLength="474.21" font-family="Helvetica">no tienen ciclo de vida: son movimientos inmediatos.</text></g><!--link *start* to loading--><g class="link" data-entity-1="ent0007" data-entity-2="ent0001" id="lnk8" data-source-line="26" data-link-type="dependency"><path d="M1095.75,95.906 C1095.75,121.063 1095.75,165.578 1095.75,202.953" style="stroke:#2C4257;stroke-width:1.563;" fill="none" id="*start*-to-loading"/><polygon points="1095.75,210.766,1102,196.703,1095.75,202.953,1089.5,196.703,1095.75,210.766" fill="#2C4257" style="stroke:#2C4257;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1097.313" y="158.188" fill="#000" font-size="18.75" textLength="225.064" font-family="Helvetica">registrarCargaDelCamion()</text></g><!--link loading to cancelled--><g class="link" data-entity-1="ent0001" data-entity-2="ent0006" id="lnk9" data-source-line="28" data-link-type="dependency"><path d="M1156.188,299.141 C1171.766,312.5 1187.359,328.25 1198.875,345.313 C1246.906,416.453 1269.076,509.337 1278.389,559.009" style="stroke:#2C4257;stroke-width:1.563;" fill="none" id="loading-to-cancelled"/><polygon points="1279.828,566.688,1283.38,551.714,1278.389,559.009,1271.094,554.017,1279.828,566.688" fill="#2C4257" style="stroke:#2C4257;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1213.906" y="361.313" fill="#000" font-size="18.75" textLength="227.17" font-family="Helvetica">cancelarCargaDelCamion()</text></g><!--link loading to route--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk10" data-source-line="29" data-link-type="dependency"><path d="M1013.937,298.875 C995.516,311.688 977.578,327.25 964.5,345.313 C950.109,365.203 943.387,383.333 938.497,405.927" style="stroke:#2C4257;stroke-width:1.563;" fill="none" id="loading-to-route"/><polygon point