ext x="799.391" y="831.625" fill="#000" font-size="18.75" textLength="66.687" font-family="Helvetica">(closed)</text><rect x="275.391" y="785.938" width="218.854" height="62.5" fill="#F4F7FA" style="stroke:#2C4257;stroke-width:0.781;" rx="19.531" ry="19.531"/><text x="283.203" y="812.875" fill="#000" font-size="18.75" textLength="189.688" font-family="Helvetica">Cerrada con diferencia</text><text x="283.203" y="831.625" fill="#000" font-size="18.75" textLength="203.229" font-family="Helvetica">(closed_with_difference)</text><rect x="1279.594" y="498.438" width="107.333" height="62.5" fill="#F4F7FA" style="stroke:#2C4257;stroke-width:0.781;" rx="19.531" ry="19.531"/><text x="1287.406" y="525.375" fill="#000" font-size="18.75" textLength="89.648" font-family="Helvetica">Cancelada</text><text x="1287.406" y="544.125" fill="#000" font-size="18.75" textLength="91.708" font-family="Helvetica">(cancelled)</text><g class="start_entity" data-qualified-name=".start." id="ent0007" data-source-line="26"><ellipse cx="903.563" cy="79.688" rx="15.625" ry="15.625" fill="#222" style="stroke:#222;stroke-width:1.563;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0018" data-source-line="36"><ellipse cx="833.25" cy="1012.5" rx="17.188" ry="17.188" fill="none" style="stroke:#222;stroke-width:1.563;"/><ellipse cx="833.25" cy="1012.5" rx="9.375" ry="9.375" fill="#222" style="stroke:#222;stroke-width:1.563;"/></g><g class="entity" data-qualified-name="GMN22" id="ent0023" data-source-line="41"><path d="M9.375,943.75 L9.375,1081.25 A0,0 0 0 0 9.375,1081.25 L760.256,1081.25 A0,0 0 0 0 760.256,1081.25 L760.256,959.375 L744.631,943.75 L391.063,943.75 L384.813,849.203 L378.563,943.75 L9.375,943.75 A0,0 0 0 0 9.375,943.75" style="stroke:#7A7340;stroke-width:0.781;" fill="#FBF7E6"/><path d="M744.631,943.75 L744.631,959.375 L760.256,959.375 L744.631,943.75" style="stroke:#7A7340;stroke-width:0.781;" fill="#FBF7E6"/><text x="18.75" y="967.204" fill="#000" font-size="20.313" textLength="515.995" font-family="Helvetica">Al cerrar, el saldo del camión queda en cero. Un vehículo</text><text x="18.75" y="987.516" fill="#000" font-size="20.313" textLength="469.756" font-family="Helvetica">y un chofer tienen una sola carga abierta: cargando,</text><text x="18.75" y="1007.829" fill="#000" font-size="20.313" textLength="495.722" font-family="Helvetica">en ruta o regresó: una entrega confirmada después del</text><text x="18.75" y="1028.141" fill="#000" font-size="20.313" textLength="511.482" font-family="Helvetica">regreso se imputa a la carga hasta el cierre; después del</text><text x="18.75" y="1048.454" fill="#000" font-size="20.313" textLength="718.069" font-family="Helvetica">cierre la diferencia se corrige con un ajuste. El ajuste de stock y la transferencia</text><text x="18.75" y="1068.766" fill="#000" font-size="20.313" textLength="474.21" font-family="Helvetica">no tienen ciclo de vida: son movimientos inmediatos.</text></g><!--link *start* to loading--><g class="link" data-entity-1="ent0007" data-entity-2="ent0001" id="lnk8" data-source-line="26" data-link-type="dependency"><path d="M903.563,95.953 C903.563,121.844 903.563,168.25 903.563,202.453" style="stroke:#2C4257;stroke-width:1.563;" fill="none" id="*start*-to-loading"/><polygon points="903.563,210.266,909.813,196.203,903.563,202.453,897.313,196.203,903.563,210.266" fill="#2C4257" style="stroke:#2C4257;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="905.125" y="158.188" fill="#000" font-size="18.75" textLength="225.064" font-family="Helvetica">registrarCargaDelCamion()</text></g><!--link loading to loading--><g class="link" data-entity-1="ent0001" data-entity-2="ent0001" id="lnk9" data-source-line="27" data-link-type="dependency"><path d="M953.172,226.344 C981.25,223.25 1007.234,228.531 1007.234,242.188 C1007.234,255.844 989.016,261.981 960.937,258.887" style="stroke:#2C4257;stroke-width:1.563;" fill="none" id="loading-to-loading"/><polygon points="953.172,258.03