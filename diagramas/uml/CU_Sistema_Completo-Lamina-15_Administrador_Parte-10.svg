" fill="#000000">Reingresar a un Empleado</text></g><g class="cu" data-cu="CU-031" data-x="889" data-y="200"><ellipse cx="889.0" cy="200.0" rx="165" ry="44.2" fill="#FFFFFF" stroke="#6B7683" stroke-width="1.0" stroke-dasharray="5 3"/><text x="889.0" y="167.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683" font-weight="bold">CU-031</text><text x="889.0" y="180.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">Registrar un Chofer (Gestión de la</text><text x="889.0" y="193.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">Flota) (SS-07)</text><path class="compartimiento" d="M725.8 206.6 H1052.2" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="889.0" y="219.8" font-size="10" text-anchor="middle" dominant-baseline="central" fill="#6B7683">puntos de extensión</text><text x="889.0" y="233.0" font-size="10" text-anchor="middle" dominant-baseline="central" fill="#6B7683" font-weight="bold">PE-07</text></g><g class="cu" data-cu="CU-188" data-x="889" data-y="276"><ellipse cx="889.0" cy="275.8" rx="165" ry="25.6" fill="#FFFFFF" stroke="#6B7683" stroke-width="1.0" stroke-dasharray="5 3"/><text x="889.0" y="262.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683" font-weight="bold">CU-188</text><text x="889.0" y="275.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">Avisar los Vencimientos Próximos del</text><text x="889.0" y="289.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">Personal (SS-19)</text></g><g class="actor" data-act="03" data-x="70" data-y="570"><circle cx="70.0" cy="570.0" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 579.0 V603.0 M55.0 587.0 H85.0 M70.0 603.0 L57.0 623.0 M70.0 603.0 L83.0 623.0" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="637.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Administrador</text><text x="70.0" y="650.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-03)</text></g><text x="150.0" y="1161.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Tres columnas: el actor, los casos de uso que inicia y, a la derecha, los casos relacionados con ellos por «include» o «extend».</text><text x="150.0" y="1177.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: del caso que extiende al caso base (línea discontinua, con su punto de extensión</text><text x="150.0" y="1191.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-n, que figura también en el compartimiento «puntos de extensión» del caso base).</text><text x="150.0" y="1207.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Cada «include» y cada «extend» tiene su propio trazo, con el rótulo junto a su arranque. Con relleno rosado, los casos de uso planificados; con borde discontinuo, los casos de uso que no</text><text x="150.0" y="1221.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">inicia el actor de este diagrama o que son de otro subsistema, solo como referencia.</text><text x="150.0" y="1237.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-07 CU-177 extiende a CU-031: cuando el chofer que se registra todavía no tiene legajo</text></svg>