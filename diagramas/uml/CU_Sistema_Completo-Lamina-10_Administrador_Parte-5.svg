casos de uso planificados; con borde discontinuo, los casos de uso que no</text><text x="150.0" y="723.6" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">inicia el actor de este diagrama o que son de otro subsistema, solo como referencia.</text></svg>