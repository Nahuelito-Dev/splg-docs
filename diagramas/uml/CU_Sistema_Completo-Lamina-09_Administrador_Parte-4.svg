llipse cx="365.0" cy="1139.0" rx="175" ry="19.4" fill="url(#vp)" stroke="#3C5F8F" stroke-width="1.0"/><text x="365.0" y="1132.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-247</text><text x="365.0" y="1145.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Reactivar un Vehículo</text></g><g class="cu" data-cu="CU-159" data-x="889" data-y="111"><ellipse cx="889.0" cy="111.4" rx="165" ry="19.4" fill="#FFFFFF" stroke="#6B7683" stroke-width="1.0" stroke-dasharray="5 3"/><text x="889.0" y="104.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683" font-weight="bold">CU-159</text><text x="889.0" y="118.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">Almacenar un Archivo (SS-07)</text></g><g class="cu" data-cu="CU-160" data-x="889" data-y="213"><ellipse cx="889.0" cy="213.4" rx="165" ry="19.4" fill="#FFFFFF" stroke="#6B7683" stroke-width="1.0" stroke-dasharray="5 3"/><text x="889.0" y="206.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683" font-weight="bold">CU-160</text><text x="889.0" y="220.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">Recuperar un Archivo (SS-07)</text></g><g class="actor" data-act="03" data-x="70" data-y="592"><circle cx="70.0" cy="592.2" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 601.2 V625.2 M55.0 609.2 H85.0 M70.0 625.2 L57.0 645.2 M70.0 625.2 L83.0 645.2" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="659.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Administrador</text><text x="70.0" y="672.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-03)</text></g><text x="150.0" y="1198.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Tres columnas: el actor, los casos de uso que inicia y, a la derecha, los casos relacionados con ellos por «include» o «extend».</text><text x="150.0" y="1214.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: del caso que extiende al caso base (línea discontinua, con su punto de extensión</text><text x="150.0" y="1228.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-n, que figura también en el compartimiento «puntos de extensión» del caso base).</text><text x="150.0" y="1244.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Cada «include» y cada «extend» tiene su propio trazo, con el rótulo junto a su arranque. Con relleno rosado, los casos de uso planificados; con borde discontinuo, los casos de uso que no</text><text x="150.0" y="1258.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">inicia el actor de este diagrama o que son de otro subsistema, solo como referencia.</text></svg>