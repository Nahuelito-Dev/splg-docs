82.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">Cancelar un Pedido (Cliente)</text><text x="821.0" y="495.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">(SS-02)</text></g><g class="cu" data-cu="CU-010" data-x="821" data-y="545"><ellipse cx="821.0" cy="544.8" rx="140" ry="26.6" fill="#FFFFFF" stroke="#6B7683" stroke-width="1.0" stroke-dasharray="5 3"/><text x="821.0" y="531.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683" font-weight="bold">CU-010</text><text x="821.0" y="544.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">Cancelar un Pedido</text><text x="821.0" y="558.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">(Administrador) (SS-02)</text></g><g class="cu" data-cu="CU-149" data-x="821" data-y="607"><ellipse cx="821.0" cy="607.0" rx="140" ry="26.6" fill="#FFFFFF" stroke="#6B7683" stroke-width="1.0" stroke-dasharray="5 3"/><text x="821.0" y="593.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683" font-weight="bold">CU-149</text><text x="821.0" y="607.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">Despachar un Pedido Express</text><text x="821.0" y="620.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">a un Chofer en Moto (SS-03)</text></g><g class="actor" data-act="02" data-x="85" data-y="175"><circle cx="85.0" cy="174.6" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M85.0 183.6 V207.6 M70.0 191.6 H100.0 M85.0 207.6 L72.0 227.6 M85.0 207.6 L98.0 227.6" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="85.0" y="241.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Chofer</text><text x="85.0" y="254.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-02)</text></g><g class="actor" data-act="03" data-x="8