000">(ACT-05)</text></g><g class="actor" data-act="04" data-x="70" data-y="697"><circle cx="70.0" cy="697.0" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 706.0 V730.0 M55.0 714.0 H85.0 M70.0 730.0 L57.0 750.0 M70.0 730.0 L83.0 750.0" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="764.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Sistema Automático</text><text x="70.0" y="777.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-04)</text></g><g class="actor" data-act="06" data-x="70" data-y="831"><circle cx="70.0" cy="831.0" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 840.0 V864.0 M55.0 848.0 H85.0 M70.0 864.0 L57.0 884.0 M70.0 864.0 L83.0 884.0" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="898.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">«sistema externo»</text><text x="70.0" y="911.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">MercadoPago</text><text x="70.0" y="924.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-06)</text></g><path class="gen" data-esp="05" data-gen="03" d="M70 553.0 V455.0" fill="none" stroke="#1F3A5F" stroke-width="1" marker-end="url(#hueco)"/><text x="150.0" y="999.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Tres columnas: el actor, los casos de uso que inicia y, a la derecha, los casos relacionados con ellos por «include» o «extend».</text><text x="150.0" y="1015.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: del caso que extiende al caso base (línea discontinua, con su punto de extensión PE-n,</text><text x="150.0" y="1029.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">que figura también en el compartimiento «puntos de extensión» del caso base).</text><text x="150.0" y="1045.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Cada «include» y cada «extend» tiene su propio trazo, con el rótulo junto a su arranque. Con relleno rosado, los casos de uso planificados; con borde discontinuo, los casos de uso que no inicia</text><text x="150.0" y="1059.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">el actor de este diagrama o que son de otro subsistema, solo como referencia.</text><text x="150.0" y="1075.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-04 CU-168 extiende a CU-008: cuando el pedido cancelado tiene un pago aprobado por una pasarela</text><text x="150.0" y="1091.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-05 CU-168 extiende a CU-010: cuando el pedido cancelado tiene un pago aprobado por una pasarela</text><text x="150.0" y="1107.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-10 CU-168 extiende a CU-149: cuando el pedido express pasa a reparto común y ya estaba pagado en linea</text></svg>