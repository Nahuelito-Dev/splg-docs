 font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">«sistema externo»</text><text x="85.0" y="888.3" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">MercadoPago</text><text x="85.0" y="901.5" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-06)</text></g><path class="gen" data-esp="05" data-gen="03" d="M85 558.1 V475.1" fill="none" stroke="#1F3A5F" stroke-width="1" marker-end="url(#hueco)"/><g class="leyenda"><text x="235.0" y="950.1" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: de la extensión al caso base (línea</text><text x="235.0" y="964.1" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">discontinua).</text><text x="235.0" y="980.1" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">ACT-05 especializa a ACT-03 (triángulo hueco); además, cada caso de uso lleva la asociación de todos los actores que el catálogo le asigna,</text><text x="235.0" y="994.1" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">también la de ACT-05.</text><text x="235.0" y="1010.1" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Con relleno rosado, los casos de uso planificados.</text><text x="235.0" y="1026.1" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Con borde discontinuo, los casos de uso de otro diagrama, solo como referencia.</text><text x="235.0" y="1042.1" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-1 CU-168 extiende a CU-008: cuando el pedido cancelado tiene un pago aprobado por una pasarela</text><text x="235.0" y="1057.1" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-2 CU-168 extiende a CU-010: cuando el pedido cancelado tiene un pago aprobado por una pasarela</text><text x="235.0" y="1072.1" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-3 CU-168 extiende a CU-149: cuando el pedido express pasa a reparto común y ya estaba pagado en linea</text></g></svg>