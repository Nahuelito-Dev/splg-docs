" dominant-baseline="central" fill="#6B7683">puntos de extensión</text><text x="917.0" y="321.2" font-size="10" text-anchor="middle" dominant-baseline="central" fill="#6B7683" font-weight="bold">PE-05</text></g><g class="cu" data-cu="CU-149" data-x="917" data-y="383"><ellipse cx="917.0" cy="382.6" rx="165" ry="44.2" fill="#FFFFFF" stroke="#6B7683" stroke-width="1.0" stroke-dasharray="5 3"/><text x="917.0" y="349.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683" font-weight="bold">CU-149</text><text x="917.0" y="362.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">Despachar un Pedido Express a un Chofer</text><text x="917.0" y="376.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">en Moto (SS-03)</text><path class="compartimiento" d="M753.8 389.2 H1080.2" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="917.0" y="402.4" font-size="10" text-anchor="middle" dominant-baseline="central" fill="#6B7683">puntos de extensión</text><text x="917.0" y="415.6" font-size="10" text-anchor="middle" dominant-baseline="central" fill="#6B7683" font-weight="bold">PE-10</text></g><g class="actor" data-act="02" data-x="70" data-y="94"><circle cx="70.0" cy="93.8" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 102.8 V126.8 M55.0 110.8 H85.0 M70.0 126.8 L57.0 146.8 M70.0 126.8 L83.0 146.8" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="160.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Chofer</text><text x="70.0" y="174.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-02)</text></g><g class="actor" data-act="03" data-x="70" data-y="266"><circle cx="70.0" cy="266.2" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 275.2 V299.2 M55.0 283.2 H85.0 M70.0 299.2 L57.0 319.2 M70.0 299.2 L83.0 319.2" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="333.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Administrador</text><text x="70.0" y="346.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-03)</text></g><g class="actor" data-act="05" data-x="70" data-y="481"><circle cx="70.0" cy="481.2" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 490.2 V514.2 M55.0 498.2 H85.0 M70.0 514.2 L57.0 534.2 M70.0 514.2 L83.0 534.2" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="548.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Administrador</text><text x="70.0" y="561.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">General</text><text x="70.0" y="574.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-05)</text></g><g class="actor" data-act="04" data-x="70" data-y="615"><circle cx="70.0" cy="615.2" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 624.2 V648.2 M55.0 632.2 H85.0 M70.0 648.2 L57.0 668.2 M70.0 648.2 L83.0 668.2" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="682.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Sistema Automático</text><text x="70.0" y="695.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-04)</text></g><g class="actor" data-act="06" data-x="70" data-y="749"><circle cx="70.0" cy="749.2" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 758.2 V782.2 M55.0 766.2 H85.0 M70.0 782.2 L57.0 802.2 M70.0 782.2 L83.0 802.2" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="816.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">«sistema externo»</text><text x="70.0" y="829.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">MercadoPago</text><text x="70.0" y="842.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-06)</text></g><path class="gen" data-esp="05" data-gen="03" d="M70 471.2 V373.2" fill="none" stroke="#1F3A5F" stroke-width="1" marker-end="url(#hueco)"/><text x="150.0" y="917.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Tres columnas: el actor, los casos de uso que inicia y, a la derecha, los casos relacionados con ellos por «include» o «extend».</text><text x="150.0" y="933.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: del caso que extiende al caso base (línea discontinua, con su punto de extensión PE-n,</text><text x="150.0" y="947.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">que figura también en el compartimiento «puntos de extensión» del caso base).</text><text x="150.0" y="963.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Cada «include» y cada «extend» tiene su propio trazo, con el rótulo junto a su arranque. Con relleno rosado, los casos de uso planificados; con borde discontinuo, los casos de uso que no inicia</text><text x="150.0" y="977.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">el actor de este diagrama o que son de otro subsistema, solo como referencia.</text><text x="150.0" y="993.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-04 CU-168 extiende a CU-008: cuando el pedido cancelado tiene un pago aprobado por una pasarela</text><text x="150.0" y="1009.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-05 CU-168 extiende a CU-010: cuando el pedido cancelado tiene un pago aprobado por una pasarela</text><text x="150.0" y="1025.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-10 CU-168 extiende a CU-149: cuando el pedido express pasa a reparto común y ya estaba pagado en linea</text></svg>