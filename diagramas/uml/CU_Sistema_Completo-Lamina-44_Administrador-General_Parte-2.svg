r un Archivo (SS-07)</text></g><g class="actor" data-act="05" data-x="85" data-y="549"><circle cx="85.0" cy="548.8" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M85.0 557.8 V581.8 M70.0 565.8 H100.0 M85.0 581.8 L72.0 601.8 M85.0 581.8 L98.0 601.8" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="85.0" y="615.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Administrador</text><text x="85.0" y="629.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">General</text><text x="85.0" y="642.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-05)</text></g><g class="leyenda"><text x="235.0" y="1068.8" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: de la extensión al caso base (línea</text><text x="235.0" y="1082.8" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">discontinua).</text><text x="235.0" y="1098.8" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">ACT-05 especializa a ACT-03 (triángulo hueco); además, cada caso de uso lleva la asociación de todos los actores que el catálogo le asigna,</text><text x="235.0" y="1112.8" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">también la de ACT-05.</text><text x="235.0" y="1128.8" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Con borde discontinuo, los casos de uso de otro diagrama, solo como referencia.</text><text x="235.0" y="1144.8" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-1 CU-174 extiende a CU-023: cuando el cliente adjunta evidencia fotográfica</text></g></svg>