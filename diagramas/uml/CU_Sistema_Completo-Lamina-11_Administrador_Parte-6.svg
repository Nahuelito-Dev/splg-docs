line="central" fill="#000000">Dar de Baja un Depósito</text></g><g class="cu" data-cu="CU-268" data-x="365" data-y="1032"><ellipse cx="365.0" cy="1032.2" rx="175" ry="19.4" fill="#F6E4E1" stroke="#9C4436" stroke-width="1.0"/><text x="365.0" y="1025.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-268</text><text x="365.0" y="1038.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Reactivar un Producto</text></g><g class="cu" data-cu="CU-269" data-x="365" data-y="1077"><ellipse cx="365.0" cy="1077.0" rx="175" ry="19.4" fill="#F6E4E1" stroke="#9C4436" stroke-width="1.0"/><text x="365.0" y="1070.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-269</text><text x="365.0" y="1083.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Consultar los Productos Inactivos</text></g><g class="cu" data-cu="CU-250" data-x="917" data-y="615"><ellipse cx="917.0" cy="615.4" rx="165" ry="23.0" fill="#FFFFFF" stroke="#6B7683" stroke-width="1.0" stroke-dasharray="5 3"/><text x="917.0" y="608.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683" font-weight="bold">CU-250</text><text x="917.0" y="622.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">Aplicar un Movimiento de Stock (SS-08)</text></g><g class="actor" data-act="03" data-x="70" data-y="549"><circle cx="70.0" cy="548.6" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 557.6 V581.6 M55.0 565.6 H85.0 M70.0 581.6 L57.0 601.6 M70.0 581.6 L83.0 601.6" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="615.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Administrador</text><text x="70.0" y="628.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-03)</text></g><text x="150.0" y="1136.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Tres columnas: el actor, los casos de uso que inicia y, a la derecha, los casos relacionados con ellos por «include» o «extend».</text><text x="150.0" y="1152.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: del caso que extiende al caso base (línea discontinua, con su punto de extensión PE-n,</text><text x="150.0" y="1166.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">que figura también en el compartimiento «puntos de extensión» del caso base).</text><text x="150.0" y="1182.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Cada «include» y cada «extend» tiene su propio trazo, con el rótulo junto a su arranque. Con relleno rosado, los casos de uso planificados; con borde discontinuo, los casos de uso que no inicia</text><text x="150.0" y="1196.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">el actor de este diagrama o que son de otro subsistema, solo como referencia.</text></svg>