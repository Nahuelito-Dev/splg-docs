 x="70.0" y="769.1" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-05)</text></g><g class="actor" data-act="07" data-x="70" data-y="810"><circle cx="70.0" cy="809.7" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 818.7 V842.7 M55.0 826.7 H85.0 M70.0 842.7 L57.0 862.7 M70.0 842.7 L83.0 862.7" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="876.7" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">«sistema externo»</text><text x="70.0" y="889.9" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Firebase</text><text x="70.0" y="903.1" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-07)</text></g><path class="gen" data-esp="05" data-gen="03" d="M70 665.7 V567.7" fill="none" stroke="#1F3A5F" stroke-width="1" marker-end="url(#hueco)"/><text x="150.0" y="977.7" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Tres columnas: el actor, los casos de uso que inicia y, a la derecha, los casos relacionados con ellos por «include» o «extend».</text><text x="150.0" y="993.7" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: del caso que extiende al caso base (línea discontinua, con su punto de extensión PE-n,</text><text x="150.0" y="1007.7" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">que figura también en el compartimiento «puntos de extensión» del caso base).</text><text x="150.0" y="1023.7" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Cada «include» y cada «extend» tiene su propio trazo, con el rótulo junto a su arranque. Con relleno rosado, los casos de uso planificados; con borde discontinuo, los casos de uso que no inicia</text><text x="150.0" y="1037.7" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">el actor de este diagrama o que son de otro subsistema, solo como referencia.</text></svg>