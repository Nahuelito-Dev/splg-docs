ke-width="1.0"/><text x="365.0" y="231.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-175</text><text x="365.0" y="244.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Consultar la Fotografía de un Reclamo</text></g><g class="cu" data-cu="CU-024" data-x="365" data-y="283"><ellipse cx="365.0" cy="283.0" rx="175" ry="19.4" fill="url(#vp)" stroke="#3C5F8F" stroke-width="1.0"/><text x="365.0" y="276.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-024</text><text x="365.0" y="289.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Consultar los Reclamos</text></g><g class="cu" data-cu="CU-025" data-x="365" data-y="328"><ellipse cx="365.0" cy="327.8" rx="175" ry="19.4" fill="url(#vp)" stroke="#3C5F8F" stroke-width="1.0"/><text x="365.0" y="321.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-025</text><text x="365.0" y="334.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Resolver un Reclamo</text></g><g class="cu" data-cu="CU-166" data-x="365" data-y="373"><ellipse cx="365.0" cy="372.6" rx="175" ry="19.4" fill="url(#vp)" stroke="#3C5F8F" stroke-width="1.0"/><text x="365.0" y="366.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-166</text><text x="365.0" y="379.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Tomar un Reclamo Pendiente</text></g><g class="cu" data-cu="CU-167" data-x="365" data-y="417"><ellipse cx="365.0" cy="417.4" rx="175" ry="19.4" fill="url(#vp)" stroke="#3C5F8F" stroke-width="1.0"/><text x="365.0" y="410.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-167</text><text x="365.0" y="424.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Reabrir un Reclamo</text></g><g class="cu" data-cu="CU-159" data-x="903" data-y="193"><ellipse cx="903.0" cy="193.4" rx="165" ry="19.4" fill="#FFFFFF" stroke="#6B7683" stroke-width="1.0" stroke-dasharray="5 3"/><text x="903.0" y="186.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683" font-weight="bold">CU-159</text><text x="903.0" y="200.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">Almacenar un Archivo (SS-07)</text></g><g class="cu" data-cu="CU-160" data-x="903" data-y="238"><ellipse cx="903.0" cy="238.2" rx="165" ry="19.4" fill="#FFFFFF" stroke="#6B7683" stroke-width="1.0" stroke-dasharray="5 3"/><text x="903.0" y="231.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683" font-weight="bold">CU-160</text><text x="903.0" y="244.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">Recuperar un Archivo (SS-07)</text></g><g class="actor" data-act="01" data-x="70" data-y="147"><circle cx="70.0" cy="147.2" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 156.2 V180.2 M55.0 164.2 H85.0 M70.0 180.2 L57.0 200.2 M70.0 180.2 L83.0 200.2" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="214.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Cliente</text><text x="70.0" y="227.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-01)</text></g><g class="actor" data-act="03" data-x="70" data-y="281"><circle cx="70.0" cy="281.2" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 290.2 V314.2 M55.0 298.2 H85.0 M70.0 314.2 L57.0 334.2 M70.0 314.2 L83.0 334.2" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="348.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Administrador</text><text x="70.0" y="361.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-03)</text></g><g class="actor" data-act="05" data-x="70" data-y="496"><circle cx="70.0" cy="496.2" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 505.2 V529.2 M55.0 513.2 H85.0 M70.0 529.2 L57.0 549.2 M70.0 529.2 L83.0 549.2" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="563.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Administrador</text><text x="70.0" y="576.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">General</text><text x="70.0" y="589.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-05)</text></g><path class="gen" data-esp="05" data-gen="03" d="M70 486.2 V388.2" fill="none" stroke="#1F3A5F" stroke-width="1" marker-end="url(#hueco)"/><text x="150.0" y="664.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Tres columnas: el actor, los casos de uso que inicia y, a la derecha, los casos relacionados con ellos por «include» o «extend».</text><text x="150.0" y="680.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: del caso que extiende al caso base (línea discontinua, con su punto de extensión PE-n,</text><text x="150.0" y="694.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">que figura también en el compartimiento «puntos de extensión» del caso base).</text><text x="150.0" y="710.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Cada «include» y cada «extend» tiene su propio trazo, con el rótulo junto a su arranque. Con relleno rosado, los casos de uso planificados; con borde discontinuo, los casos de uso que no</text><text x="150.0" y="724.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">inicia el actor de este diagrama o que son de otro subsistema, solo como referencia.</text><text x="150.0" y="740.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-06 CU-174 extiende a CU-023: cuando el cliente adjunta evidencia fotográfica</text></svg>