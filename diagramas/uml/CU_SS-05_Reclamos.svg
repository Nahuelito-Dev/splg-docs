 y="707.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">ACT-05 especializa a ACT-03 (triángulo hueco); además, cada caso de uso lleva la asociación de todos los actores que el catálogo le asigna, también</text><text x="235.0" y="721.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">la de ACT-05.</text><text x="235.0" y="737.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Con borde discontinuo, los casos de uso de otro diagrama, solo como referencia.</text><text x="235.0" y="753.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-1 CU-174 extiende a CU-023: cuando el cliente adjunta evidencia fotográfica</text></g></svg>