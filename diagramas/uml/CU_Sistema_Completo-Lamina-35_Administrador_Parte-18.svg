><text x="837.0" y="161.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">(SS-01)</text></g><g class="etiqueta" data-tipo="extend" data-desde="CU-130" data-hasta="CU-129"><rect x="584.6" y="407.1" width="78.8" height="14" fill="#FFFFFF"/><text x="624.0" y="414.1" font-size="10" text-anchor="middle" dominant-baseline="central" fill="#1F3A5F">«extend» PE-1</text></g><g class="actor" data-act="03" data-x="85" data-y="321"><circle cx="85.0" cy="320.8" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M85.0 329.8 V353.8 M70.0 337.8 H100.0 M85.0 353.8 L72.0 373.8 M85.0 353.8 L98.0 373.8" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="85.0" y="387.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Administrador</text><text x="85.0" y="401.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-03)</text></g><g class="leyenda"><text x="235.0" y="587.6" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: de la extensión al caso base (línea</text><text x="235.0" y="601.6" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">discontinua).</text><text x="235.0" y="617.6" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">ACT-05 especializa a ACT-03 (triángulo hueco); además, cada caso de uso lleva la asociación de todos los actores que el catálogo le asigna, también</text><text x="235.0" y="631.6" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">la de ACT-05.</text><text x="235.0" y="647.6" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Con borde discontinuo, los casos de uso de otro diagrama, solo como referencia.</text><text x="235.0" y="663.6" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-1 CU-130 extiende a CU-129: cuando la ficha se abre desde un pedido, un reclamo o una calificación y hay que ubicar al cliente por su cuenta de</text><text x="235.0" y="677.6" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">usuario</text></g></svg>