.156,442.344 659.926,432.614 640.941,423.661" style="stroke:#2C4257;stroke-width:1.563;" fill="none" id="DE_LICENCIA-to-EN_SERVICIO"/><polygon points="633.875,420.328,643.928,431.979,640.941,423.661,649.26,420.674,633.875,420.328" fill="#2C4257" style="stroke:#2C4257;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="691.469" y="486.313" fill="#000" font-size="18.75" textLength="207.376" font-family="Helvetica">when(la licencia terminó)</text></g></g><rect x="216.703" y="764.063" width="116.699" height="62.5" fill="#F4F7FA" style="stroke:#2C4257;stroke-width:0.781;" rx="19.531" ry="19.531"/><text x="224.516" y="791" fill="#000" font-size="18.75" textLength="80.264" font-family="Helvetica">Egresado</text><text x="224.516" y="809.75" fill="#000" font-size="18.75" textLength="101.074" font-family="Helvetica">(terminated)</text><g class="start_entity" data-qualified-name=".start." id="ent0009" data-source-line="28"><ellipse cx="678.172" cy="79.688" rx="15.625" ry="15.625" fill="#222" style="stroke:#222;stroke-width:1.563;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0014" data-source-line="32"><ellipse cx="867.234" cy="795.313" rx="17.188" ry="17.188" fill="none" style="stroke:#222;stroke-width:1.563;"/><ellipse cx="867.234" cy="795.313" rx="9.375" ry="9.375" fill="#222" style="stroke:#222;stroke-width:1.563;"/></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="35"><path d="M45.234,939.063 L45.234,1035.938 A0,0 0 0 0 45.234,1035.938 L504.877,1035.938 A0,0 0 0 0 504.877,1035.938 L504.877,954.688 L489.252,939.063 L281.297,939.063 L275.047,827.25 L268.797,939.063 L45.234,939.063 A0,0 0 0 0 45.234,939.063" style="stroke:#7A7340;stroke-width:0.781;" fill="#FBF7E6"/><path d="M489.252,939.063 L489.252,954.688 L504.877,954.688 L489.252,939.063" style="stroke:#7A7340;stroke-width:0.781;" fill="#FBF7E6"/><text x="54.609" y="962.516" fill="#000" font-size="20.313" textLength="426.83" font-family="Helvetica">El egreso bloquea la cuenta de acceso y, si era</text><text x="54.609" y="982.829" fill="#000" font-size="20.313" textLength="395.181" font-family="Helvetica">chofer, lo deshabilita y libera su vehículo. El</text><text x="54.609" y="1003.141" fill="#000" font-size="20.313" textLength="411.06" font-family="Helvetica">reingreso no desbloquea la cuenta. Los datos</text><text x="54.609" y="1023.454" fill="#000" font-size="20.313" textLength="219.064" font-family="Helvetica">del legajo se conservan.</text></g><g class="entity" data-qualified-name="GMN19" id="ent0020" data-source-line="41"><path d="M1010.219,746.875 L1010.219,843.75 L1499.259,843.75 L1499.259,762.5 L1483.634,746.875 L1010.219,746.875" style="stroke:#7A7340;stroke-width:0.781;" fill="#FBF7E6"/><path d="M1483.634,746.875 L1483.634,762.5 L1499.259,762.5 L1483.634,746.875" style="stroke:#7A7340;stroke-width:1.563;" fill="#FBF7E6"/><text x="1019.594" y="770.329" fill="#000" font-size="20.313" textLength="433.585" font-family="Helvetica">«En servicio» y «De licencia» no se guardan: se</text><text x="1019.594" y="790.641" fill="#000" font-size="20.313" textLength="411.001" font-family="Helvetica">derivan de las licencias aprobadas. Un chofer</text><text x="1019.594" y="810.954" fill="#000" font-size="20.313" textLength="456.228" font-family="Helvetica">de licencia, con un documento bloqueante vencido</text><text x="1019.594" y="831.266" fill="#000" font-size="20.313" textLength="273.286" font-family="Helvetica">o egresado no recibe pedidos.</text></g><!--link *start* to ACTIVE--><g class="link" data-entity-1="ent0009" data-entity-2="ent0001" id="lnk10" data-source-line="28" data-link-type="dependency"><path d="M678.172,95.813 C678.172,117.75 678.172,154.109 678.172,202.578" style="stroke:#2C4257;stroke-width:1.563;" fill="none" id="*start*-to-ACTIVE"/><polygon points="678.172,210.391,684.422,196.328,678.172,202.578,671.922,196.328,678.172,210.391" fill="#2C4257" style="stroke:#2C4257;stroke-width:1.563;stroke-linej