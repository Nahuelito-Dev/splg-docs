.604 593.156,477.667 585.453,462.885 C578.234,449.042 572.498,442.223 559.638,433.504" style="stroke:#1F3A5F;stroke-width:1.25;" fill="none" id="DE_LICENCIA-to-EN_SERVICIO"/><polygon points="553.172,429.12,561.304,442.184,559.638,433.504,568.319,431.838,553.172,429.12" fill="#1F3A5F" style="stroke:#1F3A5F;stroke-width:1.25;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="592.781" y="487.698" fill="#1F3A5F" font-size="15.625" textLength="172.813" font-family="Arial">when(la licencia terminó)</text></g></g><rect x="181.844" y="755.076" width="108.276" height="62.5" fill="url(#g1hd04dcix3nj90)" style="stroke:#3C5F8F;stroke-width:0.781;"/><text x="189.656" y="782.684" fill="#000" font-size="17.188" textLength="73.576" font-family="Arial">Egresado</text><text x="189.656" y="802.448" fill="#000" font-size="17.188" textLength="92.651" font-family="Arial">(terminated)</text><g class="start_entity" data-qualified-name=".start." id="ent0009" data-source-line="13"><ellipse cx="582.859" cy="81.17" rx="15.625" ry="15.625" fill="#1F3A5F" style="stroke:#222;stroke-width:1.563;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0014" data-source-line="17"><ellipse cx="746.922" cy="786.326" rx="17.188" ry="17.188" fill="none" style="stroke:#1F3A5F;stroke-width:1.563;"/><ellipse cx="746.922" cy="786.326" rx="9.375" ry="9.375" fill="#222" style="stroke:#1F3A5F;stroke-width:1.563;"/></g><g class="entity" data-qualified-name="GMN16" id="ent0017" data-source-line="20"><path d="M55.406,925.373 L55.406,1012.867 A0,0 0 0 0 55.406,1012.867 L416.55,1012.867 A0,0 0 0 0 416.55,1012.867 L416.55,940.998 L400.925,925.373 L242.234,925.373 L235.984,817.951 L229.734,925.373 L55.406,925.373 A0,0 0 0 0 55.406,925.373" style="stroke:#3C5F8F;stroke-width:0.781;" fill="#FFF"/><path d="M400.925,925.373 L400.925,940.998 L416.55,940.998 L400.925,925.373" style="stroke:#3C5F8F;stroke-width:0.781;" fill="#FFF"/><text x="64.781" y="947.842" fill="#000" font-size="15.625" textLength="328.331" font-family="Arial">El egreso bloquea la cuenta de acceso y, si era</text><text x="64.781" y="965.809" fill="#000" font-size="15.625" textLength="303.986" font-family="Arial">chofer, lo deshabilita y libera su vehículo. El</text><text x="64.781" y="983.776" fill="#000" font-size="15.625" textLength="316.2" font-family="Arial">reingreso no desbloquea la cuenta. Los datos</text><text x="64.781" y="1001.743" fill="#000" font-size="15.625" textLength="168.51" font-family="Arial">del legajo se conservan.</text></g><g class="entity" data-qualified-name="GMN19" id="ent0020" data-source-line="26"><path d="M884.719,742.576 L884.719,830.07 L1268.476,830.07 L1268.476,758.201 L1252.851,742.576 L884.719,742.576" style="stroke:#3C5F8F;stroke-width:0.781;" fill="#FFF"/><path d="M1252.851,742.576 L1252.851,758.201 L1268.476,758.201 L1252.851,742.576" style="stroke:#3C5F8F;stroke-width:1.563;" fill="#FFF"/><text x="894.094" y="765.045" fill="#000" font-size="15.625" textLength="333.527" font-family="Arial">«En servicio» y «De licencia» no se guardan: se</text><text x="894.094" y="783.012" fill="#000" font-size="15.625" textLength="316.154" font-family="Arial">derivan de las licencias aprobadas. Un chofer</text><text x="894.094" y="800.979" fill="#000" font-size="15.625" textLength="350.945" font-family="Arial">de licencia, con un documento bloqueante vencido</text><text x="894.094" y="818.946" fill="#000" font-size="15.625" textLength="210.22" font-family="Arial">o egresado no recibe pedidos.</text></g><!--link *start* to ACTIVE--><g class="link" data-entity-1="ent0009" data-entity-2="ent0001" id="lnk10" data-source-line="13" data-link-type="dependency"><path d="M582.859,97.201 C582.859,118.873 582.859,154.576 582.859,202.404" style="stroke:#1F3A5F;stroke-width:1.25;" fill="none" id="*start*-to-ACTIVE"/><polygon points="582.859,210.217,589.109,196.154,582.859,202.404,576.609,196.154,582.859,210.217" fill="#1F3A5F" style="stroke:#1F3A5F;stroke-width:1.25;stroke-linejoin:miter;stroke-m