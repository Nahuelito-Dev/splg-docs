<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="403" viewBox="0 0 1160 403" font-family="Arial, Helvetica, sans-serif"><defs><marker id="abre" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#1F3A5F" stroke-width="1"/></marker><marker id="hueco" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1"/></marker><linearGradient id="vp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCE6F2"/><stop offset="1" stop-color="#C6DAF0"/></linearGradient></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="580.0" y="22.0" font-size="14" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">SS-10 — Multi-Distribuidora (4 casos de uso)</text><rect class="limite" data-x="150" data-y="44" data-w="974" data-h="241" x="150" y="44" width="974" height="241" fill="#FFFFFF" stroke="#3C5F8F" stroke-width="1.0"/><text x="637.0" y="62.0" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">Sistema de Pedidos y Logística de Garrafas de Gas (SPLG)</text><path class="asoc" data-act="05" data-cu="CU-052" data-rol="principal" d="M85.0 155.6 L190.0 111.4" fill="none" stroke="#1F3A5F" stroke-width="0.7" opacity="0.9"/><path class="asoc" data-act="05" data-cu="CU-053" data-rol="principal" d="M85.0 155.6 L190.0 156.2" fill="none" stroke="#1F3A5F" stroke-width="0.7" opacity="0.9"/><path class="asoc" data-act="05" data-cu="CU-054" data-rol="principal" d="M85.0 155.6 L190.0 201.0" fill="none" stroke="#1F3A5F" stroke-width="0.7" opacity="0.9"/><path class="asoc" data-act="05" data-cu="CU-055" data-rol="principal" d="M85.0 155.6 L190.0 245.8" fill="none" stroke="#1F3A5F" stroke-width="0.7" opacity="0.9"/><g class="cu" data-cu="CU-052" data-x="365" data-y="111"><ellipse cx="365.0" cy="111.4" rx="175" ry="19.4" fill="url(#vp)" stroke="#3C5F8F" stroke-width="1.0"/><text x="365.0" y="104.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-052</text><text x="365.0" y="118.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Registrar una Distribuidora</text></g><g class="cu" data-cu="CU-053" data-x="365" data-y="156"><ellipse cx="365.0" cy="156.2" rx="175" ry="19.4" fill="url(#vp)" stroke="#3C5F8F" stroke-width="1.0"/><text x="365.0" y="149.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-053</text><text x="365.0" y="162.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Consultar las Distribuidoras</text></g><g class="cu" data-cu="CU-054" data-x="365" data-y="201"><ellipse cx="365.0" cy="201.0" rx="175" ry="19.4" fill="url(#vp)" stroke="#3C5F8F" stroke-width="1.0"/><text x="365.0" y="194.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-054</text><text x="365.0" y="207.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Modificar los Datos de una Distribuidora</text></g><g class="cu" data-cu="CU-055" data-x="365" data-y="246"><ellipse cx="365.0" cy="245.8" rx="175" ry="19.4" fill="url(#vp)" stroke="#3C5F8F" stroke-width="1.0"/><text x="365.0" y="239.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-055</text><text x="365.0" y="252.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Dar de Baja una Distribuidora</text></g><g class="actor" data-act="05" data-x="70" data-y="139"><circle cx="70.0" cy="138.6" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 147.6 V171.6 M55.0 155.6 H85.0 M70.0 171.6 L57.0 191.6 M70.0 171.6 L83.0 191.6" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="205.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Administrador</text><text x="70.0" y="218.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">General</text><text x="70.0" y="232.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-05)</text></g><text x="150.0" y="306.6" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Tres columnas: el actor, los casos de uso que inicia y, a la derecha, los casos relacionados con ellos por «include» o «extend».</text><text x="150.0" y="322.6" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: del caso que extiende al caso base (línea discontinua, con su punto de extensión</text><text x="150.0" y="336.6" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-n, que figura también en el compartimiento «puntos de extensión» del caso base).</text><text x="150.0" y="352.6" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Cada «include» y cada «extend» tiene su propio trazo, con el rótulo junto a su arranque. Con relleno rosado, los casos de uso planificados; con borde discontinuo, los casos de uso que no</text><text x="150.0" y="366.6" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">inicia el actor de este diagrama o que son de otro subsistema, solo como referencia.</text></svg>