-baseline="central" fill="#000000">Registrar la Licencia de Conducir del</text><text x="365.0" y="673.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Chofer</text></g><g class="cu" data-cu="CU-267" data-x="365" data-y="711"><ellipse cx="365.0" cy="711.0" rx="175" ry="19.4" fill="url(#vp)" stroke="#3C5F8F" stroke-width="1.0"/><text x="365.0" y="704.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-267</text><text x="365.0" y="717.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Desactivar un Chofer</text></g><g class="cu" data-cu="CU-271" data-x="365" data-y="756"><ellipse cx="365.0" cy="755.8" rx="175" ry="19.4" fill="url(#vp)" stroke="#3C5F8F" stroke-width="1.0"/><text x="365.0" y="749.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-271</text><text x="365.0" y="762.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Invalidar un Chofer</text></g><g class="cu" data-cu="CU-082" data-x="889" data-y="226"><ellipse cx="889.0" cy="225.8" rx="165" ry="19.4" fill="#FFFFFF" stroke="#6B7683" stroke-width="1.0" stroke-dasharray="5 3"/><text x="889.0" y="219.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683" font-weight="bold">CU-082</text><text x="889.0" y="232.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">Crear un Usuario Base (SS-01)</text></g><g class="actor" data-act="02" data-x="70" data-y="94"><circle cx="70.0" cy="93.8" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 102.8 V126.8 M55.0 110.8 H85.0 M70.0 126.8 L57.0 146.8 M70.0 126.8 L83.0 146.8" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="160.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Chofer</text><text x="70.0" y="174.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-02)</text></g><g class="actor" data-act="03" data-x="70" data-y="406"><circle cx="70.0" cy="405.6" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 414.6 V438.6 M55.0 422.6 H85.0 M70.0 438.6 L57.0 458.6 M70.0 438.6 L83.0 458.6" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="472.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Administrador</text><text x="70.0" y="485.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-03)</text></g><text x="150.0" y="815.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Tres columnas: el actor, los casos de uso que inicia y, a la derecha, los casos relacionados con ellos por «include» o «extend».</text><text x="150.0" y="831.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: del caso que extiende al caso base (línea discontinua, con su punto de extensión</text><text x="150.0" y="845.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-n, que figura también en el compartimiento «puntos de extensión» del caso base).</text><text x="150.0" y="861.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Cada «include» y cada «extend» tiene su propio trazo, con el rótulo junto a su arranque. Con relleno rosado, los casos de uso planificados; con borde discontinuo, los casos de uso que no</text><text x="150.0" y="875.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">inicia el actor de este diagrama o que son de otro subsistema, solo como referencia.</text></svg>