<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="682" viewBox="0 0 1160 682" font-family="Arial, Helvetica, sans-serif"><defs><marker id="abre" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#1F3A5F" stroke-width="1"/></marker><marker id="hueco" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1"/></marker><linearGradient id="vp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCE6F2"/><stop offset="1" stop-color="#C6DAF0"/></linearGradient></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="580.0" y="22.0" font-size="14" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">SS-06 — Reportes y Tablero (6 casos de uso)</text><rect class="limite" data-x="150" data-y="44" data-w="974" data-h="520" x="150" y="44" width="974" height="520" fill="#FFFFFF" stroke="#3C5F8F" stroke-width="1.0"/><text x="637.0" y="62.0" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">Sistema de Pedidos y Logística de Garrafas de Gas (SPLG)</text><path class="asoc" data-act="03" data-cu="CU-026" data-rol="principal" d="M85.0 220.0 L190.0 111.4" fill="none" stroke="#1F3A5F" stroke-width="0.7" opacity="0.9"/><path class="asoc" data-act="03" data-cu="CU-027" data-rol="principal" d="M85.0 220.0 L190.0 162.4" fill="none" stroke="#1F3A5F" stroke-width="0.7" opacity="0.9"/><path class="asoc" data-act="03" data-cu="CU-028" data-rol="principal" d="M85.0 220.0 L190.0 219.6" fill="none" stroke="#1F3A5F" stroke-width="0.7" opacity="0.9"/><path class="asoc" data-act="03" data-cu="CU-029" data-rol="principal" d="M85.0 220.0 L190.0 270.6" fill="none" stroke="#1F3A5F" stroke-width="0.7" opacity="0.9"/><path class="asoc" data-act="03" data-cu="CU-030" data-rol="principal" d="M85.0 220.0 L190.0 321.6" fill=