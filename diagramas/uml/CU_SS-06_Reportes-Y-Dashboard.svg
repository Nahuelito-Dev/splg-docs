 data-y="271"><ellipse cx="365.0" cy="270.6" rx="175" ry="19.4" fill="url(#vp)" stroke="#3C5F8F" stroke-width="1.0"/><text x="365.0" y="264.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-029</text><text x="365.0" y="277.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Consultar el Reporte por Método de Pago</text></g><g class="cu" data-cu="CU-030" data-x="365" data-y="322"><ellipse cx="365.0" cy="321.6" rx="175" ry="25.6" fill="url(#vp)" stroke="#3C5F8F" stroke-width="1.0"/><text x="365.0" y="308.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-030</text><text x="365.0" y="321.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Consultar el Gráfico de Ventas (últimos</text><text x="365.0" y="334.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">7 días)</text></g><g class="cu" data-cu="CU-304" data-x="365" data-y="373"><ellipse cx="365.0" cy="372.6" rx="175" ry="19.4" fill="url(#vp)" stroke="#3C5F8F" stroke-width="1.0"/><text x="365.0" y="366.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-304</text><text x="365.0" y="379.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Consultar los Cobros Pendientes</text></g><g class="actor" data-act="03" data-x="70" data-y="203"><circle cx="70.0" cy="203.0" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 212.0 V236.0 M55.0 220.0 H85.0 M70.0 236.0 L57.0 256.0 M70.0 236.0 L83.0 256.0" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="270.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Administrador</text><text x="70.0" y="283.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-03)</text></g><g class="actor" data-act="05" data-x="70" data-y="418"><circle cx="70.0" cy="418.0" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 427.0 V451.0 M55.0 435.0 H85.0 M70.0 451.0 L57.0 471.0 M70.0 451.0 L83.0 471.0" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="485.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Administrador</text><text x="70.0" y="498.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">General</text><text x="70.0" y="511.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-05)</text></g><path class="gen" data-esp="05" data-gen="03" d="M70 408.0 V310.0" fill="none" stroke="#1F3A5F" stroke-width="1" marker-end="url(#hueco)"/><text x="150.0" y="586.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Tres columnas: el actor, los casos de uso que inicia y, a la derecha, los casos relacionados con ellos por «include» o «extend».</text><text x="150.0" y="602.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: del caso que extiende al caso base (línea discontinua, con su punto de extensión</text><text x="150.0" y="616.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-n, que figura también en el compartimiento «puntos de extensión» del caso base).</text><text x="150.0" y="632.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Cada «include» y cada «extend» tiene su propio trazo, con el rótulo junto a su arranque. Con relleno rosado, los casos de uso planificados; con borde discontinuo, los casos de uso que no</text><text x="150.0" y="646.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">inicia el actor de este diagrama o que son de otro subsistema, solo como referencia.</text></svg>