línea</text><text x="235.0" y="1024.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">discontinua).</text><text x="235.0" y="1040.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">ACT-05 especializa a ACT-03 (triángulo hueco); además, cada caso de uso lleva la asociación de todos los actores que el catálogo le asigna, también</text><text x="235.0" y="1054.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">la de ACT-05.</text><text x="235.0" y="1070.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Con borde discontinuo, los casos de uso de otro diagrama, solo como referencia.</text><text x="235.0" y="1086.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-1 CU-130 extiende a CU-129: cuando la ficha se abre desde un pedido, un reclamo o una calificación y hay que ubicar al cliente por su cuenta de</text><text x="235.0" y="1100.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">usuario</text></g></svg>