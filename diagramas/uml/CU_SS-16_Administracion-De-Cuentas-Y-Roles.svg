xt-anchor="start" dominant-baseline="central" fill="#1F3A5F">que figura también en el compartimiento «puntos de extensión» del caso base).</text><text x="150.0" y="949.8" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Cada «include» y cada «extend» tiene su propio trazo, con el rótulo junto a su arranque. Con relleno rosado, los casos de uso planificados; con borde discontinuo, los casos de uso que no</text><text x="150.0" y="963.8" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">inicia el actor de este diagrama o que son de otro subsistema, solo como referencia.</text><text x="150.0" y="979.8" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-09 CU-130 extiende a CU-129: cuando la ficha se abre desde un pedido, un reclamo o una calificación y hay que ubicar al cliente por su cuenta de usuario</text></svg>