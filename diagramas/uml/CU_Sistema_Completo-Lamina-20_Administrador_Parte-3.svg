nt-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">Laboral del Chofer (SS-19)</text></g><g class="cu" data-cu="CU-248" data-x="821" data-y="273"><ellipse cx="821.0" cy="273.0" rx="140" ry="26.6" fill="#FFFFFF" stroke="#6B7683" stroke-width="1.0" stroke-dasharray="5 3"/><text x="821.0" y="259.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683" font-weight="bold">CU-248</text><text x="821.0" y="273.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">Verificar la Carga de Camión</text><text x="821.0" y="286.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">Abierta del Chofer (SS-08)</text></g><g class="actor" data-act="03" data-x="85" data-y="178"><circle cx="85.0" cy="177.7" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M85.0 186.7 V210.7 M70.0 194.7 H100.0 M85.0 210.7 L72.0 230.7 M85.0 210.7 L98.0 230.7" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="85.0" y="244.7" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Administrador</text><text x="85.0" y="257.9" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-03)</text></g><g class="leyenda"><text x="235.0" y="370.6" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: de la extensión al caso base (línea</text><text x="235.0" y="384.6" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">discontinua).</text><text x="235.0" y="400.6" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">ACT-05 especializa a ACT-03 (triángulo hueco); además, cada caso de uso lleva la asociación de todos los actores que el catálogo le asigna,</text><text x="235.0" y="414.6" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">también la de ACT-05.</text><text x="235.0" y="430.6" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Con relleno rosado, los casos de uso planificados.</text><text x="235.0" y="446.6" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Con borde discontinuo, los casos de uso de otro diagrama, solo como referencia.</text></g></svg>