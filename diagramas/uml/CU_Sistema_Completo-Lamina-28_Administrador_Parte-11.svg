el caso base al incluido · «extend»: de la extensión al caso base (línea</text><text x="235.0" y="1099.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">discontinua).</text><text x="235.0" y="1115.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">ACT-05 especializa a ACT-03 (triángulo hueco); además, cada caso de uso lleva la asociación de todos los actores que el catálogo le asigna,</text><text x="235.0" y="1129.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">también la de ACT-05.</text><text x="235.0" y="1145.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Con relleno rosado, los casos de uso planificados.</text><text x="235.0" y="1161.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Con borde discontinuo, los casos de uso de otro diagrama, solo como referencia.</text></g></svg>