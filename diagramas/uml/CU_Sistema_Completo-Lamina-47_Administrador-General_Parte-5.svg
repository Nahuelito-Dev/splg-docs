ar un Usuario Base</text><text x="821.0" y="632.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">(SS-01)</text></g><g class="actor" data-act="05" data-x="85" data-y="559"><circle cx="85.0" cy="558.8" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M85.0 567.8 V591.8 M70.0 575.8 H100.0 M85.0 591.8 L72.0 611.8 M85.0 591.8 L98.0 611.8" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="85.0" y="625.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Administrador</text><text x="85.0" y="639.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">General</text><text x="85.0" y="652.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-05)</text></g><g class="leyenda"><text x="235.0" y="1016.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: de la extensión al caso base (línea</text><text x="235.0" y="1030.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">discontinua).</text><text x="235.0" y="1046.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">ACT-05 especializa a ACT-03 (triángulo hueco); además, cada caso de uso lleva la asociación de todos los actores que el catálogo le asigna,</text><text x="235.0" y="1060.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">también la de ACT-05.</text><text x="235.0" y="1076.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Con borde discontinuo, los casos de uso de otro diagrama, solo como referencia.</text></g></svg>