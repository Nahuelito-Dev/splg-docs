<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:731px;height:685px;background:#FFFFFF;" width="731.25px" height="685.938px" viewBox="0 0 731 685" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="120.132" y="32.469" fill="#000" font-size="21.875" textLength="481.41" font-weight="700" font-family="Helvetica">Diagrama de estados — Recepción de compra</text></g><rect x="148.422" y="210.938" width="112.543" height="62.5" fill="#F4F7FA" style="stroke:#2C4257;stroke-width:0.781;" rx="19.531" ry="19.531"/><text x="156.234" y="237.875" fill="#000" font-size="18.75" textLength="96.918" font-family="Helvetica">Confirmada</text><text x="156.234" y="256.625" fill="#000" font-size="18.75" textLength="94.812" font-family="Helvetica">(confirmed)</text><rect x="162.469" y="407.813" width="84.436" height="62.5" fill="#F4F7FA" style="stroke:#2C4257;stroke-width:0.781;" rx="19.531" ry="19.531"/><text x="170.281" y="434.75" fill="#000" font-size="18.75" textLength="68.811" font-family="Helvetica">Anulada</text><text x="170.281" y="453.5" fill="#000" font-size="18.75" textLength="67.74" font-family="Helvetica">(voided)</text><g class="start_entity" data-qualified-name=".start." id="ent0003" data-source-line="22"><ellipse cx="204.688" cy="79.688" rx="15.625" ry="15.625" fill="#222" style="stroke:#222;stroke-width:1.563;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0006" data-source-line="24"><ellipse cx="26.563" cy="614.063" rx="17.188" ry="17.188" fill="none" style="stroke:#222;stroke-width:1.563;"/><ellipse cx="26.563" cy="614.063" rx="9.375" ry="9.375" fill="#222" style="stroke:#222;stroke-width:1.563;"/></g><g class="entity" data-qualified-name="GMN8" id="ent0009" data-source-line="27"><path d="M98.125,565.625 L98.125,662.5 A0,0 0 0 0 98.125,662.5 L670.617,662.5 A0,0 0 0 0 670.617,662.5 L670.617,581.25 L654.992,565.625 L340.938,565.625 L236.391,470.953 L328.438,565.625 L98.125,565.625 A0,0 0 0 0 98.125,565.625" style="stroke:#7A7340;stroke-width:0.781;" fill="#FBF7E6"/><path d="M654.992,565.625 L654.992,581.25 L670.617,581.25 L654.992,565.625" style="stroke:#7A7340;stroke-width:0.781;" fill="#FBF7E6"/><text x="107.5" y="589.079" fill="#000" font-size="20.313" textLength="465.154" font-family="Helvetica">La anulación registra los movimientos inversos y no</text><text x="107.5" y="609.391" fill="#000" font-size="20.313" textLength="472.028" font-family="Helvetica">borra nada. El pago al proveedor (impago o pagado,</text><text x="107.5" y="629.704" fill="#000" font-size="20.313" textLength="539.68" font-family="Helvetica">marcarPagoDeRecepcion) es otro atributo y no cambia este</text><text x="107.5" y="650.016" fill="#000" font-size="20.313" textLength="488.988" font-family="Helvetica">estado; una recepción anulada ya no cambia de pago.</text></g><!--link *start* to confirmed--><g class="link" data-entity-1="ent0003" data-entity-2="ent0001" id="lnk4" data-source-line="22" data-link-type="dependency"><path d="M204.688,95.953 C204.688,121.844 204.688,168.25 204.688,202.453" style="stroke:#2C4257;stroke-width:1.563;" fill="none" id="*start*-to-confirmed"/><polygon points="204.688,210.266,210.938,196.203,204.688,202.453,198.438,196.203,204.688,210.266" fill="#2C4257" style="stroke:#2C4257;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="206.25" y="158.188" fill="#000" font-size="18.75" textLength="260.504" font-family="Helvetica">registrarRecepcionDeCompra()</text></g><!--link confirmed to voided--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="23" data-link-type="dependency"><path d="M204.688,274.016 C204.688,310.422 204.688,363.328 204.688,399.625" style="stroke:#2C4257;stroke-width:1.563;" fill="none" id="confirmed-to-voided"/><polygon points="204.688,407.438,210.938,393.375,204.688,399.625,198.438,393.375,204.688,407.438" fill="#2C4257" style="stroke:#2C4257;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="307.388" y="336.313" fill="#000" font-size="18.75" textLength="299.084" font-family="Helvetica">anularRecepcionDeCompra(motivo)</text><text x="206.25" y="355.063" fill="#000" font-size="18.75" textLength="501.361" font-family="Helvetica">[el depósito conserva lo ingresado y no figura como pagada]</text></g><!--link voided to *end*--><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" id="lnk7" data-source-line="24" data-link-type="dependency"><path d="M170.938,470.813 C143.375,495.734 103.688,532.313 70.313,565.625 C58.656,577.266 51.114,585.328 42.38,594.938" style="stroke:#2C4257;stroke-width:1.563;" fill="none" id="voided-to-*end*"/><polygon points="37.125,600.719,51.209,594.516,42.38,594.938,41.959,586.109,37.125,600.719" fill="#2C4257" style="stroke:#2C4257;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><?plantuml-src RLDBRjim4Dtp58DqOnTDa3XE3RH00SSVT544HR9CiXXBOuM8o166j0AtAD13z2OvGcxIatHeoRRgH1kHC-_nlI5deeqbmTHY8UWGSW8A4NCEyFVt7xYcZAhClZpxbCdOLO8cF5fVeS9XWTbZ8Rpo-OHB5dWtttmTH7ZGivwiBs29PQ1E9gSbhieuPn-lq15yfRAcQ3Dy6tDZVn2SdNUJbOMpYzDEP2p2JwsJmMGuk1XrdKIC13yDm2LBJl8_JgElQXdEH_EnPcuYIZo4ptQuNMWSezZ5AjBUxy3yElJNJUvJLnpfjOFB-MZsyH3LTJyQZyw7f-R1fdTpLLphbOLCR1KjUzEKV3HXlxJYCCSxtykQ3UNz8y00k-qMFFQhia7MhAUsi6PjpEtxUpW-_hAdmISGAco8Wj8s2_ifJJQTqkkRFJ3HccEKWqdb3OBZQ6lkt_bRAhMKwkKvsCX9Bf3K22M3zf9GqAw2DNY6fIrMWgar6IeirFgzQMMIeXesnkkrmO9ZP0Uyt1O3y0qR8qs3R-jGaG2EQ-ii-QXhwskIe8iagBG5YwAyIft0h4og3AX_uPeersVfMRS9jexuWv8SIeRoNSDJsjNTrs43ZgByfdNQeZ9q2ujf4acfpK1-XfL7DRaRI6nU2jROeMWV9EaJGpw7LFS_?></g></svg>