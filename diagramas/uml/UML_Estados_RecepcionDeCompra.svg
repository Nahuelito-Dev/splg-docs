troke-width:1.563;"/></g><g class="entity" data-qualified-name="GMN8" id="ent0009" data-source-line="12"><path d="M97.906,562.42 L97.906,649.914 A0,0 0 0 0 97.906,649.914 L545.857,649.914 A0,0 0 0 0 545.857,649.914 L545.857,578.045 L530.232,562.42 L290.109,562.42 L199.969,467.311 L277.609,562.42 L97.906,562.42 A0,0 0 0 0 97.906,562.42" style="stroke:#3C5F8F;stroke-width:0.781;" fill="#FFF"/><path d="M530.232,562.42 L530.232,578.045 L545.857,578.045 L530.232,562.42" style="stroke:#3C5F8F;stroke-width:0.781;" fill="#FFF"/><text x="107.281" y="584.888" fill="#000" font-size="15.625" textLength="357.811" font-family="Arial">La anulación registra los movimientos inversos y no</text><text x="107.281" y="602.856" fill="#000" font-size="15.625" textLength="363.098" font-family="Arial">borra nada. El pago al proveedor (impago o pagado,</text><text x="107.281" y="620.823" fill="#000" font-size="15.625" textLength="415.138" font-family="Arial">marcarPagoDeRecepcion) es otro atributo y no cambia este</text><text x="107.281" y="638.79" fill="#000" font-size="15.625" textLength="376.144" font-family="Arial">estado; una recepción anulada ya no cambia de pago.</text></g><!--link *start* to confirmed--><g class="link" data-entity-1="ent0003" data-entity-2="ent0001" id="lnk4" data-source-line="7" data-link-type="dependency"><path d="M173.438,97.295 C173.438,122.936 173.438,168.811 173.438,202.686" style="stroke:#1F3A5F;stroke-width:1.25;" fill="none" id="*start*-to-confirmed"/><polygon points="173.438,210.498,179.688,196.436,173.438,202.686,167.188,196.436,173.438,210.498" fill="#1F3A5F" style="stroke:#1F3A5F;stroke-width:1.25;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="175" y="159.888" fill="#1F3A5F" font-size="15.625" textLength="217.087" font-family="Arial">registrarRecepcionDeCompra()</text></g><!--link confirmed to voided--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="8" data-link-type="dependency"><path d="M173.438,273.8