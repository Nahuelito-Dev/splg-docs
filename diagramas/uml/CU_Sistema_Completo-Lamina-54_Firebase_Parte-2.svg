" data-y="585"><ellipse cx="821.0" cy="584.9" rx="140" ry="26.6" fill="#FFFFFF" stroke="#6B7683" stroke-width="1.0" stroke-dasharray="5 3"/><text x="821.0" y="571.7" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683" font-weight="bold">CU-220</text><text x="821.0" y="584.9" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">Descontar del Stock Físico</text><text x="821.0" y="598.1" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">lo Entregado (SS-08)</text></g><g class="actor" data-act="07" data-x="85" data-y="509"><circle cx="85.0" cy="508.8" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M85.0 517.8 V541.8 M70.0 525.8 H100.0 M85.0 541.8 L72.0 561.8 M85.0 541.8 L98.0 561.8" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="85.0" y="575.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">«sistema externo»</text><text x="85.0" y="589.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Firebase</text><text x="85.0" y="602.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-07)</text></g><g class="leyenda"><text x="235.0" y="1019.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: de la extensión al caso base (línea</text><text x="235.0" y="1033.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">discontinua).</text><text x="235.0" y="1049.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">ACT-05 especializa a ACT-03 (triángulo hueco); además, cada caso de uso lleva la asociación de todos los actores que el catálogo le asigna,</text><text x="235.0" y="1063.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">también la de ACT-05.</text><text x="235.0" y="1079.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Con relleno rosado, los casos de uso planificados.</text><text x="235.0" y="1095.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Con borde discontinuo, los casos de uso de otro diagrama, solo como referencia.</text></g></svg>