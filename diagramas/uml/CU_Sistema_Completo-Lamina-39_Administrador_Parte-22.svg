 L72.0 354.1 M85.0 334.1 L98.0 354.1" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="85.0" y="368.1" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Administrador</text><text x="85.0" y="381.3" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-03)</text></g><g class="leyenda"><text x="235.0" y="537.8" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»:</text><text x="235.0" y="551.8" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">de la extensión al caso base (línea discontinua).</text><text x="235.0" y="567.8" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">ACT-05 especializa a ACT-03 (triángulo hueco); además, cada caso de uso lleva la asociación de todos los</text><text x="235.0" y="581.8" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">actores que el catálogo le asigna, también la de ACT-05.</text><text x="235.0" y="597.8" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Con relleno rosado, los casos de uso planificados.</text></g></svg>