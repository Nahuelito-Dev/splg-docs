<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1184px;height:879px;background:#FFFFFF;" width="1184.375px" height="879.688px" viewBox="0 0 1184 879" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="352.089" y="32.469" fill="#000" font-size="21.875" textLength="470.43" font-weight="700" font-family="Helvetica">Diagrama de estados — Rendición del chofer</text></g><rect x="277.563" y="248.438" width="78.125" height="62.5" fill="#F4F7FA" style="stroke:#2C4257;stroke-width:0.781;" rx="19.531" ry="19.531"/><text x="286.921" y="275.375" fill="#000" font-size="18.75" textLength="59.409" font-family="Helvetica">Abierta</text><text x="286.921" y="294.125" fill="#000" font-size="18.75" textLength="54.199" font-family="Helvetica">(open)</text><rect x="260.859" y="445.313" width="111.526" height="62.5" fill="#F4F7FA" style="stroke:#2C4257;stroke-width:0.781;" rx="19.531" ry="19.531"/><text x="268.672" y="472.25" fill="#000" font-size="18.75" textLength="95.901" font-family="Helvetica">Presentada</text><text x="268.672" y="491" fill="#000" font-size="18.75" textLength="93.777" font-family="Helvetica">(submitted)</text><rect x="263.469" y="642.188" width="106.299" height="62.5" fill="#F4F7FA" style="stroke:#2C4257;stroke-width:0.781;" rx="19.531" ry="19.531"/><text x="271.281" y="669.125" fill="#000" font-size="18.75" textLength="81.317" font-family="Helvetica">Aprobada</text><text x="271.281" y="687.875" fill="#000" font-size="18.75" textLength="90.674" font-family="Helvetica">(approved)</text><g class="start_entity" data-qualified-name=".start." id="ent0004" data-source-line="23"><ellipse cx="316.625" cy="79.688" rx="15.625" ry="15.625" fill="#222" style="stroke:#222;stroke-width:1.563;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0012" data-source-line="30"><ellipse cx="96.313" cy="828.125" rx="17.188" ry="17.188" fill="none" style="stroke:#222;stroke-width:1.563;"/><ellipse cx="96.313" cy="828.125" rx="9.375" ry="9.375" fill="#222" style="stroke:#222;stroke-width:1.563;"/></g><g class="entity" data-qualified-name="GMN14" id="ent0015" data-source-line="33"><path d="M168.094,800 L168.094,856.25 A0,0 0 0 0 168.094,856.25 L908.918,856.25 A0,0 0 0 0 908.918,856.25 L908.918,815.625 L893.293,800 L504.922,800 L360.984,705.313 L492.422,800 L168.094,800 A0,0 0 0 0 168.094,800" style="stroke:#7A7340;stroke-width:0.781;" fill="#FBF7E6"/><path d="M893.293,800 L893.293,815.625 L908.918,815.625 L893.293,800" style="stroke:#7A7340;stroke-width:0.781;" fill="#FBF7E6"/><text x="177.469" y="823.454" fill="#000" font-size="20.313" textLength="708.012" font-family="Helvetica">La diferencia no es un estado: es un atributo de la rendición, con su resolución</text><text x="177.469" y="843.766" fill="#000" font-size="20.313" textLength="641.371" font-family="Helvetica">(absorbida o a cargo del chofer). Una rendición aprobada no se reabre.</text></g><!--link *start* to ABI--><g class="link" data-entity-1="ent0004" data-entity-2="ent0001" id="lnk5" data-source-line="23" data-link-type="dependency"><path d="M316.625,96.047 C316.625,128.234 316.625,197.359 316.625,240.203" style="stroke:#2C4257;stroke-width:1.563;" fill="none" id="*start*-to-ABI"/><polygon points="316.625,248.016,322.875,233.953,316.625,240.203,310.375,233.953,316.625,248.016" fill="#2C4257" style="stroke:#2C4257;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="318.188" y="158.188" fill="#000" font-size="18.75" textLength="449.222" font-family="Helvetica">when(23:30 de cada día) generarRendicionesDelDia()</text><text x="347.878" y="176.938" fill="#000" font-size="18.75" textLength="389.841" font-family="Helvetica">[el chofer no tiene una rendición abierta y tiene</text><text x="345.296" y="195.688" fill="#000" font-size="18.75" textLength="395.004" font-family="Helvetica">efectivo o cobros de cuenta corriente sin rendir]</text></g><!--link ABI to ABI--><g class="link" data-entity-1="ent0001" data-entity-2="ent0001" id="lnk6" data-source-line="24" data-link-type="dependency"><path d="M356.125,271.359 C383.453,268.844 410.375,271.609 410.375,279.688 C410.375,287.766 391.233,291.247 363.905,288.732" style="stroke:#2C4257;stroke-width:1.563;" fill="none" id="ABI-to-ABI"/><polygon points="356.125,288.016,369.555,295.528,363.905,288.732,370.701,283.081,356.125,288.016" fill="#2C4257" style="stroke:#2C4257;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="419.75" y="275.375" fill="#000" font-size="18.75" textLength="449.222" font-family="Helvetica">when(23:30 de cada día) generarRendicionesDelDia()</text><text x="421.833" y="294.125" fill="#000" font-size="18.75" textLength="445.056" font-family="Helvetica">[el chofer ya tiene una rendición abierta: se completa]</text></g><!--link ABI to ABI--><g class="link" data-entity-1="ent0001" data-entity-2="ent0001" id="lnk10" data-source-line="28" data-link-type="dependency"><path d="M356.266,271.453 C488.594,255.484 877.563,258.219 877.563,279.688 C877.563,301.156 496.35,304.827 364.022,288.858" style="stroke:#2C4257;stroke-width:1.563;" fill="none" id="ABI-to-ABI-1"/><polygon points="356.266,287.922,369.478,295.812,364.022,288.858,370.976,283.402,356.266,287.922" fill="#2C4257" style="stroke:#2C4257;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="886.938" y="275.375" fill="#000" font-size="18.75" textLength="265.796" font-family="Helvetica">when(08:00 de un día posterior)</text><text x="896.876" y="294.125" fill="#000" font-size="18.75" textLength="245.92" font-family="Helvetica">avisarRendicionesSinCerrar()</text></g><!--link ABI to PRE--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk7" data-source-line="25" data-link-type="dependency"><path d="M276.938,279.938 C219.062