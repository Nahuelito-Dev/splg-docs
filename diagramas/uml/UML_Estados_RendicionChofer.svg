137.953" y1="598.438" x2="434.999" y2="598.438" style="stroke:#2C4257;stroke-width:0.781;"/><text x="238.525" y="567.563" fill="#000" font-size="18.75" textLength="95.901" font-family="Helvetica">Presentada</text><text x="238.525" y="586.313" fill="#000" font-size="18.75" textLength="93.777" font-family="Helvetica">(submitted)</text><text x="145.766" y="620.688" fill="#000" font-size="18.75" textLength="265.796" font-family="Helvetica">when(08:00 de un día posterior)</text><text x="145.766" y="639.438" fill="#000" font-size="18.75" textLength="256.339" font-family="Helvetica">/ avisarRendicionesSinCerrar()</text></g><rect x="233.328" y="785.938" width="106.299" height="62.5" fill="#F4F7FA" style="stroke:#2C4257;stroke-width:0.781;" rx="19.531" ry="19.531"/><text x="241.141" y="812.875" fill="#000" font-size="18.75" textLength="81.317" font-family="Helvetica">Aprobada</text><text x="241.141" y="831.625" fill="#000" font-size="18.75" textLength="90.674" font-family="Helvetica">(approved)</text><g class="start_entity" data-qualified-name=".start." id="ent0004" data-source-line="23"><ellipse cx="286.484" cy="79.688" rx="15.625" ry="15.625" fill="#222" style="stroke:#222;stroke-width:1.563;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0009" data-source-line="30"><ellipse cx="66.172" cy="971.875" rx="17.188" ry="17.188" fill="none" style="stroke:#222;stroke-width:1.563;"/><ellipse cx="66.172" cy="971.875" rx="9.375" ry="9.375" fill="#222" style="stroke:#222;stroke-width:1.563;"/></g><g class="entity" data-qualified-name="GMN11" id="ent0012" data-source-line="33"><path d="M137.953,943.75 L137.953,1000 A0,0 0 0 0 137.953,1000 L878.777,1000 A0,0 0 0 0 878.777,1000 L878.777,959.375 L863.152,943.75 L474.781,943.75 L330.844,849.063 L462.281,943.75 L137.953,943.75 A0,0 0 0 0 137.953,943.75" style="stroke:#7A7340;stroke-width:0.781;" fill="#FBF7E6"/><path d="M863.152,943.75 L863.152,959.375 L878.777,959.375 L863.152,943.75" style="stroke:#7A7340;stroke-width:0.781;" fill="#FBF7E6"/><text x="147.328" y="967.204" fill="#000" font-size="20.313" textLength="708.012" font-family="Helvetica">La diferencia no es un estado: es un atributo de la rendición, con su resolución</text><text x="147.328" y="987.516" fill="#000" font-size="20.313" textLength="641.371" font-family="Helvetica">(absorbida o a cargo del chofer). Una rendición aprobada no se reabre.</text></g><!--link *start* to ABI--><g class="link" data-entity-1="ent0004" data-entity-2="ent0001" id="lnk5" data-source-line="23" data-link-type="dependency"><path d="M286.484,95.766 C286.484,128.047 286.484,199.844 286.484,258.938" style="stroke:#2C4257;stroke-width:1.563;" fill="none" id="*start*-to-ABI"/><polygon points="286.484,266.75,292.734,252.688,286.484,258.938,280.234,252.688,286.484,266.75" fill="#2C4257" style="stroke:#2C4257;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="381.829" y="158.188" fill="#000" font-size="18.75" textLength="207.44" font-family="Helvetica">when(23:30 de cada día)</text><text x="290.629" y="176.938" fill="#000" font-size="18.75" textLength="389.841" font-family="Helvetica">[el chofer no tiene una rendición abierta y tiene</text><text x="288.047" y="195.688" fill="#000" font-size="18.75" textLength="395.004" font-family="Helvetica">efectivo o cobros de cuenta corriente sin rendir]</text><text x="362.054" y="214.438" fill="#000" font-size="18.75" textLength="246.991" font-family="Helvetica">/ generarRendicionesDelDia()</text></g><!--link ABI to PRE--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-source-line="25" data-link-type="dependency"><path d="M61.406,411.656 C26.734,434.594 9.375,463.391 33.359,498.438 C57.719,534.047 89.646,554.143 130.068,568.643" style="stroke:#2C4257;stroke-width:1.563;" fill="none" id="ABI-to-PRE"/><polygon points="137.422,571.281,126.296,560.65,130.068,568.643,122.075,572.416,137.422,571.281" fill="#2C4257" style="stroke:#2C4257;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="34.922" y="473.813" fill="#000" font-size="18.75" textLength="432.513" font-family="Helvetica">declararEfectivoRendido(efectivoDeclarado, gastos)</text><text x="83.903" y="492.563" fill="#000" font-size="18.75" textLength="334.552" font-family="Helvetica">[la presenta el chofer o el administrador]</text></g><!--link PRE to ABI--><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" id="lnk7" data-source-line="26" data-link-type="dependency"><path d="M428.766,544.688 C446.75,532.234 462.766,517 473.984,498.438 C494.016,465.297 482.29,440.56 450.884,416.279" style="stroke:#2C4257;stroke-width:1.563;" fill="none" id="PRE-to-ABI"/><polygon points="444.703,411.5,452.006,425.046,450.884,416.279,459.651,415.157,444.703,411.5" fill="#2C4257" style="stroke:#2C4257;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="483.984" y="483.188" fill="#000" font-size="18.75" textLength="150.055" font-family="Helvetica">reabrirRendicion()</text></g><!--link PRE to APR--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk8" data-source-line="27" data-link-type="dependency"><path d="M286.484,652.203 C286.484,693.828 286.484,742.875 286.484,777.391" style="stroke:#2C4257;stroke-width:1.563;" fill="none" id="PRE-to-APR"/><polygon points="286.484,785.203,292.734,771.141,286.484,777.391,280.234,771.141,286.484,785.203" fill="#2C4257" style="stroke:#2C4257;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="288.047" y="714.438" fill="#000" font-size="18.75" textLength="478.372" font-family="Helvetica">aprobarRendicion(cajaDestinoId, resolucionDeDiferencia)</text><text x="415.191" y="733.188" fill="#000" font-size="18.75" textLength="224.084" font-family="Helvetica">[la diferencia está resuelta]</text></g><!--link APR to *end*--><g class="link" data-entity-1="ent0003" data-entity-2="ent0009" id="lnk10" data-source-line="30" data-link-type="dependency"><path d="M242.422,849.063 