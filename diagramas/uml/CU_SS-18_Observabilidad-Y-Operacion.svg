<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="737" viewBox="0 0 1160 737" font-family="Arial, Helvetica, sans-serif"><defs><marker id="abre" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#1F3A5F" stroke-width="1"/></marker><marker id="hueco" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1"/></marker><linearGradient id="vp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCE6F2"/><stop offset="1" stop-color="#C6DAF0"/></linearGradient></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="580.0" y="22.0" font-size="14" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">SS-18 — Observabilidad y Operación (4 casos de uso)</text><rect class="limite" data-x="150" data-y="44" data-w="974" data-h="575" x="150" y="44" width="974" height="575" fill="#FFFFFF" stroke="#3C5F8F" stroke-width="1.0"/><text x="637.0" y="62.0" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">Sistema de Pedidos y Logística de Garrafas de Gas (SPLG)</text><path class="asoc" data-act="03" data-cu="CU-152" data-rol="principal" d="M85.0 141.5 L190.0 111.4" fill="none" stroke="#1F3A5F" stroke-width="0.7" opacity="0.9"/><path class="asoc" data-act="03" data-cu="CU-172" data-rol="principal" d="M85.0 141.5 L190.0 162.4" fill="none" stroke="#1F3A5F" stroke-width="0.7" opacity="0.9"/><path class="asoc" data-act="03" data-cu="CU-173" data-rol="principal" d="M85.0 141.5 L190.0 219.6" fill="none" stroke="#1F3A5F" stroke-width="0.7" opacity="0.9"/><path class="asoc" data-act="05" data-cu="CU-152" data-rol="principal" d="M85.0 356.5 L190.0 111.4" fill="none" stroke="#1F3A5F" stroke-width="0.7" opacity="0.9"/><path class="asoc" data-act="05" data-cu="CU-172" data-rol="principal" d="M85.0 356.5 L190.0 162.4" fill="none" stroke="#1F3A5F" stroke-width="0.7" opacity="0.9"/><path class="asoc" data-act="05" data-cu="CU-173" data-rol="principal" d="M85.0 356.5 L190.0 219.6" fill="none" stroke="#1F3A5F" stroke-width="0.7" opacity="0.9"/><path class="asoc" data-act="09" data-cu="CU-104" data-rol="secundario" d="M85.0 490.5 L190.0 276.8" fill="none" stroke="#1F3A5F" stroke-width="0.7" opacity="0.9"/><g class="cu" data-cu="CU-152" data-x="365" data-y="111"><ellipse cx="365.0" cy="111.4" rx="175" ry="19.4" fill="url(#vp)" stroke="#3C5F8F" stroke-width="1.0"/><text x="365.0" y="104.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-152</text><text x="365.0" y="118.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Consultar el Registro de Auditoría</text></g><g class="cu" data-cu="CU-172" data-x="365" data-y="162"><ellipse cx="365.0" cy="162.4" rx="175" ry="25.6" fill="url(#vp)" stroke="#3C5F8F" stroke-width="1.0"/><text x="365.0" y="149.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-172</text><text x="365.0" y="162.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Configurar los Parámetros de un Proceso</text><text x="365.0" y="175.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Automático</text></g><g class="cu" data-cu="CU-173" data-x="365" data-y="220"><ellipse cx="365.0" cy="219.6" rx="175" ry="25.6" fill="url(#vp)" stroke="#3C5F8F" stroke-width="1.0"/><text x="365.0" y="206.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-173</text><text x="365.0" y="219.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Configurar la Frecuencia de las Tareas</text><text x="365.0" y="232.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Programadas</text></g><g class="cu" data-cu="CU-104" data-x="365" data-y="277"><ellipse cx="365.0" cy="276.8" rx="175" ry="25.6" fill="url(#vp)" stroke="#3C5F8F" stroke-width="1.0"/><text x="365.0" y="263.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-104</text><text x="365.0" y="276.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Verificar la Salud del Sistema (vida y</text><text x="365.0" y="290.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">disponibilidad)</text></g><g class="actor" data-act="03" data-x="70" data-y="124"><circle cx="70.0" cy="124.5" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 133.5 V157.5 M55.0 141.5 H85.0 M70.0 157.5 L57.0 177.5 M70.0 157.5 L83.0 177.5" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="191.5" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Administrador</text><text x="70.0" y="204.7" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-03)</text></g><g class="actor" data-act="05" data-x="70" data-y="339"><circle cx="70.0" cy="339.5" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 348.5 V372.5 M55.0 356.5 H85.0 M70.0 372.5 L57.0 392.5 M70.0 372.5 L83.0 392.5" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="406.5" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Administrador</text><text x="70.0" y="419.7" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">General</text><text x="70.0" y="432.9" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-05)</text></g><g class="actor" data-act="09" data-x="70" data-y="473"><circle cx="70.0" cy="473.5" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 482.5 V506.5 M55.0 490.5 H85.0 M70.0 506.5 L57.0 526.5 M70.0 506.5 L83.0 526.5" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="540.5" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">«sistema externo»</text><text x="70.0" y="553.7" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Plataforma de</text><text x="70.0" y="566.9" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">despliegue</text><text x="70.0" y="580.1" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-09)</text></g><path class="gen" data-esp="05" data-gen="03" d="M70 329.5 V231.5" fill="none" stroke="#1F3A5F" stroke-width="1" marker-end="url(#hueco)"/><text x="150.0" y="641.5" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Tres columnas: el actor, los casos de uso que inicia y, a la derecha, los casos relacionados con ellos por «include» o «extend».</text><text x="150.0" y="657.5" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: del caso que extiende al caso base (línea discontinua, con su punto de extensión</text><text x="150.0" y="671.5" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-n, que figura también en el compartimiento «puntos de extensión» del caso base).</text><text x="150.0" y="687.5" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Cada «include» y cada «extend» tiene su propio trazo, con el rótulo junto a su arranque. Con relleno rosado, los casos de uso planificados; con borde discontinuo, los casos de uso que no</text><text x="150.0" y="701.5" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">inicia el actor de este diagrama o que son de otro subsistema, solo como referencia.</text></svg>