idth="1.0"/><text x="411.0" y="307.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-300</text><text x="411.0" y="320.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Registrar el Cobro Impago</text><text x="411.0" y="334.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">como Administrador</text></g><g class="cu" data-cu="CU-301" data-x="411" data-y="377"><ellipse cx="411.0" cy="376.8" rx="140" ry="20.4" fill="url(#vp)" stroke="#3C5F8F" stroke-width="1.0"/><text x="411.0" y="370.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-301</text><text x="411.0" y="383.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Confirmar una Transferencia</text></g><g class="cu" data-cu="CU-008" data-x="821" data-y="149"><ellipse cx="821.0" cy="148.6" rx="140" ry="26.6" fill="#FFFFFF" stroke="#6B7683" stroke-width="1.0" stroke-dasharray="5 3"/><text x="821.0" y="135.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683" font-weight="bold">CU-008</text><text x="821.0" y="148.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">Cancelar un Pedido (Cliente)</text><text x="821.0" y="161.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">(SS-02)</text></g><g class="cu" data-cu="CU-010" data-x="821" data-y="211"><ellipse cx="821.0" cy="210.8" rx="140" ry="26.6" fill="#FFFFFF" stroke="#6B7683" stroke-width="1.0" stroke-dasharray="5 3"/><text x="821.0" y="197.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683" font-weight="bold">CU-010</text><text x="821.0" y="210.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">Cancelar un Pedido</text><text x="821.0" y="224.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">(Administrador) (SS-02)</text></g><g class="cu" data-cu="CU-149" data-x="821" data-y="273"><ellipse cx="821.0" cy="273.0" rx="140" ry="26.6" fill="#FFFFFF" stroke="#6B7683" stroke-width="1.0" stroke-dasharray="5 3"/><text x="821.0" y="259.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683" font-weight="bold">CU-149</text><text x="821.0" y="273.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">Despachar un Pedido Express</text><text x="821.0" y="286.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">a un Chofer en Moto (SS-03)</text></g><g class="actor" data-act="03" data-x="85" data-y="261"><circle cx="85.0" cy="261.1" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M85.0 270.1 V294.1 M70.0 278.1 H100.0 M85.0 294.1 L72.0 314.1 M85.0 294.1 L98.0 314.1" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="85.0" y="328.1" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Administrador</text><text x="85.0" y="341.3" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-03)</text></g><g class="leyenda"><text x="235.0" y="463.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: de la extensión al caso base (línea</text><text x="235.0" y="477.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">discontinua).</text><text x="235.0" y="493.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">ACT-05 especializa a ACT-03 (triángulo hueco); además, cada caso de uso lleva la asociación de todos los actores que el catálogo le asigna,</text><text x="235.0" y="507.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">también la de ACT-05.</text><text x="235.0" y="523.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Con relleno rosado, los casos de uso planificados.</text><text x="235.0" y="539.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Con borde discontinuo, los casos de uso de otro diagrama, solo como referencia.</text><text x="235.0" y="555.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-1 CU-168 extiende a CU-008: cuando el pedido cancelado tiene un pago aprobado por una pasarela</text><text x="235.0" y="570.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-2 CU-168 extiende a CU-010: cuando el pedido cancelado tiene un pago aprobado por una pasarela</text><text x="235.0" y="585.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-3 CU-168 extiende a CU-149: cuando el pedido express pasa a reparto común y ya estaba pagado en linea</text></g></svg>