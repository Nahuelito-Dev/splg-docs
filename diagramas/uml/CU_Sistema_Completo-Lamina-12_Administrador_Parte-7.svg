ke-dasharray="5 3"/><text x="917.0" y="351.5" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683" font-weight="bold">CU-250</text><text x="917.0" y="364.7" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">Aplicar un Movimiento de Stock (SS-08)</text></g><g class="cu" data-cu="CU-220" data-x="917" data-y="409"><ellipse cx="917.0" cy="409.1" rx="165" ry="25.6" fill="#FFFFFF" stroke="#6B7683" stroke-width="1.0" stroke-dasharray="5 3"/><text x="917.0" y="395.9" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683" font-weight="bold">CU-220</text><text x="917.0" y="409.1" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">Descontar del Stock Físico lo Entregado</text><text x="917.0" y="422.3" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">(SS-08)</text></g><g class="actor" data-act="03" data-x="70" data-y="540"><circle cx="70.0" cy="540.4" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 549.4 V573.4 M55.0 557.4 H85.0 M70.0 573.4 L57.0 593.4 M70.0 573.4 L83.0 593.4" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="607.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Administrador</text><text x="70.0" y="620.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-03)</text></g><text x="150.0" y="1096.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Tres columnas: el actor, los casos de uso que inicia y, a la derecha, los casos relacionados con ellos por «include» o «extend».</text><text x="150.0" y="1112.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: del caso que extiende al caso base (línea discontinua, con su punto de extensión PE-n,</text><text x="150.0" y="1126.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">que figura también en el compartimiento «puntos de extensión» del caso base).</text><text x="150.0" y="1142.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Cada «include» y cada «extend» tiene su propio trazo, con el rótulo junto a su arranque. Con relleno rosado, los casos de uso planificados; con borde discontinuo, los casos de uso que no inicia</text><text x="150.0" y="1156.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">el actor de este diagrama o que son de otro subsistema, solo como referencia.</text></svg>