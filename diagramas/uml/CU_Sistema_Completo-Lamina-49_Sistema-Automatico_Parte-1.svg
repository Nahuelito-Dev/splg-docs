dth="1.0"/><path d="M85.0 594.9 V618.9 M70.0 602.9 H100.0 M85.0 618.9 L72.0 638.9 M85.0 618.9 L98.0 638.9" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="85.0" y="652.9" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Sistema Automático</text><text x="85.0" y="666.1" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-04)</text></g><g class="leyenda"><text x="235.0" y="1121.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: de la extensión al caso base (línea</text><text x="235.0" y="1135.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">discontinua).</text><text x="235.0" y="1151.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">ACT-05 especializa a ACT-03 (triángulo hueco); además, cada caso de uso lleva la asociación de todos los actores que el catálogo le asigna,</text><text x="235.0" y="1165.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">también la de ACT-05.</text><text x="235.0" y="1181.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Con relleno rosado, los casos de uso planificados.</text><text x="235.0" y="1197.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Con borde discontinuo, los casos de uso de otro diagrama, solo como referencia.</text><text x="235.0" y="1213.2" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-1 CU-168 extiende a CU-149: cuando el pedido express pasa a reparto común y ya estaba pagado en linea</text></g></svg>