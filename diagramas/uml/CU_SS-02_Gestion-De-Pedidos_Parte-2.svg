 text-anchor="middle" dominant-baseline="central" fill="#000000">Chofer</text><text x="70.0" y="809.1" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-02)</text></g><g class="actor" data-act="03" data-x="70" data-y="863"><circle cx="70.0" cy="862.9" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 871.9 V895.9 M55.0 879.9 H85.0 M70.0 895.9 L57.0 915.9 M70.0 895.9 L83.0 915.9" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="929.9" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Administrador</text><text x="70.0" y="943.1" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-03)</text></g><g class="actor" data-act="05" data-x="70" data-y="1078"><circle cx="70.0" cy="1077.9" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 1086.9 V1110.9 M55.0 1094.9 H85.0 M70.0 1110.9 L57.0 1130.9 M70.0 1110.9 L83.0 1130.9" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="1144.9" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Administrador</text><text x="70.0" y="1158.1" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">General</text><text x="70.0" y="1171.3" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-05)</text></g><path class="gen" data-esp="05" data-gen="03" d="M70 1067.9 V969.9" fill="none" stroke="#1F3A5F" stroke-width="1" marker-end="url(#hueco)"/><text x="150.0" y="1245.9" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Tres columnas: el actor, los casos de uso que inicia y, a la derecha, los casos relacionados con ellos por «include» o «extend».</text><text x="150.0" y="1261.9" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: del caso que extiende al caso base (línea discontinua, con su punto de extensión</text><text x="150.0" y="1275.9" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-n, que figura también en el compartimiento «puntos de extensión» del caso base).</text><text x="150.0" y="1291.9" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Cada «include» y cada «extend» tiene su propio trazo, con el rótulo junto a su arranque. Con relleno rosado, los casos de uso planificados; con borde discontinuo, los casos de uso que no</text><text x="150.0" y="1305.9" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">inicia el actor de este diagrama o que son de otro subsistema, solo como referencia.</text><text x="150.0" y="1321.9" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-01 CU-143 extiende a CU-002: cuando el cliente declara cuánto gas consume por mes</text></svg>