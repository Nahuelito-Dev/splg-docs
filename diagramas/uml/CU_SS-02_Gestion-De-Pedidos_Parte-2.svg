" dominant-baseline="central" fill="#1F3A5F">actores que el catálogo le asigna, también la de ACT-05.</text><text x="235.0" y="1449.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Con relleno rosado, los casos de uso planificados.</text></g></svg>