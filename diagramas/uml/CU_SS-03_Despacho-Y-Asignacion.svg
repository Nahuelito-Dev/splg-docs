ministrador</text><text x="70.0" y="419.9" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">General</text><text x="70.0" y="433.1" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-05)</text></g><g class="actor" data-act="02" data-x="70" data-y="474"><circle cx="70.0" cy="473.7" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 482.7 V506.7 M55.0 490.7 H85.0 M70.0 506.7 L57.0 526.7 M70.0 506.7 L83.0 526.7" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="540.7" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Chofer</text><text x="70.0" y="553.9" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-02)</text></g><g class="actor" data-act="04" data-x="70" data-y="608"><circle cx="70.0" cy="607.7" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 616.7 V640.7 M55.0 624.7 H85.0 M70.0 640.7 L57.0 660.7 M70.0 640.7 L83.0 660.7" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="674.7" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Sistema Automático</text><text x="70.0" y="687.9" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-04)</text></g><g class="actor" data-act="07" data-x="70" data-y="742"><circle cx="70.0" cy="741.7" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 750.7 V774.7 M55.0 758.7 H85.0 M70.0 774.7 L57.0 794.7 M70.0 774.7 L83.0 794.7" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="808.7" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">«sistema externo»</text><text x="70.0" y="821.9" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Firebase</text><text x="70.0" y="835.1" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-07)</text></g><path class="gen" data-esp="05" data-gen="03" d="M70 329.7 V231.7" fill="none" stroke="#1F3A5F" stroke-width="1" marker-end="url(#hueco)"/><text x="150.0" y="909.7" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Tres columnas: el actor, los casos de uso que inicia y, a la derecha, los casos relacionados con ellos por «include» o «extend».</text><text x="150.0" y="925.7" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: del caso que extiende al caso base (línea discontinua, con su punto de extensión PE-n, que</text><text x="150.0" y="939.7" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">figura también en el compartimiento «puntos de extensión» del caso base).</text><text x="150.0" y="955.7" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Cada «include» y cada «extend» tiene su propio trazo, con el rótulo junto a su arranque. Con relleno rosado, los casos de uso planificados; con borde discontinuo, los casos de uso que no inicia el</text><text x="150.0" y="969.7" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">actor de este diagrama o que son de otro subsistema, solo como referencia.</text></svg>