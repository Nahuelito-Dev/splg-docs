" stroke-width="1.0"/><text x="365.0" y="398.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-154</text><text x="365.0" y="411.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Consultar el Listado de Franjas Horarias</text></g><g class="cu" data-cu="CU-005" data-x="889" data-y="200"><ellipse cx="889.0" cy="200.0" rx="165" ry="38.0" fill="#FFFFFF" stroke="#6B7683" stroke-width="1.0" stroke-dasharray="5 3"/><text x="889.0" y="173.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683" font-weight="bold">CU-005</text><text x="889.0" y="186.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">Crear un Pedido (SS-02)</text><path class="compartimiento" d="M724.0 200.0 H1054.0" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="889.0" y="213.2" font-size="10" text-anchor="middle" dominant-baseline="central" fill="#6B7683">puntos de extensión</text><text x="889.0" y="226.4" font-size="10" text-anchor="middle" dominant-baseline="central" fill="#6B7683" font-weight="bold">PE-02, PE-03</text></g><g class="actor" data-act="01" data-x="70" data-y="106"><circle cx="70.0" cy="106.2" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 115.2 V139.2 M55.0 123.2 H85.0 M70.0 139.2 L57.0 159.2 M70.0 139.2 L83.0 159.2" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="173.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Cliente</text><text x="70.0" y="186.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-01)</text></g><g class="actor" data-act="03" data-x="70" data-y="275"><circle cx="70.0" cy="275.4" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 284.4 V308.4 M55.0 292.4 H85.0 M70.0 308.4 L57.0 328.4 M70.0 308.4 L83.0 328.4" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="342.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Administrador</text><text x="70.0" y="355.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-03)</text></g><g class="actor" data-act="05" data-x="70" data-y="490"><circle cx="70.0" cy="490.4" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 499.4 V523.4 M55.0 507.4 H85.0 M70.0 523.4 L57.0 543.4 M70.0 523.4 L83.0 543.4" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="557.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Administrador</text><text x="70.0" y="570.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">General</text><text x="70.0" y="583.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-05)</text></g><path class="gen" data-esp="05" data-gen="03" d="M70 480.4 V382.4" fill="none" stroke="#1F3A5F" stroke-width="1" marker-end="url(#hueco)"/><text x="150.0" y="658.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Tres columnas: el actor, los casos de uso que inicia y, a la derecha, los casos relacionados con ellos por «include» o «extend».</text><text x="150.0" y="674.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: del caso que extiende al caso base (línea discontinua, con su punto de extensión</text><text x="150.0" y="688.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-n, que figura también en el compartimiento «puntos de extensión» del caso base).</text><text x="150.0" y="704.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Cada «include» y cada «extend» tiene su propio trazo, con el rótulo junto a su arranque. Con relleno rosado, los casos de uso planificados; con borde discontinuo, los casos de uso que no</text><text x="150.0" y="718.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">inicia el actor de este diagrama o que son de otro subsistema, solo como referencia.</text><text x="150.0" y="734.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-02 CU-044 extiende a CU-005: cuando el cliente quiere agendar la entrega en una franja horaria</text></svg>