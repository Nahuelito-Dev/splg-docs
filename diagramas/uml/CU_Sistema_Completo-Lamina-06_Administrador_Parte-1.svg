class="cu" data-cu="CU-169" data-x="903" data-y="533"><ellipse cx="903.0" cy="533.2" rx="165" ry="25.6" fill="#FFFFFF" stroke="#6B7683" stroke-width="1.0" stroke-dasharray="5 3"/><text x="903.0" y="520.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683" font-weight="bold">CU-169</text><text x="903.0" y="533.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">Registrar el Cambio de Estado de un</text><text x="903.0" y="546.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">Pedido (SS-02)</text></g><g class="cu" data-cu="CU-248" data-x="903" data-y="641"><ellipse cx="903.0" cy="641.4" rx="165" ry="25.6" fill="#FFFFFF" stroke="#6B7683" stroke-width="1.0" stroke-dasharray="5 3"/><text x="903.0" y="628.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683" font-weight="bold">CU-248</text><text x="903.0" y="641.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">Verificar la Carga de Camión Abierta del</text><text x="903.0" y="654.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">Chofer (SS-08)</text></g><g class="actor" data-act="03" data-x="70" data-y="452"><circle cx="70.0" cy="451.7" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 460.7 V484.7 M55.0 468.7 H85.0 M70.0 484.7 L57.0 504.7 M70.0 484.7 L83.0 504.7" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="518.7" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Administrador</text><text x="70.0" y="531.9" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-03)</text></g><text x="150.0" y="962.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Tres columnas: el actor, los casos de uso que inicia y, a la derecha, los casos relacionados con ellos por «include» o «extend».</text><text x="150.0" y="978.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: del caso que extiende al caso base (línea discontinua, con su punto de extensión PE-n,</text><text x="150.0" y="992.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">que figura también en el compartimiento «puntos de extensión» del caso base).</text><text x="150.0" y="1008.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Cada «include» y cada «extend» tiene su propio trazo, con el rótulo junto a su arranque. Con relleno rosado, los casos de uso planificados; con borde discontinuo, los casos de uso que no</text><text x="150.0" y="1022.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">inicia el actor de este diagrama o que son de otro subsistema, solo como referencia.</text><text x="150.0" y="1038.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-05 CU-168 extiende a CU-010: cuando el pedido cancelado tiene un pago aprobado por una pasarela</text></svg>