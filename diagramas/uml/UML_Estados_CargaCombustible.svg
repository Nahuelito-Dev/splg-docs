A5F;stroke-width:1.563;"/></g><g class="entity" data-qualified-name="GMN13" id="ent0014" data-source-line="17"><path d="M208.247,545.232 L208.247,650.694 A0,0 0 0 0 208.247,650.694 L651.003,650.694 A0,0 0 0 0 651.003,650.694 L651.003,560.857 L635.378,545.232 L392.576,545.232 L307.997,450.529 L380.076,545.232 L208.247,545.232 A0,0 0 0 0 208.247,545.232" style="stroke:#3C5F8F;stroke-width:0.781;" fill="#FFF"/><path d="M635.378,545.232 L635.378,560.857 L651.003,560.857 L635.378,545.232" style="stroke:#3C5F8F;stroke-width:0.781;" fill="#FFF"/><text x="217.622" y="567.701" fill="#000" font-size="15.625" textLength="350.021" font-family="Arial">La anomalía se decide al registrar la carga y no se</text><text x="217.622" y="585.668" fill="#000" font-size="15.625" textLength="388.229" font-family="Arial">recalcula al modificarla. Una carga anulada se conserva</text><text x="217.622" y="603.635" fill="#000" font-size="15.625" textLength="396.08" font-family="Arial">pero no cuenta en el consumo ni en el costo, y no admite</text><text x="217.622" y="621.603" fill="#000" font-size="15.625" textLength="409.943" font-family="Arial">cambios. El estado se deriva de la marca de anomalía y de</text><text x="217.622" y="639.57" fill="#000" font-size="15.625" textLength="373.512" font-family="Arial">la fecha de anulación (deletedAt); no es una columna.</text></g><!--link *start* to NORMAL--><g class="link" data-entity-1="ent0004" data-entity-2="ent0001" id="lnk5" data-source-line="8" data-link-type="dependency"><path d="M266.966,84.061 C216.326,88.623 59.56,105.686 29.622,143.67 C14.419,162.967 20.826,183.238 33.608,203.8" style="stroke:#1F3A5F;stroke-width:1.25;" fill="none" id="*start*-to-NORMAL"/><polygon points="37.732,210.436,35.616,195.193,33.608,203.8,25,201.792,37.732,210.436" fill="#1F3A5F" style="stroke:#1F3A5F;stroke-width:1.25;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="31.185" y="159.888" fill="#1F3A5F" font-size="15.625" textLength="434.12" font-family="Arial">r