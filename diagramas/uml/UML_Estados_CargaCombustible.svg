<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:1118px;height:687px;background:#FFFFFF;" width="1118.75px" height="687.5px" viewBox="0 0 1118 687" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="220.292" y="32.469" fill="#000" font-size="21.875" textLength="668.565" font-weight="700" font-family="Helvetica">Diagrama de estados — Carga de combustible (planificado, I-12)</text></g><rect x="35.484" y="210.938" width="78.125" height="62.5" fill="#F4F7FA" style="stroke:#2C4257;stroke-width:0.781;" rx="19.531" ry="19.531"/><text x="44.334" y="247.25" fill="#000" font-size="18.75" textLength="60.425" font-family="Helvetica">Normal</text><rect x="550.031" y="210.938" width="89.627" height="62.5" fill="#F4F7FA" style="stroke:#2C4257;stroke-width:0.781;" rx="19.531" ry="19.531"/><text x="557.844" y="247.25" fill="#000" font-size="18.75" textLength="74.002" font-family="Helvetica">Anómala</text><rect x="280.766" y="389.063" width="84.436" height="62.5" fill="#F4F7FA" style="stroke:#2C4257;stroke-width:0.781;" rx="19.531" ry="19.531"/><text x="288.578" y="425.375" fill="#000" font-size="18.75" textLength="68.811" font-family="Helvetica">Anulada</text><g class="start_entity" data-qualified-name=".start." id="ent0004" data-source-line="23"><ellipse cx="322.984" cy="79.688" rx="15.625" ry="15.625" fill="#222" style="stroke:#222;stroke-width:1.563;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0011" data-source-line="29"><ellipse cx="146.422" cy="605.469" rx="17.188" ry="17.188" fill="none" style="stroke:#222;stroke-width:1.563;"/><ellipse cx="146.422" cy="605.469" rx="9.375" ry="9.375" fill="#222" style="stroke:#222;stroke-width:1.563;"/></g><g class="entity" data-qualified-name="GMN13" id="ent0014" data-source-line="32"><path d="M218.234,546.875 L218.234,664.063 A0,0 0 0 0 218.234,664.063 L783.972,664.063 A0,0 0 0 0 783.972,664.063 L783.972,562.5 L768.347,546.875 L451.484,546.875 L352.797,452.344 L438.984,546.875 L218.234,546.875 A0,0 0 0 0 218.234,546.875" style="stroke:#7A7340;stroke-width:0.781;" fill="#FBF7E6"/><path d="M768.347,546.875 L768.347,562.5 L783.972,562.5 L768.347,546.875" style="stroke:#7A7340;stroke-width:0.781;" fill="#FBF7E6"/><text x="227.609" y="570.329" fill="#000" font-size="20.313" textLength="455.028" font-family="Helvetica">La anomalía se decide al registrar la carga y no se</text><text x="227.609" y="590.641" fill="#000" font-size="20.313" textLength="504.698" font-family="Helvetica">recalcula al modificarla. Una carga anulada se conserva</text><text x="227.609" y="610.954" fill="#000" font-size="20.313" textLength="514.904" font-family="Helvetica">pero no cuenta en el consumo ni en el costo, y no admite</text><text x="227.609" y="631.266" fill="#000" font-size="20.313" textLength="532.925" font-family="Helvetica">cambios. El estado se deriva de la marca de anomalía y de</text><text x="227.609" y="651.579" fill="#000" font-size="20.313" textLength="485.566" font-family="Helvetica">la fecha de anulación (deletedAt); no es una columna.</text></g><!--link *start* to NORMAL--><g class="link" data-entity-1="ent0004" data-entity-2="ent0001" id="lnk5" data-source-line="23" data-link-type="dependency"><path d="M306.922,81.984 C250.406,84.922 62.187,97.953 26.109,142.188 C9.375,162.703 19.98,184.063 37.839,204.688" style="stroke:#2C4257;stroke-width:1.563;" fill="none" id="*start*-to-NORMAL"/><polygon points="42.953,210.594,38.473,195.872,37.839,204.688,29.023,204.054,42.953,210.594" fill="#2C4257" style="stroke:#2C4257;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="27.672" y="158.188" fill="#000" font-size="18.75" textLength="520.944" font-family="Helvetica">registrarCargaDeCombustible(vehículo, datos) [desvío ≤ 25 %]</text></g><!--link *start* to ANOMALA--><g class="link" data-entity-1="ent0004" data-entity-2="ent0002" id="lnk6" data-source-line="24" data-link-type="dependency"><path d="M338.781,80.781 C379.859,80.453 491.344,85.141 555.797,142.188 C575.484,159.609 583.658,180.656 588.549,202.578" style="stroke:#2C4257;stroke-width:1.563;" fill="none" id="*start*-to-ANOMALA"/><polygon points="590.25,210.203,593.288,195.117,588.549,202.578,581.088,197.839,590.25,210.203" fill="#2C4257" style="stroke:#2C4257;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="573.484" y="158.188" fill="#000" font-size="18.75" textLength="521.603" font-family="Helvetica">registrarCargaDeCombustible(vehículo, datos) [desvío > 25 %]</text></g><!--link NORMAL to NORMAL--><g class="link" data-entity-1="ent0001" data-entity-2="ent0001" id="lnk7" data-source-line="25" data-link-type="dependency"><path d="M114.031,227.125 C141.375,222.547 168.297,227.578 168.297,242.188 C168.297,256.797 149.08,263.118 121.736,258.54" style="stroke:#2C4257;stroke-width:1.563;" fill="none" id="NORMAL-to-NORMAL"/><polygon points="114.031,257.25,126.869,265.736,121.736,258.54,128.933,253.408,114.031,257.25" fill="#2C4257" style="stroke:#2C4257;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="177.672" y="247.25" fill="#000" font-size="18.75" textLength="313.669" font-family="Helvetica">modificarCargaDeCombustible(datos)</text></g><!--link ANOMALA to ANOMALA--><g class="link" data-entity-1="ent0002" data-entity-2="ent0002" id="lnk8" data-source-line="26" data-link-type="dependency"><path d="M640.391,226.594 C668.109,222.984 694.359,228.188 694.359,242.188 C694.359,256.187 675.856,262.399 648.138,258.79" style="stroke:#2C4257;stroke-width:1.563;" fill="none" id="ANOMALA-to-ANOMALA"/><polygon points="640.391,257.781,653.528,265.795,648.138,258.79,655.142,253.399,640.391,257.781" fill="#2C4257" style="stroke:#2C4257;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="703.734" y="247.25