<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:2037px;height:967px;background:#FFFFFF;" width="2037.5px" height="967.188px" viewBox="0 0 2037 967" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="795.692" y="32.469" fill="#000" font-size="21.875" textLength="435.204" font-weight="700" font-family="Helvetica">Diagrama de estados — Orden de compra</text></g><rect x="1108.578" y="210.938" width="88.574" height="62.5" fill="#F4F7FA" style="stroke:#2C4257;stroke-width:0.781;" rx="19.531" ry="19.531"/><text x="1116.391" y="237.875" fill="#000" font-size="18.75" textLength="72.949" font-family="Helvetica">Borrador</text><text x="1116.391" y="256.625" fill="#000" font-size="18.75" textLength="50.006" font-family="Helvetica">(draft)</text><rect x="828.359" y="389.063" width="83.383" height="62.5" fill="#F4F7FA" style="stroke:#2C4257;stroke-width:0.781;" rx="19.531" ry="19.531"/><text x="836.172" y="416" fill="#000" font-size="18.75" textLength="67.758" font-family="Helvetica">Enviada</text><text x="836.172" y="434.75" fill="#000" font-size="18.75" textLength="47.928" font-family="Helvetica">(sent)</text><g class="entity" data-qualified-name="partial" id="ent0003" data-source-line="21"><rect x="410.547" y="585.938" width="506.509" height="106.25" fill="#F4F7FA" style="stroke:#2C4257;stroke-width:0.781;" rx="19.531" ry="19.531"/><line x1="410.547" y1="639.063" x2="917.056" y2="639.063" style="stroke:#2C4257;stroke-width:0.781;"/><text x="573.654" y="608.188" fill="#000" font-size="18.75" textLength="180.295" font-family="Helvetica">Parcialmente recibida</text><text x="573.654" y="626.938" fill="#000" font-size="18.75" textLength="158.395" font-family="Helvetica">(partially_received)</text><text x="418.359" y="661.313" fill="#000" font-size