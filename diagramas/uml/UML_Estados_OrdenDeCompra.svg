2014.087,842.188 L1998.462,826.563" style="stroke:#7A7340;stroke-width:0.781;" fill="#FBF7E6"/><text x="1344.766" y="850.016" fill="#000" font-size="20.313" textLength="645.864" font-family="Helvetica">Una orden con recepciones no se cancela: primero se anula lo recibido.</text><text x="1344.766" y="870.329" fill="#000" font-size="20.313" textLength="526.221" font-family="Helvetica">«Recibida» no es final: anular una recepción la devuelve a</text><text x="1344.766" y="890.641" fill="#000" font-size="20.313" textLength="645.884" font-family="Helvetica">«Parcialmente recibida» o «Enviada». La compra sin orden no pasa por</text><text x="1344.766" y="910.954" fill="#000" font-size="20.313" textLength="624.451" font-family="Helvetica">este diagrama. Una orden enviada cuya fecha esperada venció sigue</text><text x="1344.766" y="931.266" fill="#000" font-size="20.313" textLength="350.034" font-family="Helvetica">enviada; sólo figura en el correo diario.</text></g><!--link *start* to draft--><g class="link" data-entity-1="ent0006" data-entity-2="ent0001" id="lnk7" data-source-line="25" data-link-type="dependency"><path d="M1152.859,95.953 C1152.859,121.844 1152.859,168.25 1152.859,202.453" style="stroke:#2C4257;stroke-width:1.563;" fill="none" id="*start*-to-draft"/><polygon points="1152.859,210.266,1159.109,196.203,1152.859,202.453,1146.609,196.203,1152.859,210.266" fill="#2C4257" style="stroke:#2C4257;stroke-width:1.563;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1154.422" y="158.188" fill="#000" font-size="18.75" textLength="201.086" font-family="Helvetica">emitirOrdenDeCompra()</text></g><!--link draft to sent--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk8" data-source-line="26" data-link-type="dependency"><path d="M1108.047,271.484 C1054.313,304.734 971.581,355.92 918.987,388.467" style="stroke:#2C4257;stroke-width:1.563;" fill="none" id="draft-to-sent"/><polygon points="912.344,392.578,927.591,390.493,918.987,388.467,921.013,379.