.</text></g><!--link *start* to draft--><g class="link" data-entity-1="ent0007" data-entity-2="ent0001" id="lnk8" data-source-line="11" data-link-type="dependency"><path d="M1093.859,97.295 C1093.859,122.936 1093.859,168.795 1093.859,202.67" style="stroke:#1F3A5F;stroke-width:1.25;" fill="none" id="*start*-to-draft"/><polygon points="1093.859,210.482,1100.109,196.42,1093.859,202.67,1087.609,196.42,1093.859,210.482" fill="#1F3A5F" style="stroke:#1F3A5F;stroke-width:1.25;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1095.422" y="159.888" fill="#1F3A5F" font-size="15.625" textLength="167.572" font-family="Arial">emitirOrdenDeCompra()</text></g><!--link draft to draft--><g class="link" data-entity-1="ent0001" data-entity-2="ent0001" id="lnk9" data-source-line="12" data-link-type="dependency"><path d="M1135.766,226.936 C1163.219,222.826 1189.781,227.889 1189.781,242.107 C1189.781,256.326 1170.945,262.545 1143.492,258.436" style="stroke:#1F3A5F;stroke-width:1.25;" fill="none" id="draft-to-draft"/><polygon points="1135.766,257.279,1148.748,265.542,1143.492,258.436,1150.598,253.18,1135.766,257.279" fill="#1F3A5F" style="stroke:#1F3A5F;stroke-width:1.25;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="1199.156" y="248.17" fill="#1F3A5F" font-size="15.625" textLength="192.764" font-family="Arial">modificarOrdenDeCompra()</text></g><!--link draft to sent--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk10" data-source-line="13" data-link-type="dependency"><path d="M1052.328,264.248 C984.25,297.982 856.797,361.139 790.172,394.154" style="stroke:#1F3A5F;stroke-width:1.25;" fill="none" id="draft-to-sent"/><polygon points="783.172,397.623,798.547,396.979,790.172,394.154,792.997,385.779,783.172,397.623" fill="#1F3A5F" style="stroke:#1F3A5F;stroke-width:1.25;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="930.906" y="336.451" fill="#1F3A5F" font-size="15.625" textLength="171.936" font-family="Arial">enviarOrdenDeCompra()</text></g><!--li