-size="18.75" textLength="434.546" font-family="Helvetica">registrarRecepcionDeCompra() [todavía falta recibir]</text><text x="751.453" y="680.063" fill="#000" font-size="18.75" textLength="475.259" font-family="Helvetica">anularRecepcionDeCompra() [quedan otras recepciones]</text></g><rect x="438.031" y="864.063" width="98.984" height="62.5" fill="#F4F7FA" style="stroke:#2C4257;stroke-width:0.781;" rx="19.531" ry="19.531"/><text x="445.844" y="891" fill="#000" font-size="18.75" textLength="72.958" font-family="Helvetica">Recibida</text><text x="445.844" y="909.75" fill="#000" font-size="18.75" textLength="83.359" font-family="Helvetica">(received)</text><rect x="1066.641" y="864.063" width="185.519" height="62.5" fill="#F4F7FA" style="stroke:#2C4257;stroke-width:0.781;" rx="19.531" ry="19.531"/><text x="1074.453" y="891" fill="#000" font-size="18.75" textLength="169.894" font-family="Helvetica">Cerrada con faltante</text><text x="1074.453" y="909.75" fill="#000" font-size="18.75" textLength="118.799" font-family="Helvetica">(closed_short)</text><rect x="1601.047" y="607.813" width="107.333" height="62.5" fill="#F4F7FA" style="stroke:#2C4257;stroke-width:0.781;" rx="19.531" ry="19.531"/><text x="1608.859" y="634.75" fill="#000" font-size="18.75" textLength="89.648" font-family="Helvetica">Cancelada</text><text x="1608.859" y="653.5" fill="#000" font-size="18.75" textLength="91.708" font-family="Helvetica">(cancelled)</text><g class="start_entity" data-qualified-name=".start." id="ent0007" data-source-line="26"><ellipse cx="1248.453" cy="79.688" rx="15.625" ry="15.625" fill="#222" style="stroke:#222;stroke-width:1.563;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0020" data-source-line="40"><ellipse cx="1621.891" cy="1076.563" rx="17.188" ry="17.188" fill="none" style="stroke:#222;stroke-width:1.563;"/><ellipse cx="1621.891" cy="1076.563" rx="9.375" ry="9.375" fill="#222" style="stroke:#222;stroke-width:1.563;"/></g><g class="entity" data-qualified-name="GMN23" id="ent0024" data-source-line="44"><path d="M1306.891,826.563 L1306.891,964.063 A0,0 0 0 0 1306.891,964.063 L2002.537,964.063 A0,0 0 0 0 2002.537,964.063 L2002.537,842.188 L1986.912,826.563 L1660.953,826.563 L1654.703,670.656 L1648.453,826.563 L1306.891,826.563 A0,0 0 0 0 1306.891,826.563" style="stroke:#7A7340;stroke-width:0.781;" fill="#FBF7E6"/><path d="M1986.912,826.563 L1986.912,842.188 L2002.537,842.188 L1986.912,826.563" style="stroke:#7A7340;stroke-width:0.781;" fill="#FBF7E6"/><text x="1316.266" y="850.016" fill="#000" font-size="20.313" textLength="662.834" font-family="Helvetica">Una orden con recepciones confirmadas, aunque sean sólo de vacíos, no</text><text x="1316.266" y="870.329" fill="#000" font-size="20.313" textLength="650.377" font-family="Helvetica">se cancela: primero se anulan o se cierra con faltante. «Recibida» no es</text><text x="1316.266" y="890.641" fill="#000" font-size="20.313" textLength="604.108" font-family="Helvetica">final: anular una recepción la devuelve a «Parcialmente recibida» o</text><text x="1316.266" y="910.954" fill="#000" font-size="20.313" textLength="652.718" font-family="Helvetica">«Enviada». Anular una recepción de una orden cancelada o cerrada con</text><text x="1316.266" y="931.266" fill="#000" font-size="20.313" textLength="628.954" font-family="Helvetica">faltante no le cambia el estado. La compra sin orden no pasa por este</text><text x="1316.266" y="951.579" fill="#000" font-size="20.313" textLength="329.711" font-family="Helvetica">diagrama. Sólo se edita en borrador.</text></g><!--link *start* to draft--><g class="link" data-entity-1="ent0007" data-entity-2="ent0001" id="lnk8" data-source-line="26" data-link-type="dependency"><path d="M1248.453,95.953 C1248.453,121.844 1248.453,168.25 1248.453,202.453" style="stroke:#2C4257;stroke-width:1.563;" fill="none" id="*start*-to-draft"/><polygon points="1248.453,210.266,1254.703,196.203,1248.453,202.453,1242.203,196.203,1248.453,210.266" fill="#2C4257" s