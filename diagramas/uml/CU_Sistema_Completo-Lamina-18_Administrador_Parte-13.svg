ipal" d="M76.0 265.5 L190.0 315.4" fill="none" stroke="#1F3A5F" stroke-width="0.7" opacity="0.9"/><path class="asoc" data-act="03" data-cu="CU-340" data-rol="principal" d="M76.0 265.5 L190.0 360.2" fill="none" stroke="#1F3A5F" stroke-width="0.7" opacity="0.9"/><path class="asoc" data-act="03" data-cu="CU-347" data-rol="principal" d="M83.0 276.5 L190.0 405.0" fill="none" stroke="#1F3A5F" stroke-width="0.7" opacity="0.9"/><g class="cu" data-cu="CU-330" data-x="365" data-y="111"><ellipse cx="365.0" cy="111.4" rx="175" ry="19.4" fill="url(#vp)" stroke="#3C5F8F" stroke-width="1.0"/><text x="365.0" y="104.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-330</text><text x="365.0" y="118.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Reabrir la Rendición del Chofer</text></g><g class="cu" data-cu="CU-331" data-x="365" data-y="162"><ellipse cx="365.0" cy="162.4" rx="175" ry="25.6" fill="url(#vp)" stroke="#3C5F8F" stroke-width="1.0"/><text x="365.0" y="149.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-331</text><text x="365.0" y="162.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Modificar la Cuenta Corriente de un</text><text x="365.0" y="175.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Cliente</text></g><g class="cu" data-cu="CU-333" data-x="365" data-y="220"><ellipse cx="365.0" cy="219.6" rx="175" ry="25.6" fill="url(#vp)" stroke="#3C5F8F" stroke-width="1.0"/><text x="365.0" y="206.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-333</text><text x="365.0" y="219.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Modificar una Regla de Comisión por</text><text x="365.0" y="232.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Entrega</text></g><g class="cu" data-cu="CU-334" data-x="365" data-y="271"><ellipse cx="365.0" cy="270.6" rx="175" ry="19.4" fill="url(#vp)" stroke="#3C5F8F" stroke-width="1.0"/><text x="365.0" y="264.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-334</text><text x="365.0" y="277.2" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Aprobar una Liquidación de Comisiones</text></g><g class="cu" data-cu="CU-335" data-x="365" data-y="315"><ellipse cx="365.0" cy="315.4" rx="175" ry="19.4" fill="url(#vp)" stroke="#3C5F8F" stroke-width="1.0"/><text x="365.0" y="308.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-335</text><text x="365.0" y="322.0" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Anular una Liquidación de Comisiones</text></g><g class="cu" data-cu="CU-340" data-x="365" data-y="360"><ellipse cx="365.0" cy="360.2" rx="175" ry="19.4" fill="url(#vp)" stroke="#3C5F8F" stroke-width="1.0"/><text x="365.0" y="353.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-340</text><text x="365.0" y="366.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Consultar los Movimientos de Caja</text></g><g class="cu" data-cu="CU-347" data-x="365" data-y="405"><ellipse cx="365.0" cy="405.0" rx="175" ry="19.4" fill="url(#vp)" stroke="#3C5F8F" stroke-width="1.0"/><text x="365.0" y="398.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-347</text><text x="365.0" y="411.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Anular el Pago de una Liquidación</text></g><g class="actor" data-act="03" data-x="70" data-y="224"><circle cx="70.0" cy="223.5" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 232.5 V256.5 M55.0 240.5 H85.0 M70.0 256.5 L57.0 276.5 M70.0 256.5 L83.0 276.5" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="290.5" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Administrador</text><text x="70.0" y="303.7" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-03)</text></g><text x="150.0" y="464.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Tres columnas: el actor, los casos de uso que inicia y, a la derecha, los casos relacionados con ellos por «include» o «extend».</text><text x="150.0" y="480.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: del caso que extiende al caso base (línea discontinua, con su punto de extensión</text><text x="150.0" y="494.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-n, que figura también en el compartimiento «puntos de extensión» del caso base).</text><text x="150.0" y="510.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Cada «include» y cada «extend» tiene su propio trazo, con el rótulo junto a su arranque. Con relleno rosado, los casos de uso planificados; con borde discontinuo, los casos de uso que no</text><text x="150.0" y="524.4" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">inicia el actor de este diagrama o que son de otro subsistema, solo como referencia.</text></svg>