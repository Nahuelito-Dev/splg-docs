erecha, los casos relacionados con ellos por «include» o «extend».</text><text x="150.0" y="881.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: del caso que extiende al caso base (línea discontinua, con su punto de extensión PE-n,</text><text x="150.0" y="895.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">que figura también en el compartimiento «puntos de extensión» del caso base).</text><text x="150.0" y="911.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Cada «include» y cada «extend» tiene su propio trazo, con el rótulo junto a su arranque. Con relleno rosado, los casos de uso planificados; con borde discontinuo, los casos de uso que no inicia</text><text x="150.0" y="925.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">el actor de este diagrama o que son de otro subsistema, solo como referencia.</text><text x="150.0" y="941.0" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-08 CU-135 extiende a CU-068: cuando el envase que se va a asignar está vencido</text></svg>