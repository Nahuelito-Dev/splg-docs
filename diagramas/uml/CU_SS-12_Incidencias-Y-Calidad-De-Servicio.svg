ze="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-01)</text></g><g class="actor" data-act="02" data-x="70" data-y="231"><circle cx="70.0" cy="230.9" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 239.9 V263.9 M55.0 247.9 H85.0 M70.0 263.9 L57.0 283.9 M70.0 263.9 L83.0 283.9" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="297.9" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Chofer</text><text x="70.0" y="311.1" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-02)</text></g><g class="actor" data-act="03" data-x="70" data-y="365"><circle cx="70.0" cy="364.9" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 373.9 V397.9 M55.0 381.9 H85.0 M70.0 397.9 L57.0 417.9 M70.0 397.9 L83.0 417.9" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="431.9" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Administrador</text><text x="70.0" y="445.1" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-03)</text></g><g class="actor" data-act="05" data-x="70" data-y="580"><circle cx="70.0" cy="579.9" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M70.0 588.9 V612.9 M55.0 596.9 H85.0 M70.0 612.9 L57.0 632.9 M70.0 612.9 L83.0 632.9" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="70.0" y="646.9" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Administrador</text><text x="70.0" y="660.1" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">General</text><text x="70.0" y="673.3" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-05)</text></g><path class="gen" data-esp="05" data-gen="03" d="M70 569.9 V471.9" fill="none" stroke="#1F3A5F" stroke-width="1" marker-end="url(#hueco)"/><text x="150.0" y="747.9" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Tres columnas: el actor, los casos de uso que inicia y, a la derecha, los casos relacionados con ellos por «include» o «extend».</text><text x="150.0" y="763.9" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: del caso que extiende al caso base (línea discontinua, con su punto de extensión</text><text x="150.0" y="777.9" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">PE-n, que figura también en el compartimiento «puntos de extensión» del caso base).</text><text x="150.0" y="793.9" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Cada «include» y cada «extend» tiene su propio trazo, con el rótulo junto a su arranque. Con relleno rosado, los casos de uso planificados; con borde discontinuo, los casos de uso que no</text><text x="150.0" y="807.9" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">inicia el actor de este diagrama o que son de otro subsistema, solo como referencia.</text></svg>