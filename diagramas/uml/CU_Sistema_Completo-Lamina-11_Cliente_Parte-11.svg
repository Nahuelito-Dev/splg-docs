<svg xmlns="http://www.w3.org/2000/svg" width="1021" height="397" viewBox="0 0 1021 397" font-family="Arial, Helvetica, sans-serif"><defs><marker id="abre" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#1F3A5F" stroke-width="1"/></marker><marker id="hueco" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1 1 L11 6 L1 11 Z" fill="#FFFFFF" stroke="#1F3A5F" stroke-width="1"/></marker><linearGradient id="vp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DCE6F2"/><stop offset="1" stop-color="#C6DAF0"/></linearGradient></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="510.5" y="22.0" font-size="14" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">Diagrama de casos de uso — Cliente (ACT-01) — parte 11 de 13 · 1 casos de uso</text><rect class="limite" data-x="235" data-y="52" data-w="756" data-h="172" x="235" y="52" width="756" height="172" fill="#FFFFFF" stroke="#3C5F8F" stroke-width="1.0"/><text x="613.0" y="72.0" font-size="12" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">Sistema de Pedidos y Logística de Garrafas de Gas (SPLG)</text><g class="paquete" data-pq="SS-15" data-n="1"><rect x="245" y="86" width="316" height="107" fill="#F4F8FC" stroke="#3C5F8F" stroke-width="1.0"/><text x="255.0" y="100.0" font-size="11" text-anchor="start" dominant-baseline="central" fill="#1F3A5F" font-weight="bold">SS-15 Reservas Programadas</text></g><path class="asoc" data-act="01" data-cu="CU-072" data-rol="principal" d="M109.0 176.6 L271.0 146.6" fill="none" stroke="#1F3A5F" stroke-width="0.8" opacity="0.85"/><path class="rel" data-tipo="include" data-desde="CU-072" data-hasta="CU-169" d="M551.0 146.6 C616.0 146.6 616.0 148.6 681.0 148.6" fill="none" stroke="#1F3A5F" stroke-width="0.8" stroke-dasharray="6 3" marker-end="url(#abre)"/><rect x="667" y="86" width="308" height="108" fill="none" stroke="#6B7683" stroke-width="1.0" stroke-dasharray="5 3"/><text x="821.0" y="95.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683" font-weight="bold">Casos de uso de otros actores</text><text x="821.0" y="108.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683" font-weight="bold">(solo como referencia)</text><g class="etiqueta" data-tipo="include" data-hasta="CU-169"><rect x="608.8" y="135.6" width="56.4" height="14" fill="#FFFFFF"/><text x="637.0" y="142.6" font-size="10" text-anchor="middle" dominant-baseline="central" fill="#1F3A5F">«include»</text></g><g class="cu" data-cu="CU-072" data-x="411" data-y="147"><ellipse cx="411.0" cy="146.6" rx="140" ry="26.6" fill="url(#vp)" stroke="#3C5F8F" stroke-width="1.0"/><text x="411.0" y="133.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000" font-weight="bold">CU-072</text><text x="411.0" y="146.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Crear una Reserva Programada</text><text x="411.0" y="159.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">con Seña</text></g><g class="cu" data-cu="CU-169" data-x="821" data-y="149"><ellipse cx="821.0" cy="148.6" rx="140" ry="26.6" fill="#FFFFFF" stroke="#6B7683" stroke-width="1.0" stroke-dasharray="5 3"/><text x="821.0" y="135.4" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683" font-weight="bold">CU-169</text><text x="821.0" y="148.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">Registrar el Cambio de</text><text x="821.0" y="161.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#6B7683">Estado de un Pedido (SS-02)</text></g><g class="actor" data-act="01" data-x="85" data-y="147"><circle cx="85.0" cy="146.6" r="9" fill="#DCE6F2" stroke="#3C5F8F" stroke-width="1.0"/><path d="M85.0 155.6 V179.6 M70.0 163.6 H100.0 M85.0 179.6 L72.0 199.6 M85.0 179.6 L98.0 199.6" stroke="#3C5F8F" stroke-width="1.0" fill="none"/><text x="85.0" y="213.6" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">Cliente</text><text x="85.0" y="226.8" font-size="11" text-anchor="middle" dominant-baseline="central" fill="#000000">(ACT-01)</text></g><g class="leyenda"><text x="235.0" y="288.6" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Asociación actor–caso de uso: línea continua sin punta · «include»: del caso base al incluido · «extend»: de la extensión al caso base (línea</text><text x="235.0" y="302.6" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">discontinua).</text><text x="235.0" y="318.6" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">ACT-05 especializa a ACT-03 (triángulo hueco); además, cada caso de uso lleva la asociación de todos los actores que el catálogo le asigna,</text><text x="235.0" y="332.6" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">también la de ACT-05.</text><text x="235.0" y="348.6" font-size="10" text-anchor="start" dominant-baseline="central" fill="#1F3A5F">Con borde discontinuo, los casos de uso de otro diagrama, solo como referencia.</text></g></svg>